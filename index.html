    // ---- CreativeToolkit (main tab component) ----
    function CreativeToolkit({ campaign, toolkit, onToolkitChange, userEmail }) {
      const placements = Array.isArray(toolkit && toolkit.placements) ? toolkit.placements : [];

      const defaultMediaBuyer = userEmail || 'Sydnie/Pathlabs';

      const updatePlacements = (nextList) => {
        onToolkitChange({ ...(toolkit || {}), placements: nextList });
      };

      const addPlacement = (defaults = {}) => {
        const p = blankPlacement({ mediaBuyer: defaults.mediaBuyer || defaultMediaBuyer, ...defaults });
        updatePlacements([...placements, p]);
      };

      const addFromPreset = (preset) => {
        const p = blankPlacement({
          vendor: preset.vendor || '',
          mediaType: preset.mediaType || '',
          spec: preset.spec || '',
          mediaBuyer: preset.mediaBuyer || defaultMediaBuyer,
        });
        updatePlacements([...placements, p]);
      };

      const updatePlacement = (next) => {
        updatePlacements(placements.map((p) => (p.id === next.id ? next : p)));
      };

      const duplicatePlacement = (id) => {
        const src = placements.find((p) => p.id === id);
        if (!src) return;
        const copy = { ...src, id: newPlacementId(), adNumber: '' };
        const idx = placements.findIndex((p) => p.id === id);
        const next = placements.slice();
        next.splice(idx + 1, 0, copy);
        updatePlacements(next);
      };

      const deletePlacement = (id) => {
        updatePlacements(placements.filter((p) => p.id !== id));
      };

      const launchDate = campaign.launch_date ? parseDateSafe(campaign.launch_date) : null;

      const grouped = useMemo(() => {
        const map = groupByVendor(placements);
        // preserve insertion order via Array.from
        return Array.from(map.entries());
      }, [placements]);

      const handleDownload = () => {
        generateToolkitPDF({ campaign, placements });
      };

      // Handoff countdown — recomputed every minute so the card stays fresh.
      const handoff = useMemo(() => computeToolkitHandoff(campaign), [campaign.launch_date, toolkit && toolkit.handoffDaysBeforeLaunch]);
      const handoffTone = HANDOFF_TONES[handoff.tone];
      const setHandoffLead = (n) => {
        const clamped = Math.max(0, Math.min(60, Math.round(Number(n) || 0)));
        onToolkitChange({ ...(toolkit || {}), handoffDaysBeforeLaunch: clamped });
      };

      return (
        <div className="space-y-4">
          {/* Toolkit header */}
          <div className="bg-stone-900 border border-stone-800 rounded-sm p-5 shadow-lg shadow-black/20">
            <div className="flex items-start justify-between gap-3 flex-wrap">
              <div className="min-w-0">
                <div className="text-[10px] uppercase tracking-[0.3em] font-bold text-orange-400 mb-1">Creative Toolkit</div>
                <h2 className="text-2xl font-black text-amber-50 tracking-tight">{campaign.name || 'Untitled Campaign'}</h2>
                <div className="mt-1 flex items-center gap-3 flex-wrap text-xs">
                  {campaign.client && <span className="text-stone-400">{campaign.client}</span>}
                  {launchDate && (
                    <>
                      <span className="text-stone-700">·</span>
                      <span className="text-stone-400 flex items-center gap-1">
                        <Calendar className="w-3 h-3" /> Launch {fmtDateShort(launchDate)}
                      </span>
                    </>
                  )}
                </div>
              </div>
              <div className="flex items-center gap-2 flex-shrink-0">
                <button
                  onClick={() => addPlacement()}
                  className="flex items-center gap-1.5 px-3 py-2 bg-stone-800 border border-stone-700 text-stone-200 rounded-sm text-xs font-bold uppercase tracking-wider hover:bg-stone-700 hover:border-amber-400/50 transition-colors"
                >
                  <Plus className="w-4 h-4" /> Add Placement
                </button>
                <button
                  onClick={handleDownload}
                  disabled={placements.length === 0}
                  className="flex items-center gap-1.5 px-3 py-2 bg-orange-500 text-stone-950 rounded-sm text-xs font-black uppercase tracking-wider hover:bg-orange-400 disabled:opacity-40 disabled:cursor-not-allowed transition-colors"
                  title={placements.length === 0 ? 'Add a placement first' : 'Download branded PDF'}
                >
                  <Download className="w-4 h-4" /> Download PDF
                </button>
              </div>
            </div>
          </div>

          {/* Handoff countdown — keeps creative aware of the Pathlabs handoff deadline */}
          <div className={`border rounded-sm p-4 ${handoffTone.bg} ${handoffTone.border}`}>
            <div className="flex items-start justify-between gap-4 flex-wrap">
              <div className="min-w-0 flex-1">
                <div className="flex items-center gap-2 mb-1">
                  <Clock className={`w-4 h-4 ${handoffTone.text}`} />
                  <span className="text-[10px] font-black uppercase tracking-[0.25em] text-stone-400">Pass to Paid Media By</span>
                </div>
                <div className={`text-xl font-black tracking-tight ${handoffTone.text}`}>
                  {handoff.label}
                </div>
                <div className="mt-1 text-xs text-stone-400 flex items-center gap-2 flex-wrap">
                  {handoff.handoff ? (
                    <>
                      <span>Pass to Paid Media Team by <span className="text-stone-200 font-bold">{fmtDateShort(handoff.handoff)}</span></span>
                      {handoff.launch && (
                        <>
                          <span className="text-stone-700">·</span>
                          <span>Launch {fmtDateShort(handoff.launch)}</span>
                        </>
                      )}
                    </>
                  ) : (
                    <span className="italic">Add a launch date to start the countdown.</span>
                  )}
                </div>
                <div className="mt-2 text-[10px] text-stone-500 italic">
                  Buffer accounts for Paid Media → Pathlabs handoff. Same-day passthrough isn't always possible.
                </div>
              </div>
              <div className="flex items-center gap-2 flex-shrink-0">
                <label className="text-[10px] font-bold uppercase tracking-widest text-stone-400">Pass to Paid Media</label>
                <input
                  type="number"
                  min="0"
                  max="60"
                  value={handoff.lead}
                  onChange={(e) => setHandoffLead(e.target.value)}
                  className="w-14 bg-stone-950 border border-stone-700 text-amber-50 text-xs font-bold rounded-sm px-2 py-1 text-center focus:outline-none focus:border-orange-500"
                />
                <span className="text-[10px] font-bold uppercase tracking-widest text-stone-400">biz days before launch</span>
              </div>
            </div>
          </div>

          {/* Preset shelf */}
          <PresetShelf onPick={addFromPreset} />

          {/* Placements */}
          {placements.length === 0 ? (
            <div className="bg-stone-900 border-2 border-dashed border-stone-700 rounded-sm p-12 text-center">
              <FolderOpen className="w-10 h-10 text-stone-600 mx-auto mb-3" />
              <h3 className="text-amber-50 font-black uppercase tracking-wider mb-1">No placements yet</h3>
              <p className="text-sm text-stone-400 mb-4">Pick a preset above or add a custom placement.</p>
              <button
                onClick={() => addPlacement()}
                className="inline-flex items-center gap-1.5 px-3 py-2 bg-amber-400 text-stone-950 rounded-sm text-xs font-bold uppercase tracking-wider hover:bg-amber-300 transition-colors"
              >
                <Plus className="w-4 h-4" /> Add Placement
              </button>
            </div>
          ) : (
            <div className="space-y-6">
              {grouped.map(([vendorName, vendorPlacements]) => (
                <div key={vendorName} className="space-y-2">
                  <div className="flex items-center gap-2 pl-3 py-2 bg-gradient-to-r from-orange-500/20 via-orange-500/5 to-transparent border-l-4 border-orange-500 rounded-sm">
                    <h3 className="font-black text-sm uppercase tracking-[0.2em] text-amber-50">
                      {vendorName || 'Unassigned'}
                    </h3>
                    <span className="text-[10px] font-bold uppercase tracking-widest text-stone-400">
                      {vendorPlacements.length} placement{vendorPlacements.length === 1 ? '' : 's'}
                    </span>
                  </div>
                  <div className="space-y-3">
                    {vendorPlacements.map((p) => (
                      <PlacementCard
                        key={p.id}
                        placement={p}
                        vendorPlacements={vendorPlacements}
                        onChange={updatePlacement}
                        onDuplicate={() => duplicatePlacement(p.id)}
                        onDelete={() => deletePlacement(p.id)}
                      />
                    ))}
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    // ============================================================
    // CAMPAIGN DETAIL (wraps blueprint + toolkit + debounced saves)
    // ============================================================
    function CampaignDetail({ campaign, onBack, onSaved, onLocalUpdate, userEmail }) {
      const isToolkitOnly = !!(campaign.data && campaign.data.kind === 'toolkit');
      const [saveState, setSaveState] = useState('idle'); // idle | saving | saved | error
      const [saveError, setSaveError] = useState('');
      // For standalone toolkits we lock the tab to 'toolkit' (no blueprint).
      const [activeTab, setActiveTab] = useState(isToolkitOnly ? 'toolkit' : 'blueprint');
      const pendingRef = useRef(null);
      const timerRef = useRef(null);
      const savedTimerRef = useRef(null);

      // Track the latest full row we've either received or pushed, so that
      // partial changes (blueprint OR toolkit) merge into a complete payload.
      const latestRef = useRef({
        name: campaign.name,
        client: campaign.client,
        launch_date: campaign.launch_date,
        data: campaign.data || {},
      });

      // When campaign id switches, rehydrate the ref
      useEffect(() => {
        latestRef.current = {
          name: campaign.name,
          client: campaign.client,
          launch_date: campaign.launch_date,
          data: campaign.data || {},
        };
        setActiveTab(campaign.data && campaign.data.kind === 'toolkit' ? 'toolkit' : 'blueprint');
      }, [campaign.id]);

      const flush = useCallback(async () => {
        if (!pendingRef.current) return;
        const payload = pendingRef.current;
        pendingRef.current = null;
        setSaveState('saving');
        setSaveError('');
        try {
          const update = {
            name: payload.name,
            client: payload.client,
            launch_date: payload.launch_date,
            data: payload.data,
            updated_at: new Date().toISOString(),
          };
          const { data, error } = await sb.from('campaigns').update(update).eq('id', campaign.id).select().single();
          if (error) throw error;
          setSaveState('saved');
          if (onSaved && data) onSaved(data);
          if (savedTimerRef.current) clearTimeout(savedTimerRef.current);
          savedTimerRef.current = setTimeout(() => {
            setSaveState((s) => (s === 'saved' ? 'idle' : s));
          }, 2000);
        } catch (err) {
          console.error('Save failed:', err);
          setSaveError(err.message || 'Connection issue.');
          setSaveState('error');
          // Put it back for retry
          pendingRef.current = payload;
        }
      }, [campaign.id, onSaved]);

      // Blueprint pushes its subset of data. We merge with the existing
      // toolkit slice so the toolkit is never wiped.
      const handleBlueprintChange = useCallback((payload) => {
        const prevData = latestRef.current.data || {};
        const merged = {
          name: payload.name,
          client: payload.client,
          launch_date: payload.launch_date,
          data: {
            ...prevData,
            ...(payload.data || {}),
            // preserve toolkit
            toolkit: (prevData && prevData.toolkit) || undefined,
            // preserve kind discriminator (defensive — blueprint shouldn't
            // run for kind === 'toolkit' rows, but never wipe it just in case)
            ...(prevData.kind ? { kind: prevData.kind } : {}),
          },
        };
        // strip undefined toolkit to keep payload clean
        if (merged.data.toolkit === undefined) delete merged.data.toolkit;
        latestRef.current = merged;
        pendingRef.current = merged;
        if (onLocalUpdate) {
          onLocalUpdate({ ...campaign, ...merged });
        }
        if (timerRef.current) clearTimeout(timerRef.current);
        timerRef.current = setTimeout(flush, 800);
      }, [flush, onLocalUpdate, campaign]);

      // Toolkit pushes only its slice.
      const handleToolkitChange = useCallback((nextToolkit) => {
        const prevData = latestRef.current.data || {};
        const merged = {
          name: latestRef.current.name,
          client: latestRef.current.client,
          launch_date: latestRef.current.launch_date,
          data: {
            ...prevData,
            // preserve the kind discriminator for standalone toolkits
            ...(prevData.kind ? { kind: prevData.kind } : {}),
            toolkit: nextToolkit,
          },
        };
        latestRef.current = merged;
        pendingRef.current = merged;
        if (onLocalUpdate) {
          onLocalUpdate({ ...campaign, ...merged });
        }
        if (timerRef.current) clearTimeout(timerRef.current);
        timerRef.current = setTimeout(flush, 800);
      }, [flush, onLocalUpdate, campaign]);

      const handleRetry = useCallback(() => { flush(); }, [flush]);

      // Flush pending changes on unmount
      useEffect(() => {
        return () => {
          if (timerRef.current) { clearTimeout(timerRef.current); timerRef.current = null; }
          if (savedTimerRef.current) { clearTimeout(savedTimerRef.current); savedTimerRef.current = null; }
          if (pendingRef.current) { flush(); }
        };
      }, [flush]);

      const saveLabel = saveState === 'saving' ? 'Saving…'
        : saveState === 'saved' ? 'Saved'
        : saveState === 'error' ? "Couldn't save"
        : '';

      const toolkit = (campaign.data && campaign.data.toolkit) || { placements: [] };

      return (
        <div className="min-h-screen bg-stone-950 print:bg-white">
          {/* Save-error banner (shared across tabs) */}
          {saveState === 'error' && (
            <div className="print:hidden bg-red-900/50 border-b border-red-800 px-4 md:px-6 py-2">
              <div className="max-w-7xl mx-auto flex items-center gap-2 text-sm text-red-100">
                <AlertCircle className="w-4 h-4" />
                <span className="font-bold">Couldn't save</span>
                <span className="text-red-300 text-xs">{saveError || 'Connection issue.'}</span>
                <button onClick={handleRetry} className="ml-auto px-2 py-1 bg-red-800 hover:bg-red-700 rounded-sm text-xs font-bold uppercase tracking-wider">Retry</button>
              </div>
            </div>
          )}

          {/* Top bar: Back + Save indicator + Tab switcher */}
          <div className="print:hidden max-w-7xl mx-auto px-4 md:px-6 pt-4">
            <div className="flex items-center justify-between flex-wrap gap-2 mb-3">
              <button onClick={onBack} className="flex items-center gap-1.5 text-xs uppercase tracking-wider font-bold text-stone-400 hover:text-amber-300 transition-colors">
                <ArrowLeft className="w-4 h-4" /> Back to Dashboard
              </button>
              {saveLabel && (
                <div className={`flex items-center gap-1.5 text-[11px] font-bold uppercase tracking-wider ${saveState === 'saving' ? 'text-stone-400' : saveState === 'saved' ? 'text-emerald-400' : 'text-red-400'}`}>
                  {saveState === 'saving' && <Loader2 className="w-3 h-3 animate-spin" />}
                  {saveState === 'saved' && <CheckCircle2 className="w-3 h-3" />}
                  {saveState === 'error' && <AlertCircle className="w-3 h-3" />}
                  {saveLabel}
                </div>
              )}
            </div>
            {!isToolkitOnly && (
              <div className="flex items-center gap-0.5 bg-stone-900 border border-stone-800 rounded-sm p-0.5 w-fit mb-4">
                <button
                  onClick={() => setActiveTab('blueprint')}
                  className={`px-3 py-1.5 text-xs font-bold uppercase tracking-wider rounded-sm transition-colors ${activeTab === 'blueprint' ? 'bg-amber-400 text-stone-950' : 'text-stone-400 hover:text-stone-200'}`}
                >
                  Blueprint
                </button>
                <button
                  onClick={() => setActiveTab('toolkit')}
                  className={`px-3 py-1.5 text-xs font-bold uppercase tracking-wider rounded-sm transition-colors ${activeTab === 'toolkit' ? 'bg-orange-500 text-stone-950' : 'text-stone-400 hover:text-stone-200'}`}
                >
                  Creative Toolkit
                </button>
              </div>
            )}
            {isToolkitOnly && (
              <div className="mb-4 inline-flex items-center gap-2 px-3 py-1 bg-orange-500/15 border border-orange-500/40 rounded-sm">
                <span className="text-[10px] font-black uppercase tracking-[0.2em] text-orange-300">Standalone Toolkit</span>
              </div>
            )}
          </div>

          {activeTab === 'blueprint' && !isToolkitOnly ? (
            <CampaignLaunchBlueprint
              campaign={campaign}
              onBack={onBack}
              onChange={handleBlueprintChange}
              saveState={saveState}
              saveError={saveError}
              onRetry={handleRetry}
              hideTopBar
            />
          ) : (
            <div className="max-w-7xl mx-auto px-4 md:px-6 pb-10">
              <CreativeToolkit
                campaign={campaign}
                toolkit={toolkit}
                onToolkitChange={handleToolkitChange}
                userEmail={userEmail}
              />
            </div>
          )}
        </div>
      );
    }

    // ============================================================
    // APP (top-level)
    // ============================================================
    function App() {
      return (
        <AuthGate>
          {({ session, onSignOut }) => <AuthedApp session={session} onSignOut={onSignOut} />}
        </AuthGate>
      );
    }

    function AuthedApp({ session, onSignOut }) {
      const [campaigns, setCampaigns] = useState([]);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState('');
      const [activeId, setActiveId] = useState(null);
      // Which kind of "+ New …" modal to show: null | 'campaign' | 'toolkit'.
      // The Dashboard's pill toggle drives this when the user clicks the
      // create button so the right modal opens for the active tab.
      const [showNew, setShowNew] = useState(null);
      // Kind toggle on the Dashboard ('campaign' default | 'toolkit').
      // Lifted here so the back-button from a detail view can return the
      // user to the same tab they came from. Pure React state — no
      // localStorage / sessionStorage per spec.
      const [dashboardKind, setDashboardKind] = useState('campaign');
      // Reporting items live here so both the Reporting tab and the main
      // Calendar view share a single source of truth. Persisted to
      // localStorage on every change.
      const [reportingItems, setReportingItems] = useState(() => loadReportingItems());
      useEffect(() => { saveReportingItems(reportingItems); }, [reportingItems]);

      const loadCampaigns = useCallback(async () => {
        setLoading(true);
        setError('');
        try {
          const { data, error } = await sb
            .from('campaigns')
            .select('*')
            .order('launch_date', { ascending: true, nullsFirst: false });
          if (error) throw error;
          setCampaigns(data || []);
        } catch (err) {
          console.error('Load failed:', err);
          setError(err.message || 'Failed to load campaigns.');
        } finally {
          setLoading(false);
        }
      }, []);

      useEffect(() => { loadCampaigns(); }, [loadCampaigns]);

      const activeCampaign = useMemo(
        () => campaigns.find((c) => c.id === activeId) || null,
        [campaigns, activeId]
      );

      const updateLocal = useCallback((next) => {
        setCampaigns((prev) => prev.map((c) => (c.id === next.id ? { ...c, ...next } : c)));
      }, []);

      const handleCreate = async ({ name, client, launch_date, data }) => {
        const { data: row, error } = await sb.from('campaigns').insert({
          name, client, launch_date, data,
          user_id: session.user.id,
          status: 'active',
        }).select().single();
        if (error) throw error;
        setCampaigns((prev) => [row, ...prev]);
        // After creating a toolkit, flip the dashboard tab so back-navigation
        // returns the user to where they expect (the Toolkits tab).
        if (data && data.kind === 'toolkit') setDashboardKind('toolkit');
        else setDashboardKind('campaign');
        setShowNew(null);
        setActiveId(row.id);
      };

      const handleArchive = async (c) => {
        const prev = campaigns;
        setCampaigns(campaigns.map((x) => x.id === c.id ? { ...x, status: 'archived' } : x));
        const { error } = await sb.from('campaigns').update({ status: 'archived' }).eq('id', c.id);
        if (error) { setCampaigns(prev); alert('Archive failed: ' + error.message); }
      };
      const handleUnarchive = async (c) => {
        const prev = campaigns;
        setCampaigns(campaigns.map((x) => x.id === c.id ? { ...x, status: 'active' } : x));
        const { error } = await sb.from('campaigns').update({ status: 'active' }).eq('id', c.id);
        if (error) { setCampaigns(prev); alert('Unarchive failed: ' + error.message); }
      };
      const handleDuplicate = async (c) => {
        try {
          const isToolkit = !!(c.data && c.data.kind === 'toolkit');
          let dataCopy;
          if (isToolkit) {
            // Standalone toolkit: just clone placements w/ fresh ids.
            const srcPlacements = (c.data && c.data.toolkit && Array.isArray(c.data.toolkit.placements))
              ? c.data.toolkit.placements
              : [];
            const cloned = JSON.parse(JSON.stringify(srcPlacements)).map((p) => ({ ...p, id: newPlacementId() }));
            dataCopy = { kind: 'toolkit', toolkit: { placements: cloned } };
          } else {
            dataCopy = c.data ? JSON.parse(JSON.stringify(c.data)) : defaultCampaignData();
            dataCopy.completedTasks = {};
            dataCopy.skippedTasks = {};
            dataCopy.shiftHistory = [];
            dataCopy.originalLaunchDate = '';
          }
          const baseName = c.name || (isToolkit ? 'Toolkit' : 'Campaign');
          const { data: row, error } = await sb.from('campaigns').insert({
            name: baseName + ' (copy)',
            client: c.client,
            launch_date: null,
            data: dataCopy,
            user_id: session.user.id,
            status: 'active',
          }).select().single();
          if (error) throw error;
          setCampaigns((prev) => [row, ...prev]);
        } catch (err) {
          alert('Duplicate failed: ' + (err.message || err));
        }
      };
      const handleDelete = async (c) => {
        const prev = campaigns;
        setCampaigns(campaigns.filter((x) => x.id !== c.id));
        if (activeId === c.id) setActiveId(null);
        const { error } = await sb.from('campaigns').delete().eq('id', c.id);
        if (error) { setCampaigns(prev); alert('Delete failed: ' + error.message); }
      };

      const handleSavedFromDetail = (updatedRow) => {
        setCampaigns((prev) => prev.map((c) => (c.id === updatedRow.id ? updatedRow : c)));
      };

      return (
        <div className="min-h-screen bg-stone-950 text-stone-100">
          {/* Top-right signed-in strip (hidden in detail via print & when scrolled away is fine) */}
          <div className="sticky top-0 z-40 bg-stone-950/80 backdrop-blur-sm border-b border-stone-900 print:hidden">
            <div className="max-w-7xl mx-auto px-4 md:px-6 py-2 flex items-center justify-end gap-3 text-[11px] text-stone-400">
              <span>Signed in as <span className="text-stone-200 font-semibold">{session.user.email}</span></span>
              <span className="text-stone-700">·</span>
              <button onClick={onSignOut} className="flex items-center gap-1 uppercase tracking-wider font-bold hover:text-amber-300 transition-colors">
                <LogOut className="w-3 h-3" /> Sign out
              </button>
            </div>
          </div>

          {activeCampaign ? (
            <CampaignDetail
              key={activeCampaign.id}
              campaign={activeCampaign}
              onBack={() => setActiveId(null)}
              onSaved={handleSavedFromDetail}
              onLocalUpdate={updateLocal}
              userEmail={session && session.user && session.user.email}
            />
          ) : (
            <Dashboard
              campaigns={campaigns}
              reportingItems={reportingItems}
              setReportingItems={setReportingItems}
              loading={loading}
              error={error}
              kind={dashboardKind}
              onKindChange={setDashboardKind}
              onOpen={(c) => {
                // Remember which kind tab the user came from so the
                // detail view's "Back to Dashboard" returns there.
                if (c && c.data && c.data.kind === 'toolkit') setDashboardKind('toolkit');
                else setDashboardKind('campaign');
                setActiveId(c.id);
              }}
              onNew={(k) => setShowNew(k === 'toolkit' ? 'toolkit' : 'campaign')}
              onArchive={handleArchive}
              onUnarchive={handleUnarchive}
              onDuplicate={handleDuplicate}
              onDelete={handleDelete}
              onRefresh={loadCampaigns}
            />
          )}

          {showNew === 'campaign' && (
            <NewCampaignModal
              onClose={() => setShowNew(null)}
              onCreate={handleCreate}
              existingClients={Array.from(new Set(campaigns.map((c) => (c.client || '').trim()).filter(Boolean))).sort()}
              campaigns={campaigns.filter((c) => !(c.data && c.data.kind === 'toolkit'))}
            />
          )}
          {showNew === 'toolkit' && (
            <NewToolkitModal
              onClose={() => setShowNew(null)}
              onCreate={handleCreate}
              existingClients={Array.from(new Set(campaigns.map((c) => (c.client || '').trim()).filter(Boolean))).sort()}
              campaigns={campaigns}
            />
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
