    // DATE HELPERS
    // ============================================================
    function addBusinessDays(date, days) {
      const result = new Date(date);
      if (days === 0) return result;
      const dir = days > 0 ? 1 : -1;
      let count = 0;
      const abs = Math.abs(days);
      while (count < abs) {
        result.setDate(result.getDate() + dir);
        const d = result.getDay();
        if (d !== 0 && d !== 6) count++;
      }
      return result;
    }
    function addCalendarDays(date, days) { const r = new Date(date); r.setDate(r.getDate() + days); return r; }
    function shift(date, days, businessDays) { return businessDays ? addBusinessDays(date, days) : addCalendarDays(date, days); }
    function subtract(date, days, businessDays) { return shift(date, -days, businessDays); }
    function fmtDate(d) { return d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }); }

    function fmtDateIso(d) { return d.toISOString().split('T')[0]; }
    function daysBetween(a, b) { return Math.round((b - a) / (1000 * 60 * 60 * 24)); }
    // Signed business-day count from a -> b (Mon-Fri only). Negative if b is before a.
    function businessDaysBetween(a, b) {
      const start = startOfDay(a);
      const end = startOfDay(b);
      if (+start === +end) return 0;
      const dir = end > start ? 1 : -1;
      let count = 0;
      const cur = new Date(start);
      while (+cur !== +end) {
        cur.setDate(cur.getDate() + dir);
        const d = cur.getDay();
        if (d !== 0 && d !== 6) count += dir;
      }
      return count;
    }
    function startOfDay(d) { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; }

    // TOOLKIT HANDOFF COUNTDOWN
    // Default lead time = 7 business days before launch (Pathlabs window: 6-8).
    // Handoff = launch_date − N business days. Computes a label + tone for UI.
    // ============================================================
    const TOOLKIT_HANDOFF_DEFAULT = 7;
    function computeToolkitHandoff(campaign) {
      const lead = (campaign && campaign.data && campaign.data.toolkit && Number.isFinite(campaign.data.toolkit.handoffDaysBeforeLaunch))
        ? campaign.data.toolkit.handoffDaysBeforeLaunch
        : TOOLKIT_HANDOFF_DEFAULT;
      const launch = campaign && campaign.launch_date ? parseDateSafe(campaign.launch_date) : null;
      if (!launch) {
        return { lead, launch: null, handoff: null, businessDaysLeft: null, label: 'Set a launch date', tone: 'muted' };
      }
      const handoff = startOfDay(addBusinessDays(launch, -lead));
      const today = startOfDay(new Date());
      const businessDaysLeft = businessDaysBetween(today, handoff);
      let label, tone;
      if (businessDaysLeft < 0) {
        const n = Math.abs(businessDaysLeft);
        label = `Overdue by ${n} business day${n === 1 ? '' : 's'}`;
        tone = 'red';
      } else if (businessDaysLeft === 0) {
        label = 'Pass to Paid Media today';
        tone = 'red';
      } else if (businessDaysLeft <= 5) {
        label = `${businessDaysLeft} business day${businessDaysLeft === 1 ? '' : 's'} until pass to Paid Media`;
        tone = 'orange';
      } else {
        label = `${businessDaysLeft} business days until pass to Paid Media`;
        tone = 'green';
      }
      return { lead, launch, handoff, businessDaysLeft, label, tone };

      'AM': 'bg-amber-500 text-stone-950 print:bg-amber-700 print:text-amber-50',
      'SCA': 'bg-orange-500 text-stone-950 print:bg-orange-700 print:text-orange-50',
      'Tracking': 'bg-blue-400 text-stone-950 print:bg-blue-800 print:text-blue-50',
      'Loomis': 'bg-red-500 text-stone-50 print:bg-red-800 print:text-red-50',
      'AM / Loomis': 'bg-red-500 text-stone-50 print:bg-red-800 print:text-red-50',
      'Client': 'bg-yellow-400 text-stone-950 print:bg-yellow-700 print:text-yellow-50',
      'Internal Creative': 'bg-purple-400 text-stone-950 print:bg-purple-800 print:text-purple-50',
      'Landing Page': 'bg-pink-400 text-stone-950 print:bg-pink-800 print:text-pink-50',
    };

    // ============================================================
    // CALENDAR ROLE SYSTEM
    // 4-role taxonomy used by the multi-task calendar + per-task chip.
    // The TASKS array still uses the legacy strings; ROLE_MAP collapses
    // them into one of the 4 calendar roles. taskRoleOverrides on
    // campaign.data lets the user override per-task.
    // ============================================================
    const ROLES = {
      'AM':         { label: 'AM',         color: '#2563EB', bg: '#1E3A8A' },
      'Paid Media': { label: 'Paid Media', color: '#F68E21', bg: '#7C3F0E' },
      'Pathlabs':   { label: 'Pathlabs',   color: '#0EA5A4', bg: '#0F4744' },
      'Client':     { label: 'Client',     color: '#A855F7', bg: '#5B21B6' },
      'Reporting':  { label: 'Reporting',  color: '#EC4899', bg: '#831843' },
    };
    const ROLE_KEYS = Object.keys(ROLES);
    const DEFAULT_ROLE = 'Paid Media';

    const ROLE_MAP = {
      'AM': 'AM',
      'TJA': 'Paid Media',
      'SCA': 'Pathlabs',
      'Tracking': 'Pathlabs',
      'Client': 'Client',
    };

    function defaultRoleFor(legacyRole) {
      if (!legacyRole) return DEFAULT_ROLE;
      // Handle compound legacy roles like "AM / Loomis" by checking
      // the first segment for a known mapping.
      if (ROLE_MAP[legacyRole]) return ROLE_MAP[legacyRole];
      const first = String(legacyRole).split('/')[0].trim();
      if (ROLE_MAP[first]) return ROLE_MAP[first];
      return DEFAULT_ROLE;
    }

    function resolveTaskRole(taskId, legacyRole, overrides) {
      if (overrides && overrides[taskId] && ROLES[overrides[taskId]]) return overrides[taskId];
      return defaultRoleFor(legacyRole);
    }

    // Build the list of calendar events for the active set of campaigns.
    // Mirrors the blueprint's task-filtering logic so what shows up on the
    // calendar matches exactly what the campaign detail view shows.
    function buildCalendarEvents(campaigns) {
      const events = [];
      campaigns.forEach((c) => {
        if (!c || c.status === 'archived') return;
        if (!c.launch_date) return;
        const launch = parseDateSafe(c.launch_date);
        if (!launch) return;

        const data = c.data || {};
        const isToolkit = data.kind === 'toolkit';

        // Toolkits have no blueprint/tasks. Just emit a launch marker
        // so they show up as a flag on the calendar. They appear in
        // the popover as "LAUNCH (Toolkit)" so users can tell them apart.
        if (isToolkit) {
          events.push({
            campaignId: c.id,
            campaignName: c.name || 'Untitled toolkit',
            client: c.client || '',
            taskId: `__launch__${c.id}`,
            taskName: 'LAUNCH',
            date: launch,
            role: 'Paid Media',
            completed: false,
            isLaunchDate: true,
            isCustom: false,
            isToolkit: true,
          });
          return;
        }

        const campaignType = data.campaignType || 'net-new';
        const preset = CAMPAIGN_TYPES[campaignType] || CAMPAIGN_TYPES['net-new'];
        const channels = data.channels || {};
        const requirements = data.requirements || {};
        const businessDays = data.businessDays !== false;
        const completedTasks = data.completedTasks || {};
        const skippedTasks = data.skippedTasks || {};
        const customTasks = Array.isArray(data.customTasks) ? data.customTasks : [];
        const includeInternalCreative = !!data.includeInternalCreative;
        const internalStages = Array.isArray(data.internalStages) ? data.internalStages : [];
        const includeLandingPage = !!data.includeLandingPage;
        const landingPageStages = Array.isArray(data.landingPageStages) ? data.landingPageStages : [];
        const includeDashboard = data.includeDashboard !== false;
        const dashboardLeadDays = Math.max(0, Math.min(4, Number(data.dashboardLeadDays) || 2));
        const overrides = data.taskRoleOverrides || {};

        const flags = { ...requirements };
        Object.keys(channels).forEach((k) => { if (channels[k]) flags[k] = true; });

        const taskPasses = (t) => {
          if (preset.excludedPhases && preset.excludedPhases.includes(t.phase)) return false;
          if (preset.excludedTasks && preset.excludedTasks.includes(t.id)) return false;
          if (t.requires && !t.requires.every((r) => flags[r])) return false;
          if (t.requiresAny && !t.requiresAny.some((r) => flags[r])) return false;
          return true;
        };

        const pushEvent = (taskId, taskName, date, legacyRole, isCustom) => {
          if (!date || isNaN(date.getTime())) return;
          if (skippedTasks[taskId]) return;
          events.push({
            campaignId: c.id,
            campaignName: c.name || 'Untitled campaign',
            client: c.client || '',
            taskId,
            taskName,
            date,
            role: resolveTaskRole(taskId, legacyRole, overrides),
            completed: !!completedTasks[taskId],
            isLaunchDate: false,
            isCustom: !!isCustom,
          });
        };

        // Pre-launch master tasks
        TASKS.filter(taskPasses).forEach((t) => {
          const dp = Number(t.daysPrior);
          const safeDp = isNaN(dp) ? 0 : dp;
          // daysPrior < 0 => post-launch (matches existing convention)
          const date = safeDp >= 0
            ? subtract(launch, safeDp, businessDays)
            : shift(launch, Math.abs(safeDp), businessDays);
          pushEvent(t.id, t.name, date, t.role, false);
        });

        // Custom tasks (user-defined)
        customTasks.forEach((t) => {
          const dp = Number(t.daysPrior);
          const safeDp = isNaN(dp) ? 0 : dp;
          const date = safeDp >= 0
            ? subtract(launch, safeDp, businessDays)
            : shift(launch, Math.abs(safeDp), businessDays);
          pushEvent(t.id, t.name, date, t.role, true);
        });

        // Internal creative stages
        if (includeInternalCreative) {
          let cumulative = 3;
          [...internalStages].reverse().forEach((stage) => {
            cumulative += Number(stage.days) || 0;
            const id = `internal-${stage.id}`;
            const date = subtract(launch, cumulative, businessDays);
            pushEvent(id, stage.name, date, 'Internal Creative', false);
          });
        }

        // Landing page development stages
        if (includeLandingPage) {
          // LPs need to be live before tracking can be QA'd, which the master
          // checklist places ~6 days before launch ('lp-mobile-qa'). So we
          // anchor the LP runway with a 6-day buffer to launch.
          let cumulative = 6;
          [...landingPageStages].reverse().forEach((stage) => {
            cumulative += Number(stage.days) || 0;
            const id = `landingpage-${stage.id}`;
            const date = subtract(launch, cumulative, businessDays);
            pushEvent(id, stage.name, date, 'Landing Page', false);
          });
        }

        // Post-launch (dashboard / day-1 / week-1)
        if (includeDashboard && !(preset.excludedPhases || []).includes('Post-Launch')) {
          const post = [
            { id: 'dashboard-draft', name: 'Dashboard draft provided for review', after: dashboardLeadDays, role: 'AM' },
            { id: 'day-1-check', name: 'Day-1 performance check', after: 1, role: 'TJA' },
            { id: 'week-1-optimize', name: 'Week-1 optimization review', after: 7, role: 'TJA' },
          ];
          post.forEach((p) => {
            const date = shift(launch, p.after, businessDays);
            pushEvent(p.id, p.name, date, p.role, false);
          });
        }

        // Launch-date marker
        events.push({
          campaignId: c.id,
          campaignName: c.name || 'Untitled campaign',
          client: c.client || '',
          taskId: `__launch__${c.id}`,
          taskName: 'LAUNCH',
          date: launch,
          role: 'Paid Media',
          completed: false,
          isLaunchDate: true,
          isCustom: false,
          isToolkit: false,
        });
      });
      return events;
    }

    // Convert reporting items into the same event shape used by the campaign
    // calendar so they render as colored dots / popover entries alongside
    // campaign tasks. Each reporting item produces up to 3 events (one per
    // milestone date). Reporting cycle month is preserved on the event so
    // popovers can label them, e.g. "April Reporting → Pathlabs to TJA".
    function buildReportingEvents(reportingItems) {
      if (!Array.isArray(reportingItems)) return [];
      const events = [];
      const milestones = [
        ['pathlabsDueToTJA', 'Pathlabs → TJA'],
        ['internalProofing', 'Internal Proof'],
        ['dueToClient', 'Due to Client'],
      ];
      reportingItems.forEach((item) => {
        if (!item) return;
        const cycleLabel = item.month ? fmtMonthLabel(item.month) : '';
        milestones.forEach(([field, label]) => {
          const iso = item[field];
          if (!iso) return;
          const d = parseDateSafe(iso);
          if (!d || isNaN(d.getTime())) return;
          // A milestone is considered done if the row is fully complete OR
          // the milestone has its own check (e.g. Pathlabs report received).
          const milestoneDone = !!item.complete
            || (field === 'pathlabsDueToTJA' && !!item.pathlabsReceived);
          events.push({
            campaignId: `__reporting__${item.id}`,
            campaignName: `${cycleLabel} Reporting`.trim() || 'Reporting',
            client: item.client || '',
            taskId: `${item.id}-${field}`,
            taskName: `${item.client || 'Client'} · ${item.department || ''} — ${label}`,
            date: d,
            role: 'Reporting',
            completed: milestoneDone,
            isLaunchDate: false,
            isCustom: false,
            isReporting: true,
            reportingMilestone: label,
          });
        });
      });
      return events;
    }

    function getTaskStatus(task, completedTasks, skippedTasks, today) {
      if (skippedTasks[task.id]) return 'skipped';
      if (completedTasks[task.id]) return 'done';
      const d = startOfDay(task.date);
      const t = startOfDay(today);
      const diffDays = daysBetween(t, d);
      if (task.timing === 'post') {
        if (diffDays < 0) return 'pending-overdue';
        return 'pending-future';
      }
      if (diffDays < 0) return 'overdue';
      if (diffDays === 0) return 'due-today';
      if (diffDays <= 2) return 'due-soon';
      return 'upcoming';
    }

    const STATUS_STYLES = {
      'done': { icon: CheckCircle2, iconClass: 'text-emerald-400', label: 'Done', bg: 'bg-emerald-950/30' },
      'skipped': { icon: SkipForward, iconClass: 'text-stone-500', label: 'N/A', bg: 'bg-stone-800/40' },
      'overdue': { icon: AlertTriangle, iconClass: 'text-red-400', label: 'Overdue', bg: 'bg-red-950/30' },
      'due-today': { icon: Clock, iconClass: 'text-orange-400', label: 'Due today', bg: 'bg-orange-950/30' },
      'due-soon': { icon: Clock, iconClass: 'text-amber-400', label: 'Due soon', bg: 'bg-amber-950/20' },
      'upcoming': { icon: CircleDashed, iconClass: 'text-stone-500', label: 'Upcoming', bg: 'bg-transparent' },
      'pending-future': { icon: Clock, iconClass: 'text-purple-400', label: 'Scheduled', bg: 'bg-transparent' },
      'pending-overdue': { icon: AlertTriangle, iconClass: 'text-red-400', label: 'Missed', bg: 'bg-red-950/30' },
