    function addBusinessDays(date, days) {
      const result = new Date(date);
      if (days === 0) return result;
      const dir = days > 0 ? 1 : -1;
      let count = 0;
      const abs = Math.abs(days);
      while (count < abs) {
        result.setDate(result.getDate() + dir);
        const d = result.getDay();
        if (d !== 0 && d !== 6) count++;
      }
      return result;
    }
    function addCalendarDays(date, days) { const r = new Date(date); r.setDate(r.getDate() + days); return r; }
    function shift(date, days, businessDays) { return businessDays ? addBusinessDays(date, days) : addCalendarDays(date, days); }

    function getTaskStatus(task, completedTasks, skippedTasks, today) {
      if (skippedTasks[task.id]) return 'skipped';
      if (completedTasks[task.id]) return 'done';
      const d = startOfDay(task.date);
      const t = startOfDay(today);
      const diffDays = daysBetween(t, d);
      if (task.timing === 'post') {
        if (diffDays < 0) return 'pending-overdue';
        return 'pending-future';
      }
      if (diffDays < 0) return 'overdue';
      if (diffDays === 0) return 'due-today';
      if (diffDays <= 2) return 'due-soon';
      return 'upcoming';
    }

      try {
        const data = campaign.data || {};
        const launchDate = campaign.launch_date;
        if (!launchDate) return { completed: 0, total: 0, pct: 0 };

        const launch = parseDateSafe(launchDate);
        if (!launch) return { completed: 0, total: 0, pct: 0 };

        const campaignType = data.campaignType || 'net-new';
        const preset = CAMPAIGN_TYPES[campaignType] || CAMPAIGN_TYPES['net-new'];
        const channels = data.channels || {};
        const requirements = data.requirements || {};
        const businessDays = data.businessDays !== false;
        const completedTasks = data.completedTasks || {};
        const skippedTasks = data.skippedTasks || {};
        const customTasks = Array.isArray(data.customTasks) ? data.customTasks : [];
        const includeInternalCreative = !!data.includeInternalCreative;
        const internalStages = Array.isArray(data.internalStages) ? data.internalStages : [];
        const includeDashboard = data.includeDashboard !== false;
        const dashboardLeadDays = Number(data.dashboardLeadDays) || 2;

        const flags = { ...requirements };
        Object.keys(channels).forEach((k) => { if (channels[k]) flags[k] = true; });

        const taskPasses = (t) => {
          if (preset.excludedPhases.includes(t.phase)) return false;
          if (preset.excludedTasks && preset.excludedTasks.includes(t.id)) return false;
          if (t.requires && !t.requires.every((r) => flags[r])) return false;
          if (t.requiresAny && !t.requiresAny.some((r) => flags[r])) return false;
          return true;
        };

        const filtered = TASKS.filter(taskPasses).map((t) => ({ ...t, timing: 'pre' }));
        const custom = customTasks.map((t) => ({ ...t, timing: 'pre', isCustom: true }));

        const internalTasks = [];
        if (includeInternalCreative) {
          let cumulative = 3;
          [...internalStages].reverse().forEach((stage) => {
            cumulative += Number(stage.days) || 0;
            internalTasks.unshift({
              id: `internal-${stage.id}`, phase: 'Internal Creative', name: stage.name,
              daysPrior: cumulative, role: 'Internal Creative', timing: 'pre',
            });
          });
        }

        const postLaunch = [];
        if (includeDashboard && !preset.excludedPhases.includes('Post-Launch')) {
          const leadDays = Math.max(0, Math.min(4, dashboardLeadDays));
          postLaunch.push({ id: 'dashboard-draft', timing: 'post' });
          postLaunch.push({ id: 'day-1-check', timing: 'post' });
          postLaunch.push({ id: 'week-1-optimize', timing: 'post' });
        }

        const all = [...filtered, ...custom, ...internalTasks, ...postLaunch];
        const active = all.filter((t) => !skippedTasks[t.id]);
        const completed = active.filter((t) => completedTasks[t.id]).length;
        const total = active.length;
        const pct = total === 0 ? 0 : Math.round((completed / total) * 100);
        return { completed, total, pct };
      } catch (e) {
        console.warn('Progress calc failed:', e);
        return { completed: 0, total: 0, pct: 0 };
      }
    }

    // ============================================================
    // AUTH GATE
    // ============================================================
    function AuthGate({ children }) {
      const [session, setSession] = useState(null);
      const [loading, setLoading] = useState(true);
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [signingIn, setSigningIn] = useState(false);
      const [error, setError] = useState('');

      useEffect(() => {
        let mounted = true;
        sb.auth.getSession().then(({ data }) => {
          if (!mounted) return;
          setSession(data.session || null);
          setLoading(false);
        }).catch(() => {
          if (!mounted) return;
          setLoading(false);
        });
        const { data: sub } = sb.auth.onAuthStateChange((_event, newSession) => {
          setSession(newSession || null);
        });
        return () => {
          mounted = false;
          if (sub && sub.subscription) sub.subscription.unsubscribe();
        };
      }, []);

      const handleSignIn = async (e) => {
        e.preventDefault();
        setError('');
        setSigningIn(true);
        try {
          const { error } = await sb.auth.signInWithPassword({ email, password });
          if (error) setError(error.message || 'Sign-in failed');
        } catch (err) {
          setError(err.message || 'Sign-in failed');
        } finally {
          setSigningIn(false);
        }
      };

      const handleSignOut = async () => {
        await sb.auth.signOut();
        setSession(null);
      };

      if (loading) {
        return (
          <div className="min-h-screen flex items-center justify-center bg-stone-950 text-stone-400">
            <Loader2 className="w-6 h-6 animate-spin mr-2" /> Loading…
          </div>
        );
      }

      if (!session) {
        return (
          <div className="min-h-screen flex items-center justify-center bg-stone-950 p-4">
            <div className="w-full max-w-sm bg-stone-900 border border-stone-800 rounded-sm p-8 shadow-2xl">
              <div className="flex items-center gap-2 mb-6">
                <div className="w-10 h-10 bg-amber-400 rounded-sm flex items-center justify-center">
                  <Zap className="w-5 h-5 text-stone-950" fill="currentColor" strokeWidth={0} />
                </div>
                <div>
                  <div className="text-[10px] uppercase tracking-[0.3em] font-bold text-amber-400">The James Agency</div>
                  <h1 className="text-lg font-black text-amber-50 uppercase tracking-tight">Campaign Launch</h1>
                </div>
              </div>
              <form onSubmit={handleSignIn} className="space-y-3">
                <div>
                  <label className="block text-[11px] font-bold uppercase tracking-wider text-stone-400 mb-1">Email</label>
                  <input type="email" required value={email} onChange={(e) => setEmail(e.target.value)} className="w-full px-3 py-2 bg-stone-800 border border-stone-700 rounded-sm text-sm text-stone-100 focus:outline-none focus:ring-2 focus:ring-amber-400" autoFocus />
                </div>
                <div>
                  <label className="block text-[11px] font-bold uppercase tracking-wider text-stone-400 mb-1">Password</label>
                  <input type="password" required value={password} onChange={(e) => setPassword(e.target.value)} className="w-full px-3 py-2 bg-stone-800 border border-stone-700 rounded-sm text-sm text-stone-100 focus:outline-none focus:ring-2 focus:ring-amber-400" />
                </div>
                {error && (
                  <div className="flex items-start gap-2 p-2.5 bg-red-950/40 border border-red-800/50 rounded-sm text-xs text-red-300">
                    <AlertCircle className="w-4 h-4 flex-shrink-0 mt-0.5" />
                    <span>{error}</span>
                  </div>
                )}
                <button type="submit" disabled={signingIn} className="w-full flex items-center justify-center gap-2 px-3 py-2.5 bg-amber-400 text-stone-950 rounded-sm text-xs font-bold uppercase tracking-wider hover:bg-amber-300 disabled:opacity-50">
                  {signingIn ? <><Loader2 className="w-4 h-4 animate-spin" /> Signing in…</> : <><LogIn className="w-4 h-4" /> Sign in</>}
                </button>
              </form>
            </div>
          </div>
        );
      }

      return children({ session, onSignOut: handleSignOut });
    }

                  <LayoutGrid className="w-3.5 h-3.5" /> List

                <Plus className="w-4 h-4" /> New Campaign
              </button>
            </div>
          </div>

          {/* Filter strip */}
          {view === 'list' && (
            <div className="flex items-center gap-2 flex-wrap mb-4 bg-stone-900 border border-stone-800 rounded-sm p-3">
              <div className="flex items-center gap-1.5">
                <span className="text-[10px] font-bold uppercase tracking-wider text-stone-500">Status:</span>
                <div className="flex gap-0.5 bg-stone-800 rounded-sm p-0.5">

                    <button key={s} onClick={() => setStatusFilter(s)} className={`px-2.5 py-1 text-xs uppercase tracking-wider font-bold rounded-sm transition-colors ${statusFilter === s ? 'bg-amber-400 text-stone-950' : 'text-stone-400 hover:text-stone-200'}`}>
                      {s === 'all' ? 'All' : s === 'active' ? 'Active' : 'Archived'}
                    </button>
                  ))}
                </div>
              </div>
              <div className="flex items-center gap-1.5">
                <span className="text-[10px] font-bold uppercase tracking-wider text-stone-500">Client:</span>
                <select value={clientFilter} onChange={(e) => setClientFilter(e.target.value)} className="px-2 py-1 bg-stone-800 border border-stone-700 rounded-sm text-xs text-stone-100 focus:outline-none focus:ring-1 focus:ring-amber-400">
                  <option value="all">All clients</option>
                  {allClients.map((c) => <option key={c} value={c}>{c}</option>)}
                </select>
              </div>
              <div className="flex items-center gap-1.5 ml-auto">
                <span className="text-[10px] font-bold uppercase tracking-wider text-stone-500">Sort:</span>
                <select value={sortBy} onChange={(e) => setSortBy(e.target.value)} className="px-2 py-1 bg-stone-800 border border-stone-700 rounded-sm text-xs text-stone-100 focus:outline-none focus:ring-1 focus:ring-amber-400">
                  <option value="launch">Launch date (soonest)</option>

                  <option value="name">Name A–Z</option>
                </select>
              </div>

          {/* Error */}
          {error && (
            <div className="flex items-start gap-2 p-3 mb-4 bg-red-950/40 border border-red-800/50 rounded-sm text-sm text-red-300">
              <AlertCircle className="w-4 h-4 flex-shrink-0 mt-0.5" />
              <div className="flex-1">
                <div className="font-bold">Couldn't load campaigns</div>

              <button onClick={onRefresh} className="px-2 py-1 bg-red-900/50 text-red-200 rounded-sm text-xs font-bold uppercase tracking-wider hover:bg-red-900">Retry</button>
            </div>

          {/* Content */}
          {loading ? (
            <div className="flex items-center justify-center py-16 text-stone-400">
              <Loader2 className="w-5 h-5 animate-spin mr-2" /> Loading campaigns…

              <Zap className="w-12 h-12 text-orange-500 mx-auto mb-3" fill="currentColor" strokeWidth={0} />
              <h3 className="text-amber-50 font-black uppercase tracking-wider mb-1">No campaigns yet</h3>
              <p className="text-sm text-stone-400 mb-4">Create your first one to get started.</p>
              <button onClick={onNew} className="inline-flex items-center gap-1.5 px-3 py-2 bg-amber-400 text-stone-950 rounded-sm text-xs font-bold uppercase tracking-wider hover:bg-amber-300 transition-colors">
                <Plus className="w-4 h-4" /> New Campaign
              </button>
            </div>
          ) : view === 'list' ? (
            filtered.length === 0 ? (
              <div className="bg-stone-900 rounded-sm border border-stone-800 p-8 text-center text-sm text-stone-400">
                No campaigns match these filters.
              </div>
            ) : (
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                {filtered.map((c) => (
                  <CampaignCard
                    key={c.id}
                    campaign={c}
                    onOpen={() => onOpen(c)}
                    onDuplicate={() => onDuplicate(c)}
                    onArchive={() => c.status === 'archived' ? onUnarchive(c) : onArchive(c)}
                    onDelete={() => setConfirmDelete(c)}
                  />
                ))}
              </div>
            )
          ) : (
            <CalendarView campaigns={campaigns.filter((c) => c.status !== 'archived')} onOpen={onOpen} />

          {/* Delete confirm */}
          {confirmDelete && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-stone-900 border border-stone-700 rounded-sm max-w-sm w-full p-6 shadow-2xl">
                <div className="flex items-center gap-2 mb-3">
                  <AlertTriangle className="w-5 h-5 text-red-400" />
                  <h3 className="font-black text-amber-50 text-sm uppercase tracking-[0.2em]">Delete campaign?</h3>
                </div>
                <p className="text-xs text-stone-400 mb-4">

                  <button
                    onClick={() => { onDelete(confirmDelete); setConfirmDelete(null); }}
                    className="flex-1 px-3 py-2 bg-red-500 text-stone-50 rounded-sm text-xs font-bold uppercase tracking-wider hover:bg-red-400"
                  >Delete</button>
                  <button onClick={() => setConfirmDelete(null)} className="px-3 py-2 bg-stone-800 text-stone-200 rounded-sm text-xs font-bold uppercase tracking-wider hover:bg-stone-700">Cancel</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ============================================================
    // CAMPAIGN CARD
    // ============================================================
    function CampaignCard({ campaign, onOpen, onDuplicate, onArchive, onDelete }) {
      const progress = useMemo(() => calculateProgress(campaign), [campaign]);
      const isArchived = campaign.status === 'archived';
      const launch = campaign.launch_date ? parseDateSafe(campaign.launch_date) : null;
      const today = startOfDay(new Date());
      const daysUntil = launch ? daysBetween(today, startOfDay(launch)) : null;

      let dateColor = 'text-stone-300';
      let dateLabel = '';
      if (daysUntil !== null) {
        if (daysUntil < 0) { dateColor = 'text-stone-500'; dateLabel = `${Math.abs(daysUntil)}d ago`; }
        else if (daysUntil === 0) { dateColor = 'text-red-400'; dateLabel = 'Today'; }
        else if (daysUntil <= 7) { dateColor = 'text-red-400'; dateLabel = `${daysUntil}d`; }
        else if (daysUntil <= 21) { dateColor = 'text-orange-400'; dateLabel = `${daysUntil}d`; }
        else { dateColor = 'text-stone-300'; dateLabel = `${daysUntil}d`; }
      }

      const handleCardClick = (e) => {
        if (e.target.closest('button')) return;
        onOpen();
      };

      return (
        <div onClick={handleCardClick} className={`bg-stone-900 border rounded-sm p-4 cursor-pointer transition-all hover:border-amber-400/40 hover:shadow-lg hover:shadow-amber-400/5 ${isArchived ? 'border-stone-800 opacity-60' : 'border-stone-800'}`}>
          <div className="flex items-start justify-between gap-2 mb-2">
            <div className="min-w-0 flex-1">
              <div className="font-black text-amber-50 text-base truncate">{campaign.name || 'Untitled campaign'}</div>
              {campaign.client && <div className="text-xs text-stone-400 truncate">{campaign.client}</div>}
            </div>
            <span className={`text-[9px] font-black uppercase tracking-widest px-1.5 py-0.5 rounded-sm flex-shrink-0 ${isArchived ? 'bg-stone-800 text-stone-400' : 'bg-emerald-950/50 text-emerald-300 border border-emerald-800/40'}`}>
              {isArchived ? 'Archived' : 'Active'}
            </span>
          </div>

          <div className="flex items-center gap-2 mb-3">
            <Calendar className="w-3.5 h-3.5 text-stone-500" />
            {launch ? (
              <>
                <span className="text-xs text-stone-300">{fmtDateShort(launch)}</span>
                {dateLabel && <span className={`text-[10px] font-bold uppercase tracking-wider ${dateColor}`}>{dateLabel}</span>}
              </>
            ) : (
              <span className="text-xs text-stone-500 italic">No launch date</span>
            )}
          </div>

          <div className="mb-3">
            <div className="flex items-center justify-between mb-1">
              <span className="text-[10px] font-bold uppercase tracking-widest text-stone-500">Progress</span>
              <span className="text-[10px] font-bold text-stone-300">{progress.pct}%{progress.total > 0 && ` (${progress.completed}/${progress.total})`}</span>
            </div>
            <div className="h-1.5 bg-stone-800 rounded-sm overflow-hidden">
              <div className="h-full bg-gradient-to-r from-orange-500 to-amber-400 transition-all" style={{ width: `${progress.pct}%` }}></div>
            </div>
          </div>

          <div className="flex items-center gap-1 pt-2 border-t border-stone-800">
            <button onClick={onOpen} className="flex-1 px-2 py-1.5 bg-stone-800 hover:bg-stone-700 text-stone-200 rounded-sm text-[10px] font-bold uppercase tracking-wider transition-colors">Open</button>
            <button onClick={onDuplicate} title="Duplicate" className="p-1.5 bg-stone-800 hover:bg-stone-700 text-stone-300 rounded-sm transition-colors">
              <Copy className="w-3.5 h-3.5" />
            </button>
            <button onClick={onArchive} title={isArchived ? 'Unarchive' : 'Archive'} className="p-1.5 bg-stone-800 hover:bg-stone-700 text-stone-300 rounded-sm transition-colors">
              {isArchived ? <ArchiveRestore className="w-3.5 h-3.5" /> : <Archive className="w-3.5 h-3.5" />}
            </button>
            <button onClick={onDelete} title="Delete" className="p-1.5 bg-stone-800 hover:bg-red-900/50 text-stone-300 hover:text-red-400 rounded-sm transition-colors">
              <Trash2 className="w-3.5 h-3.5" />
            </button>
          </div>
        </div>
      );
    }

    // ============================================================
    // CALENDAR VIEW
    // ============================================================
    function CalendarView({ campaigns, onOpen }) {
      const [cursor, setCursor] = useState(() => {
        const d = new Date(); d.setDate(1); d.setHours(0, 0, 0, 0); return d;
      });

      const year = cursor.getFullYear();
      const month = cursor.getMonth();
      const monthLabel = cursor.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

      const firstDay = new Date(year, month, 1);
      const lastDay = new Date(year, month + 1, 0);
      const daysInMonth = lastDay.getDate();
      const startWeekday = firstDay.getDay();

      // Build grid: leading empty cells + days
      const cells = [];
      for (let i = 0; i < startWeekday; i++) cells.push(null);
      for (let d = 1; d <= daysInMonth; d++) cells.push(d);
      while (cells.length % 7 !== 0) cells.push(null);

      const campaignsByDate = useMemo(() => {
        const map = {};
        campaigns.forEach((c) => {
          if (!c.launch_date) return;
          if (!map[c.launch_date]) map[c.launch_date] = [];
          map[c.launch_date].push(c);
        });
        return map;
      }, [campaigns]);

      const prevMonth = () => setCursor(new Date(year, month - 1, 1));
      const nextMonth = () => setCursor(new Date(year, month + 1, 1));
      const today = () => { const d = new Date(); d.setDate(1); d.setHours(0, 0, 0, 0); setCursor(d); };

      const todayKey = fmtDateIso(new Date());

      return (
        <div className="bg-stone-900 border border-stone-800 rounded-sm p-4">
          <div className="flex items-center justify-between mb-4">
            <h3 className="font-black text-amber-50 text-lg uppercase tracking-tight">{monthLabel}</h3>
            <div className="flex items-center gap-1">
              <button onClick={today} className="px-2.5 py-1 text-xs uppercase tracking-wider font-bold text-stone-300 hover:text-amber-50 bg-stone-800 hover:bg-stone-700 rounded-sm">Today</button>
              <button onClick={prevMonth} className="p-1.5 bg-stone-800 hover:bg-stone-700 text-stone-300 rounded-sm"><ChevronLeft className="w-4 h-4" /></button>
              <button onClick={nextMonth} className="p-1.5 bg-stone-800 hover:bg-stone-700 text-stone-300 rounded-sm"><ChevronRight className="w-4 h-4" /></button>
            </div>
          </div>
          <div className="grid grid-cols-7 gap-1 mb-1">
            {['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map((w) => (
              <div key={w} className="text-[10px] font-bold uppercase tracking-widest text-stone-500 text-center py-1">{w}</div>
            ))}
          </div>
          <div className="grid grid-cols-7 gap-1">
            {cells.map((d, idx) => {
              if (d === null) return <div key={idx} className="min-h-[88px] bg-stone-950/40 rounded-sm border border-stone-900" />;
              const dateKey = fmtDateIso(new Date(year, month, d));
              const items = campaignsByDate[dateKey] || [];
              const isToday = dateKey === todayKey;
              return (
                <div key={idx} className={`min-h-[88px] bg-stone-950 rounded-sm border p-1.5 flex flex-col gap-1 ${isToday ? 'border-amber-400/60' : 'border-stone-800'}`}>
                  <div className={`text-[11px] font-bold ${isToday ? 'text-amber-400' : 'text-stone-400'}`}>{d}</div>
                  <div className="flex flex-col gap-0.5 overflow-hidden">
                    {items.slice(0, 3).map((c) => (
                      <button
                        key={c.id}
                        onClick={() => onOpen(c)}
                        className="text-left text-[10px] font-bold truncate px-1.5 py-0.5 bg-amber-400/20 hover:bg-amber-400/40 text-amber-200 rounded-sm border border-amber-400/30 transition-colors"
                        title={`${c.name}${c.client ? ' — ' + c.client : ''}`}
                      >
                        {c.name}
                      </button>
                    ))}
                    {items.length > 3 && (
                      <div className="text-[9px] text-stone-500 px-1">+{items.length - 3} more</div>
                    )}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    // ============================================================
    // NEW CAMPAIGN MODAL
    // ============================================================
    function NewCampaignModal({ onClose, onCreate, existingClients, campaigns }) {
      const [name, setName] = useState('');
      const [client, setClient] = useState('');
      const [launchDate, setLaunchDate] = useState('');
      const [duplicateFromId, setDuplicateFromId] = useState('');
      const [creating, setCreating] = useState(false);
      const [error, setError] = useState('');
      const [showClientSuggest, setShowClientSuggest] = useState(false);

      const filteredSuggestions = useMemo(() => {
        if (!client) return existingClients.slice(0, 5);
        const q = client.toLowerCase();
        return existingClients.filter((c) => c.toLowerCase().includes(q) && c.toLowerCase() !== q).slice(0, 5);
      }, [client, existingClients]);

      const handleSubmit = async (e) => {
        e.preventDefault();
        setError('');
        if (!name.trim() || !launchDate) {
          setError('Name and launch date are required.');
          return;
        }
        setCreating(true);
        try {
          let data = defaultCampaignData();
          if (duplicateFromId) {
            const src = campaigns.find((c) => c.id === duplicateFromId);
            if (src && src.data) {
              data = JSON.parse(JSON.stringify(src.data));
              data.completedTasks = {};
              data.skippedTasks = {};
              data.shiftHistory = [];
              data.originalLaunchDate = '';
            }
          }
          await onCreate({ name: name.trim(), client: client.trim() || null, launch_date: launchDate, data });
        } catch (err) {
          setError(err.message || 'Failed to create campaign.');
        } finally {
          setCreating(false);
        }
      };

      return (
        <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
          <div className="bg-stone-900 border border-stone-700 rounded-sm max-w-md w-full p-6 shadow-2xl">
            <div className="flex items-center gap-2 mb-4">
              <Plus className="w-4 h-4 text-amber-400" />
              <h3 className="font-black text-amber-50 text-sm uppercase tracking-[0.2em]">New Campaign</h3>
            </div>
            <form onSubmit={handleSubmit} className="space-y-3">
              <div>
                <label className="block text-[11px] font-bold uppercase tracking-wider text-stone-400 mb-1">Name *</label>
                <input type="text" required value={name} onChange={(e) => setName(e.target.value)} placeholder="e.g. Nationals 2026" className="w-full px-3 py-2 bg-stone-800 border border-stone-700 rounded-sm text-sm text-stone-100 placeholder:text-stone-500 focus:outline-none focus:ring-2 focus:ring-amber-400" autoFocus />
              </div>
              <div className="relative">
                <label className="block text-[11px] font-bold uppercase tracking-wider text-stone-400 mb-1">Client</label>
                <input
                  type="text"
                  value={client}
                  onChange={(e) => { setClient(e.target.value); setShowClientSuggest(true); }}
                  onFocus={() => setShowClientSuggest(true)}
                  onBlur={() => setTimeout(() => setShowClientSuggest(false), 150)}
                  placeholder="e.g. USA Pickleball"
                  className="w-full px-3 py-2 bg-stone-800 border border-stone-700 rounded-sm text-sm text-stone-100 placeholder:text-stone-500 focus:outline-none focus:ring-2 focus:ring-amber-400"
                />
                {showClientSuggest && filteredSuggestions.length > 0 && (
                  <div className="absolute top-full left-0 right-0 mt-1 bg-stone-800 border border-stone-700 rounded-sm shadow-lg z-10 max-h-40 overflow-y-auto">
                    {filteredSuggestions.map((s) => (
                      <button key={s} type="button" onMouseDown={() => { setClient(s); setShowClientSuggest(false); }} className="w-full text-left px-3 py-1.5 text-sm text-stone-200 hover:bg-stone-700">
                        {s}
                      </button>
                    ))}
                  </div>
                )}
              </div>
              <div>
                <label className="block text-[11px] font-bold uppercase tracking-wider text-stone-400 mb-1">Launch date *</label>
                <input type="date" required value={launchDate} onChange={(e) => setLaunchDate(e.target.value)} className="w-full px-3 py-2 bg-stone-800 border border-stone-700 rounded-sm text-sm text-stone-100 focus:outline-none focus:ring-2 focus:ring-amber-400 [color-scheme:dark]" />
              </div>
              {campaigns.length > 0 && (
                <div>
                  <label className="block text-[11px] font-bold uppercase tracking-wider text-stone-400 mb-1">Duplicate from (optional)</label>
                  <select value={duplicateFromId} onChange={(e) => setDuplicateFromId(e.target.value)} className="w-full px-3 py-2 bg-stone-800 border border-stone-700 rounded-sm text-sm text-stone-100 focus:outline-none focus:ring-2 focus:ring-amber-400">
                    <option value="">Start fresh</option>
                    {campaigns.map((c) => (
                      <option key={c.id} value={c.id}>{c.name}{c.client ? ` — ${c.client}` : ''}</option>
                    ))}
                  </select>
                  <p className="text-[11px] text-stone-500 mt-1 italic">Copies config + custom tasks. Progress & shift history reset.</p>
                </div>
              )}
              {error && (
                <div className="flex items-start gap-2 p-2.5 bg-red-950/40 border border-red-800/50 rounded-sm text-xs text-red-300">
                  <AlertCircle className="w-4 h-4 flex-shrink-0 mt-0.5" />
                  <span>{error}</span>
                </div>
              )}
              <div className="flex gap-2 pt-2">
                <button type="submit" disabled={creating} className="flex-1 flex items-center justify-center gap-2 px-3 py-2 bg-amber-400 text-stone-950 rounded-sm text-xs font-bold uppercase tracking-wider hover:bg-amber-300 disabled:opacity-50">
                  {creating ? <><Loader2 className="w-4 h-4 animate-spin" /> Creating…</> : 'Create'}
                </button>
                <button type="button" onClick={onClose} className="px-3 py-2 bg-stone-800 text-stone-200 rounded-sm text-xs font-bold uppercase tracking-wider hover:bg-stone-700">Cancel</button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // ============================================================
    // CAMPAIGN LAUNCH BLUEPRINT (full original component, adapted)
    // Accepts: campaign (id, name, client, launch_date, data)
    //          onBack (() => void)
    //          onChange ({ name?, client?, launch_date?, data? }) => void   // debounced-saved by caller
    //          saveState ('idle' | 'saving' | 'saved' | 'error')
    // ============================================================
    function CampaignLaunchBlueprint({ campaign, onBack, onChange, saveState, saveError, onRetry }) {
      // ---- top-level columns ----
      const [clientName, setClientName] = useState(campaign.client || '');
      const [campaignName, setCampaignName] = useState(campaign.name || '');
      const [launchDate, setLaunchDate] = useState(campaign.launch_date || '');

      // ---- data payload (lives in data jsonb) ----
      const initial = campaign.data || defaultCampaignData();
      const [originalLaunchDate, setOriginalLaunchDate] = useState(initial.originalLaunchDate || '');
      const [campaignType, setCampaignType] = useState(initial.campaignType || 'net-new');
      const [channels, setChannels] = useState(initial.channels || { googleSearch: true, meta: true });
      const [requirements, setRequirements] = useState(initial.requirements || {
        newGTM: false, clientPlacesPixels: false, firstPartyData: false,
        newLandingPages: false, callTracking: false, videoCreative: false,
        brandSafetyReview: false, legalReview: false,
      });
      const [businessDays, setBusinessDays] = useState(initial.businessDays !== false);
      const [includeInternalCreative, setIncludeInternalCreative] = useState(!!initial.includeInternalCreative);
      const [internalStages, setInternalStages] = useState(Array.isArray(initial.internalStages) && initial.internalStages.length > 0 ? initial.internalStages : [
        { id: 'brief', name: 'Creative brief → concept', days: 3 },
        { id: 'draft', name: 'First draft production', days: 5 },
        { id: 'revisions', name: 'Revision rounds', days: 3 },
        { id: 'finalize', name: 'Final asset prep & handoff', days: 2 },
      ]);
      const [includeDashboard, setIncludeDashboard] = useState(initial.includeDashboard !== false);
      const [dashboardLeadDays, setDashboardLeadDays] = useState(Number(initial.dashboardLeadDays) || 2);
      const [customTasks, setCustomTasks] = useState(Array.isArray(initial.customTasks) ? initial.customTasks : []);
      const [completedTasks, setCompletedTasks] = useState(initial.completedTasks || {});
      const [skippedTasks, setSkippedTasks] = useState(initial.skippedTasks || {});
      const [shiftHistory, setShiftHistory] = useState(Array.isArray(initial.shiftHistory) ? initial.shiftHistory : []);

      // ---- UI-only state ----
      const [showShiftDialog, setShowShiftDialog] = useState(false);
      const [pendingLaunchDate, setPendingLaunchDate] = useState('');
      const [shiftReason, setShiftReason] = useState('');
      const [showHistory, setShowHistory] = useState(false);
      const [showCustomTaskDialog, setShowCustomTaskDialog] = useState(false);
      const [customTaskDraft, setCustomTaskDraft] = useState({ name: '', phase: 'Custom', daysPrior: 3, role: 'TJA', notes: '' });
      const [copied, setCopied] = useState(false);
      const [showSkipped, setShowSkipped] = useState(true);

      // When campaign prop changes (e.g. switched campaigns), rehydrate
      useEffect(() => {
        setClientName(campaign.client || '');
        setCampaignName(campaign.name || '');
        setLaunchDate(campaign.launch_date || '');
        const d = campaign.data || defaultCampaignData();
        setOriginalLaunchDate(d.originalLaunchDate || '');
        setCampaignType(d.campaignType || 'net-new');
        setChannels(d.channels || { googleSearch: true, meta: true });
        setRequirements(d.requirements || {
          newGTM: false, clientPlacesPixels: false, firstPartyData: false,
          newLandingPages: false, callTracking: false, videoCreative: false,
          brandSafetyReview: false, legalReview: false,
        });
        setBusinessDays(d.businessDays !== false);
        setIncludeInternalCreative(!!d.includeInternalCreative);
        setInternalStages(Array.isArray(d.internalStages) && d.internalStages.length > 0 ? d.internalStages : [
          { id: 'brief', name: 'Creative brief → concept', days: 3 },
          { id: 'draft', name: 'First draft production', days: 5 },
          { id: 'revisions', name: 'Revision rounds', days: 3 },
          { id: 'finalize', name: 'Final asset prep & handoff', days: 2 },
        ]);
        setIncludeDashboard(d.includeDashboard !== false);
        setDashboardLeadDays(Number(d.dashboardLeadDays) || 2);
        setCustomTasks(Array.isArray(d.customTasks) ? d.customTasks : []);
        setCompletedTasks(d.completedTasks || {});
        setSkippedTasks(d.skippedTasks || {});
        setShiftHistory(Array.isArray(d.shiftHistory) ? d.shiftHistory : []);
        // eslint-disable-next-line react-hooks/exhaustive-deps
      }, [campaign.id]);

      useEffect(() => {
        const preset = CAMPAIGN_TYPES[campaignType];
        if (preset) setRequirements((prev) => ({ ...prev, ...preset.defaults }));
      }, [campaignType]);

      // Auto-save: push state out on every change (parent debounces + saves to Supabase)
      const firstRun = useRef(true);
      useEffect(() => {
        if (firstRun.current) { firstRun.current = false; return; }
        onChange({
          name: campaignName,
          client: clientName || null,
          launch_date: launchDate || null,
          data: {
            campaignType, channels, requirements, businessDays,
            includeInternalCreative, internalStages, includeDashboard, dashboardLeadDays,
            customTasks, completedTasks, skippedTasks, shiftHistory, originalLaunchDate,
          },
        });
        // eslint-disable-next-line react-hooks/exhaustive-deps
      }, [
        campaignName, clientName, launchDate,
        campaignType, channels, requirements, businessDays,
        includeInternalCreative, internalStages, includeDashboard, dashboardLeadDays,
        customTasks, completedTasks, skippedTasks, shiftHistory, originalLaunchDate,
      ]);

      const timeline = useMemo(() => {
        if (!launchDate) return null;
        const launch = new Date(launchDate + 'T12:00:00');
        const preset = CAMPAIGN_TYPES[campaignType];
        const flags = { ...requirements };
        Object.keys(channels).forEach((k) => { if (channels[k]) flags[k] = true; });

        const taskPasses = (t) => {
          if (preset.excludedPhases.includes(t.phase)) return false;
          if (preset.excludedTasks && preset.excludedTasks.includes(t.id)) return false;
          if (t.requires && !t.requires.every((r) => flags[r])) return false;
          if (t.requiresAny && !t.requiresAny.some((r) => flags[r])) return false;
          return true;
        };

        const filteredTasks = TASKS.filter(taskPasses).map((t) => ({
          ...t, date: subtract(launch, t.daysPrior, businessDays), timing: 'pre',
        }));

        const custom = customTasks.map((t) => ({
          ...t, date: subtract(launch, Number(t.daysPrior) || 0, businessDays), timing: 'pre', isCustom: true,
        }));

        const internalTasks = [];
        if (includeInternalCreative) {
          let cumulative = 3;
          [...internalStages].reverse().forEach((stage) => {
            cumulative += Number(stage.days) || 0;
            internalTasks.unshift({
              id: `internal-${stage.id}`, phase: 'Internal Creative', name: stage.name,
              daysPrior: cumulative, role: 'Internal Creative',
              date: subtract(launch, cumulative, businessDays), timing: 'pre',
            });
          });
        }

        const postLaunchTasks = [];
        if (includeDashboard && !preset.excludedPhases.includes('Post-Launch')) {
          const leadDays = Math.max(0, Math.min(4, Number(dashboardLeadDays) || 2));
          postLaunchTasks.push({
            id: 'dashboard-draft', phase: 'Post-Launch', name: 'Dashboard draft provided for review',
            daysAfter: leadDays, role: 'AM', daysPrior: -leadDays,
            notes: `Typical turnaround 48 hrs (${leadDays} ${businessDays ? 'biz' : 'cal'} days set). Max 4 business days.`,
            date: shift(launch, leadDays, businessDays), timing: 'post',
          });
          postLaunchTasks.push({
            id: 'day-1-check', phase: 'Post-Launch', name: 'Day-1 performance check', daysAfter: 1, role: 'TJA', daysPrior: -1,
            notes: 'Verify spend, impressions, and tracking firing',
            date: shift(launch, 1, businessDays), timing: 'post',
          });
          postLaunchTasks.push({
            id: 'week-1-optimize', phase: 'Post-Launch', name: 'Week-1 optimization review', daysAfter: 7, role: 'TJA', daysPrior: -7,
            notes: 'First optimization pass based on initial data',
            date: shift(launch, 7, businessDays), timing: 'post',
          });
        }

        const preLaunch = [...filteredTasks, ...custom, ...internalTasks].sort((a, b) => a.date - b.date);
        const all = [...preLaunch, ...postLaunchTasks];
        const earliest = preLaunch.length > 0 ? preLaunch[0].date : launch;
        const today = new Date(); today.setHours(0, 0, 0, 0);
        const isFeasible = earliest >= today;
        const totalRunway = preLaunch.length > 0 ? Math.abs(daysBetween(earliest, launch)) : 0;

        const orderedPreByPhase = {};
        PHASE_ORDER.forEach((p) => {
          const forPhase = preLaunch.filter((t) => t.phase === p);
          if (forPhase.length > 0) orderedPreByPhase[p] = forPhase;
        });
        const customPhaseTasks = preLaunch.filter((t) => t.phase === 'Custom');
        if (customPhaseTasks.length > 0) orderedPreByPhase['Custom'] = customPhaseTasks;

        const postByPhase = {};
        postLaunchTasks.forEach((t) => { if (!postByPhase[t.phase]) postByPhase[t.phase] = []; postByPhase[t.phase].push(t); });

        const activeTasks = all.filter((t) => !skippedTasks[t.id]);
        const completedCount = activeTasks.filter((t) => completedTasks[t.id]).length;
        const overdueCount = activeTasks.filter((t) => {
          if (completedTasks[t.id]) return false;
          const status = getTaskStatus(t, completedTasks, skippedTasks, today);
          return status === 'overdue' || status === 'pending-overdue';
        }).length;
        const skippedCount = Object.keys(skippedTasks).filter((id) => all.some((t) => t.id === id)).length;

        return { all, preLaunch, postLaunchTasks, preByPhase: orderedPreByPhase, postByPhase, earliest, isFeasible, totalRunway, launch, completedCount, totalCount: activeTasks.length, overdueCount, skippedCount };
      }, [launchDate, campaignType, channels, requirements, businessDays, includeInternalCreative, internalStages, includeDashboard, dashboardLeadDays, customTasks, completedTasks, skippedTasks]);

      const toggleChannel = (id) => setChannels((p) => ({ ...p, [id]: !p[id] }));
      const toggleReq = (id) => setRequirements((p) => ({ ...p, [id]: !p[id] }));
      const updateStage = (idx, field, val) => setInternalStages((prev) => prev.map((s, i) => (i === idx ? { ...s, [field]: val } : s)));
      const addStage = () => setInternalStages((prev) => [...prev, { id: `stage-${Date.now()}`, name: 'New stage', days: 2 }]);
      const removeStage = (idx) => setInternalStages((prev) => prev.filter((_, i) => i !== idx));

      const toggleTaskComplete = (taskId, scheduledDate) => {
        setCompletedTasks((prev) => {
          const next = { ...prev };
          if (next[taskId]) delete next[taskId];
          else next[taskId] = { completedAt: new Date().toISOString(), scheduledDate: scheduledDate.toISOString() };
          return next;
        });
      };

      const toggleTaskSkip = (taskId) => {
        setSkippedTasks((prev) => {
          const next = { ...prev };
          if (next[taskId]) delete next[taskId];
          else next[taskId] = { skippedAt: new Date().toISOString() };
          return next;
        });
      };

      const addCustomTask = () => {
        if (!customTaskDraft.name.trim()) return;
        const newTask = {
          id: `custom-${Date.now()}`,
          name: customTaskDraft.name,
          phase: customTaskDraft.phase || 'Custom',
          daysPrior: Number(customTaskDraft.daysPrior) || 0,
          role: customTaskDraft.role,
          notes: customTaskDraft.notes || undefined,
        };
        setCustomTasks((prev) => [...prev, newTask]);
        setCustomTaskDraft({ name: '', phase: 'Custom', daysPrior: 3, role: 'TJA', notes: '' });
        setShowCustomTaskDialog(false);
      };

      const removeCustomTask = (id) => {
        setCustomTasks((prev) => prev.filter((t) => t.id !== id));
      };

      const openShiftDialog = () => { setPendingLaunchDate(launchDate); setShiftReason(''); setShowShiftDialog(true); };
      const applyShift = () => {
        if (!pendingLaunchDate || pendingLaunchDate === launchDate) { setShowShiftDialog(false); return; }
        const oldDate = new Date(launchDate + 'T12:00:00');
        const newDate = new Date(pendingLaunchDate + 'T12:00:00');
        const deltaDays = daysBetween(oldDate, newDate);
        if (!originalLaunchDate) setOriginalLaunchDate(launchDate);
        setShiftHistory((prev) => [...prev, { from: launchDate, to: pendingLaunchDate, deltaDays, reason: shiftReason || 'No reason provided', shiftedAt: new Date().toISOString() }]);
        setLaunchDate(pendingLaunchDate);
        setShowShiftDialog(false);
        setShiftReason('');
      };
      const quickShift = (days) => {
        if (!launchDate) return;
        const current = new Date(launchDate + 'T12:00:00');
        const newDate = addCalendarDays(current, days);
        setPendingLaunchDate(fmtDateIso(newDate));
        setShiftReason(days > 0 ? `Pushed out ${days} day${days === 1 ? '' : 's'}` : `Pulled in ${Math.abs(days)} day${Math.abs(days) === 1 ? '' : 's'}`);
        setShowShiftDialog(true);
      };

      const resetCampaign = () => { setCompletedTasks({}); setSkippedTasks({}); setShiftHistory([]); setOriginalLaunchDate(''); setCustomTasks([]); };
      const downloadPDF = () => { window.print(); };

      const copyToClipboard = () => {
        if (!timeline) return;
        const preset = CAMPAIGN_TYPES[campaignType];
        const lines = [];
        lines.push(`TJA CAMPAIGN LAUNCH BLUEPRINT`);
        if (clientName) lines.push(`Client: ${clientName}`);
        if (campaignName) lines.push(`Campaign: ${campaignName}`);
        lines.push(`Type: ${preset.label}`);
        lines.push(`Launch Date: ${fmtDateShort(timeline.launch)}`);
        if (originalLaunchDate && originalLaunchDate !== launchDate) lines.push(`Originally scheduled: ${fmtDateShort(new Date(originalLaunchDate + 'T12:00:00'))}`);
        lines.push(`Earliest Start: ${fmtDateShort(timeline.earliest)} (${timeline.totalRunway} ${businessDays ? 'business' : 'calendar'} days runway)`);
        lines.push(`Progress: ${timeline.completedCount}/${timeline.totalCount} complete`);
        if (timeline.skippedCount > 0) lines.push(`Skipped (N/A): ${timeline.skippedCount}`);
        lines.push(`Channels: ${Object.keys(channels).filter((k) => channels[k]).map((k) => CHANNELS.find((c) => c.id === k)?.label).join(', ')}`);
        lines.push('');
        Object.entries(timeline.preByPhase).forEach(([phase, tasks]) => {
          lines.push(`── ${phase.toUpperCase()} ──`);
          tasks.forEach((t) => {
            const sym = skippedTasks[t.id] ? '↷' : completedTasks[t.id] ? '✓' : '○';
            lines.push(`  ${sym} ${fmtDate(t.date)}  │  ${t.name}  │  ${t.role}${t.notes ? `\n      ↳ ${t.notes}` : ''}`);
          });
          lines.push('');
        });
        if (timeline.postLaunchTasks.length > 0) {
          lines.push(`🚀 LAUNCH — ${fmtDate(timeline.launch)}`);
          lines.push('');
          Object.entries(timeline.postByPhase).forEach(([phase, tasks]) => {
            lines.push(`── ${phase.toUpperCase()} ──`);
            tasks.forEach((t) => {
              const sym = skippedTasks[t.id] ? '↷' : completedTasks[t.id] ? '✓' : '○';
              lines.push(`  ${sym} ${fmtDate(t.date)}  │  ${t.name}  │  ${t.role}${t.notes ? `\n      ↳ ${t.notes}` : ''}`);
            });
            lines.push('');
          });
        }
        navigator.clipboard.writeText(lines.join('\n'));
        setCopied(true);
        setTimeout(() => setCopied(false), 2000);
      };

      const today = useMemo(() => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; }, []);

      const TaskRow = ({ t }) => {
        const status = getTaskStatus(t, completedTasks, skippedTasks, today);
        if (status === 'skipped' && !showSkipped) return null;
        const styleCfg = STATUS_STYLES[status];
        const StatusIcon = styleCfg.icon;
        const isDone = status === 'done';
        const isSkipped = status === 'skipped';
        const completion = completedTasks[t.id];
        return (
          <div className={`group px-4 md:px-5 py-3 border-b border-stone-800 last:border-b-0 transition-colors ${styleCfg.bg} hover:bg-stone-800/50 print:bg-white print:border-stone-300 print:hover:bg-white ${isSkipped ? 'opacity-50' : ''}`}>
            <div className="flex items-start gap-3 md:gap-4">
              <button
                onClick={() => toggleTaskComplete(t.id, t.date)}
                disabled={isSkipped}
                className={`flex-shrink-0 mt-0.5 w-5 h-5 rounded border-2 flex items-center justify-center transition-all print:hidden ${isSkipped ? 'border-stone-700 bg-stone-800 cursor-not-allowed' : isDone ? 'bg-emerald-500 border-emerald-500' : 'border-stone-600 hover:border-amber-400 bg-stone-900'}`}
                aria-label={isDone ? 'Mark incomplete' : 'Mark complete'}
              >
                {isDone && <CheckCircle2 className="w-4 h-4 text-stone-950" strokeWidth={3} />}
              </button>
              <div className="hidden print:block flex-shrink-0 w-4 h-4 mt-1 border border-stone-700 rounded-sm">
                {isDone && <div className="w-full h-full bg-stone-800 flex items-center justify-center text-white text-xs leading-none">✓</div>}
                {isSkipped && <div className="w-full h-full flex items-center justify-center text-stone-700 text-xs leading-none">↷</div>}
              </div>
              <div className="flex-shrink-0 w-16 md:w-20 print:w-20">
                <div className="text-[10px] text-stone-500 uppercase tracking-widest font-semibold print:text-stone-500">{t.date.toLocaleDateString('en-US', { weekday: 'short' })}</div>
                <div className={`text-sm font-bold ${isDone || isSkipped ? 'text-stone-500 line-through' : 'text-amber-50 print:text-stone-900'}`}>{t.date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}</div>
              </div>
              <div className="flex-1 min-w-0">
                <div className="flex items-start justify-between gap-2 flex-wrap">
                  <div className={`text-sm font-medium ${isDone || isSkipped ? 'text-stone-500 line-through' : 'text-stone-100 print:text-stone-900'}`}>
                    {t.name}
                    {t.isCustom && <span className="ml-2 text-[9px] uppercase tracking-wider bg-fuchsia-400/20 text-fuchsia-300 px-1.5 py-0.5 rounded-sm print:bg-fuchsia-100 print:text-fuchsia-900">Custom</span>}
                  </div>
                  <span className={`text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded-sm print:border print:border-stone-400 ${ROLE_STYLES[t.role] || 'bg-stone-700 text-stone-100'}`}>{t.role}</span>
                </div>
                {t.notes && <div className="text-xs text-stone-400 mt-1 italic print:text-stone-600">{t.notes}</div>}

    // ============================================================
    // CAMPAIGN DETAIL (wraps blueprint + debounced saves)
    // ============================================================
    function CampaignDetail({ campaign, onBack, onSaved, onLocalUpdate }) {
      const [saveState, setSaveState] = useState('idle'); // idle | saving | saved | error
      const [saveError, setSaveError] = useState('');
      const pendingRef = useRef(null);
      const timerRef = useRef(null);
      const savedTimerRef = useRef(null);

      const flush = useCallback(async () => {
        if (!pendingRef.current) return;
        const payload = pendingRef.current;
        pendingRef.current = null;
        setSaveState('saving');
        setSaveError('');
        try {
          const update = {
            name: payload.name,
            client: payload.client,
            launch_date: payload.launch_date,
            data: payload.data,
            updated_at: new Date().toISOString(),
          };
          const { data, error } = await sb.from('campaigns').update(update).eq('id', campaign.id).select().single();
          if (error) throw error;
          setSaveState('saved');
          if (onSaved && data) onSaved(data);
          if (savedTimerRef.current) clearTimeout(savedTimerRef.current);
          savedTimerRef.current = setTimeout(() => {
            setSaveState((s) => (s === 'saved' ? 'idle' : s));
          }, 2000);
        } catch (err) {
          console.error('Save failed:', err);
          setSaveError(err.message || 'Connection issue.');
          setSaveState('error');
          // Put it back for retry
          pendingRef.current = payload;
        }
      }, [campaign.id, onSaved]);

      const handleChange = useCallback((payload) => {
        pendingRef.current = payload;
        // Optimistic local update so dashboard stays in sync when we return
        if (onLocalUpdate) {
          onLocalUpdate({
            ...campaign,
            name: payload.name,
            client: payload.client,
            launch_date: payload.launch_date,
            data: payload.data,
          });
        }
        if (timerRef.current) clearTimeout(timerRef.current);
        timerRef.current = setTimeout(flush, 800);
      }, [flush, onLocalUpdate, campaign]);

      const handleRetry = useCallback(() => { flush(); }, [flush]);

      // Flush pending changes on unmount
      useEffect(() => {
        return () => {
          if (timerRef.current) { clearTimeout(timerRef.current); timerRef.current = null; }
          if (savedTimerRef.current) { clearTimeout(savedTimerRef.current); savedTimerRef.current = null; }
          if (pendingRef.current) { flush(); }
        };
      }, [flush]);

      return (
        <CampaignLaunchBlueprint
          campaign={campaign}
          onBack={onBack}
          onChange={handleChange}
          saveState={saveState}
          saveError={saveError}
          onRetry={handleRetry}
        />
      );
    }

    // ============================================================
    // APP (top-level)
    // ============================================================
    function App() {
      return (
        <AuthGate>
          {({ session, onSignOut }) => <AuthedApp session={session} onSignOut={onSignOut} />}
        </AuthGate>
      );
    }

    function AuthedApp({ session, onSignOut }) {
      const [campaigns, setCampaigns] = useState([]);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState('');
      const [activeId, setActiveId] = useState(null);
      const [showNew, setShowNew] = useState(false);

      const loadCampaigns = useCallback(async () => {
        setLoading(true);
        setError('');
        try {
          const { data, error } = await sb
            .from('campaigns')
            .select('*')
            .order('launch_date', { ascending: true, nullsFirst: false });
          if (error) throw error;
          setCampaigns(data || []);
        } catch (err) {
          console.error('Load failed:', err);
          setError(err.message || 'Failed to load campaigns.');
        } finally {
          setLoading(false);
        }
      }, []);

      useEffect(() => { loadCampaigns(); }, [loadCampaigns]);

      const activeCampaign = useMemo(
        () => campaigns.find((c) => c.id === activeId) || null,
        [campaigns, activeId]
      );

      const updateLocal = useCallback((next) => {
        setCampaigns((prev) => prev.map((c) => (c.id === next.id ? { ...c, ...next } : c)));
      }, []);

      const handleCreate = async ({ name, client, launch_date, data }) => {
        const { data: row, error } = await sb.from('campaigns').insert({
          name, client, launch_date, data,
          user_id: session.user.id,
          status: 'active',
        }).select().single();
        if (error) throw error;
        setCampaigns((prev) => [row, ...prev]);
        setShowNew(false);
        setActiveId(row.id);
      };

      const handleArchive = async (c) => {
        const prev = campaigns;
        setCampaigns(campaigns.map((x) => x.id === c.id ? { ...x, status: 'archived' } : x));
        const { error } = await sb.from('campaigns').update({ status: 'archived' }).eq('id', c.id);
        if (error) { setCampaigns(prev); alert('Archive failed: ' + error.message); }
      };
      const handleUnarchive = async (c) => {
        const prev = campaigns;
        setCampaigns(campaigns.map((x) => x.id === c.id ? { ...x, status: 'active' } : x));
        const { error } = await sb.from('campaigns').update({ status: 'active' }).eq('id', c.id);
        if (error) { setCampaigns(prev); alert('Unarchive failed: ' + error.message); }
      };
      const handleDuplicate = async (c) => {
        try {
          const dataCopy = c.data ? JSON.parse(JSON.stringify(c.data)) : defaultCampaignData();
          dataCopy.completedTasks = {};
          dataCopy.skippedTasks = {};
          dataCopy.shiftHistory = [];
          dataCopy.originalLaunchDate = '';
          const { data: row, error } = await sb.from('campaigns').insert({
            name: (c.name || 'Campaign') + ' (copy)',
            client: c.client,
            launch_date: null,
            data: dataCopy,
            user_id: session.user.id,
            status: 'active',
          }).select().single();
          if (error) throw error;
          setCampaigns((prev) => [row, ...prev]);
        } catch (err) {
          alert('Duplicate failed: ' + (err.message || err));
        }
      };
      const handleDelete = async (c) => {
        const prev = campaigns;
        setCampaigns(campaigns.filter((x) => x.id !== c.id));
        if (activeId === c.id) setActiveId(null);
        const { error } = await sb.from('campaigns').delete().eq('id', c.id);
        if (error) { setCampaigns(prev); alert('Delete failed: ' + error.message); }
      };

      const handleSavedFromDetail = (updatedRow) => {
        setCampaigns((prev) => prev.map((c) => (c.id === updatedRow.id ? updatedRow : c)));
      };

      return (
        <div className="min-h-screen bg-stone-950 text-stone-100">
          {/* Top-right signed-in strip (hidden in detail via print & when scrolled away is fine) */}
          <div className="sticky top-0 z-40 bg-stone-950/80 backdrop-blur-sm border-b border-stone-900 print:hidden">
            <div className="max-w-7xl mx-auto px-4 md:px-6 py-2 flex items-center justify-end gap-3 text-[11px] text-stone-400">
              <span>Signed in as <span className="text-stone-200 font-semibold">{session.user.email}</span></span>
              <span className="text-stone-700">·</span>
              <button onClick={onSignOut} className="flex items-center gap-1 uppercase tracking-wider font-bold hover:text-amber-300 transition-colors">
                <LogOut className="w-3 h-3" /> Sign out
              </button>
            </div>
          </div>

          {activeCampaign ? (
            <CampaignDetail
              key={activeCampaign.id}
              campaign={activeCampaign}
              onBack={() => setActiveId(null)}
              onSaved={handleSavedFromDetail}
              onLocalUpdate={updateLocal}
            />
          ) : (
            <Dashboard
              campaigns={campaigns}
              loading={loading}
              error={error}
              onOpen={(c) => setActiveId(c.id)}
              onNew={() => setShowNew(true)}
              onArchive={handleArchive}
              onUnarchive={handleUnarchive}
              onDuplicate={handleDuplicate}
              onDelete={handleDelete}
              onRefresh={loadCampaigns}
            />
          )}

          {showNew && (
            <NewCampaignModal
              onClose={() => setShowNew(false)}
              onCreate={handleCreate}
              existingClients={Array.from(new Set(campaigns.map((c) => (c.client || '').trim()).filter(Boolean))).sort()}
              campaigns={campaigns}
            />
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
