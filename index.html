                      <option key={c.id} value={c.id}>{c.name}{c.client ? ` — ${c.client}` : ''}</option>
                    ))}
                  </select>
                  <p className="text-[11px] text-stone-500 mt-1 italic">Copies all placements as a starting point.</p>
                </div>
              )}
              {error && (
                <div className="flex items-start gap-2 p-2.5 bg-red-950/40 border border-red-800/50 rounded-sm text-xs text-red-300">
                  <AlertCircle className="w-4 h-4 flex-shrink-0 mt-0.5" />
                  <span>{error}</span>
                </div>
              )}
              <div className="flex gap-2 pt-2">
                <button type="submit" disabled={creating} className="flex-1 flex items-center justify-center gap-2 px-3 py-2 bg-orange-500 text-stone-950 rounded-sm text-xs font-bold uppercase tracking-wider hover:bg-orange-400 disabled:opacity-50">
                  {creating ? <><Loader2 className="w-4 h-4 animate-spin" /> Creating…</> : 'Create Toolkit'}
                </button>
                <button type="button" onClick={onClose} className="px-3 py-2 bg-stone-800 text-stone-200 rounded-sm text-xs font-bold uppercase tracking-wider hover:bg-stone-700">Cancel</button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // ============================================================
    // CAMPAIGN LAUNCH BLUEPRINT (full original component, adapted)
    // Accepts: campaign (id, name, client, launch_date, data)
    //          onBack (() => void)
    //          onChange ({ name?, client?, launch_date?, data? }) => void   // debounced-saved by caller
    //          saveState ('idle' | 'saving' | 'saved' | 'error')
    // ============================================================
    function CampaignLaunchBlueprint({ campaign, onBack, onChange, saveState, saveError, onRetry, hideTopBar }) {
      // ---- top-level columns ----
      const [clientName, setClientName] = useState(campaign.client || '');
      const [campaignName, setCampaignName] = useState(campaign.name || '');
      const [launchDate, setLaunchDate] = useState(campaign.launch_date || '');

      // ---- data payload (lives in data jsonb) ----
      const initial = campaign.data || defaultCampaignData();
      const [originalLaunchDate, setOriginalLaunchDate] = useState(initial.originalLaunchDate || '');
      const [campaignType, setCampaignType] = useState(initial.campaignType || 'net-new');
      const [channels, setChannels] = useState(initial.channels || { googleSearch: true, meta: true });
      const [requirements, setRequirements] = useState(initial.requirements || {
        newGTM: false, clientPlacesPixels: false, firstPartyData: false,
        newLandingPages: false, callTracking: false, videoCreative: false,
        brandSafetyReview: false, legalReview: false,
      });
      const [businessDays, setBusinessDays] = useState(initial.businessDays !== false);
      const [includeInternalCreative, setIncludeInternalCreative] = useState(!!initial.includeInternalCreative);
      const [internalStages, setInternalStages] = useState(Array.isArray(initial.internalStages) && initial.internalStages.length > 0 ? initial.internalStages : [
        { id: 'brief', name: 'Creative brief → concept', days: 3 },
        { id: 'draft', name: 'First draft production', days: 5 },
        { id: 'revisions', name: 'Revision rounds', days: 3 },
        { id: 'finalize', name: 'Final asset prep & handoff', days: 2 },
      ]);
      const [includeLandingPage, setIncludeLandingPage] = useState(!!initial.includeLandingPage);
      const [landingPageStages, setLandingPageStages] = useState(Array.isArray(initial.landingPageStages) && initial.landingPageStages.length > 0 ? initial.landingPageStages : [
        { id: 'lp-discovery', name: 'Discovery & wireframe', days: 3 },
        { id: 'lp-design', name: 'Design mockup & client review', days: 4 },
        { id: 'lp-build', name: 'Development & build', days: 5 },
        { id: 'lp-qa', name: 'QA & client revisions', days: 2 },
        { id: 'lp-launch', name: 'Final approval & publish', days: 1 },
      ]);
      const [includeDashboard, setIncludeDashboard] = useState(initial.includeDashboard !== false);
      const [dashboardLeadDays, setDashboardLeadDays] = useState(Number(initial.dashboardLeadDays) || 2);
      const [customTasks, setCustomTasks] = useState(Array.isArray(initial.customTasks) ? initial.customTasks : []);
      const [completedTasks, setCompletedTasks] = useState(initial.completedTasks || {});
      const [skippedTasks, setSkippedTasks] = useState(initial.skippedTasks || {});
      const [shiftHistory, setShiftHistory] = useState(Array.isArray(initial.shiftHistory) ? initial.shiftHistory : []);
      const [taskRoleOverrides, setTaskRoleOverrides] = useState(initial.taskRoleOverrides || {});
      // Per-task name/notes overrides for both base and custom tasks.
      // Shape: { [taskId]: { name?: string, notes?: string } }
      const [taskOverrides, setTaskOverrides] = useState(initial.taskOverrides || {});
      const [editingTaskId, setEditingTaskId] = useState(null);
      const [openRoleChip, setOpenRoleChip] = useState(null);

      // ---- UI-only state ----
      const [showShiftDialog, setShowShiftDialog] = useState(false);
      const [pendingLaunchDate, setPendingLaunchDate] = useState('');
      const [shiftReason, setShiftReason] = useState('');
      const [showHistory, setShowHistory] = useState(false);
      const [showCustomTaskDialog, setShowCustomTaskDialog] = useState(false);
      const [customTaskDraft, setCustomTaskDraft] = useState({ name: '', phase: 'Custom', daysPrior: 3, role: 'TJA', notes: '' });
      const [copied, setCopied] = useState(false);
      const [showSkipped, setShowSkipped] = useState(true);

      // When campaign prop changes (e.g. switched campaigns), rehydrate
      useEffect(() => {
        setClientName(campaign.client || '');
        setCampaignName(campaign.name || '');
        setLaunchDate(campaign.launch_date || '');
        const d = campaign.data || defaultCampaignData();
        setOriginalLaunchDate(d.originalLaunchDate || '');
        setCampaignType(d.campaignType || 'net-new');
        setChannels(d.channels || { googleSearch: true, meta: true });
        setRequirements(d.requirements || {
          newGTM: false, clientPlacesPixels: false, firstPartyData: false,
          newLandingPages: false, callTracking: false, videoCreative: false,
          brandSafetyReview: false, legalReview: false,
        });
        setBusinessDays(d.businessDays !== false);
        setIncludeInternalCreative(!!d.includeInternalCreative);
        setInternalStages(Array.isArray(d.internalStages) && d.internalStages.length > 0 ? d.internalStages : [
          { id: 'brief', name: 'Creative brief → concept', days: 3 },
          { id: 'draft', name: 'First draft production', days: 5 },
          { id: 'revisions', name: 'Revision rounds', days: 3 },
          { id: 'finalize', name: 'Final asset prep & handoff', days: 2 },
        ]);
        setIncludeLandingPage(!!d.includeLandingPage);
        setLandingPageStages(Array.isArray(d.landingPageStages) && d.landingPageStages.length > 0 ? d.landingPageStages : [
          { id: 'lp-discovery', name: 'Discovery & wireframe', days: 3 },
          { id: 'lp-design', name: 'Design mockup & client review', days: 4 },
          { id: 'lp-build', name: 'Development & build', days: 5 },
          { id: 'lp-qa', name: 'QA & client revisions', days: 2 },
          { id: 'lp-launch', name: 'Final approval & publish', days: 1 },
        ]);
        setIncludeDashboard(d.includeDashboard !== false);
        setDashboardLeadDays(Number(d.dashboardLeadDays) || 2);
        setCustomTasks(Array.isArray(d.customTasks) ? d.customTasks : []);
        setCompletedTasks(d.completedTasks || {});
        setSkippedTasks(d.skippedTasks || {});
        setShiftHistory(Array.isArray(d.shiftHistory) ? d.shiftHistory : []);
        setTaskRoleOverrides(d.taskRoleOverrides || {});
        setTaskOverrides(d.taskOverrides || {});
        setEditingTaskId(null);
        setOpenRoleChip(null);
        // eslint-disable-next-line react-hooks/exhaustive-deps
      }, [campaign.id]);

      useEffect(() => {
        const preset = CAMPAIGN_TYPES[campaignType];
        if (preset) setRequirements((prev) => ({ ...prev, ...preset.defaults }));
      }, [campaignType]);

      // Auto-save: push state out on every change (parent debounces + saves to Supabase)
      const firstRun = useRef(true);
      useEffect(() => {
        if (firstRun.current) { firstRun.current = false; return; }
        onChange({
          name: campaignName,
          client: clientName || null,
          launch_date: launchDate || null,
          data: {
            campaignType, channels, requirements, businessDays,
            includeInternalCreative, internalStages,
            includeLandingPage, landingPageStages,
            includeDashboard, dashboardLeadDays,
            customTasks, completedTasks, skippedTasks, shiftHistory, originalLaunchDate,
            taskRoleOverrides, taskOverrides,
          },
        });
        // eslint-disable-next-line react-hooks/exhaustive-deps
      }, [
        campaignName, clientName, launchDate,
        campaignType, channels, requirements, businessDays,
        includeInternalCreative, internalStages,
        includeLandingPage, landingPageStages,
        includeDashboard, dashboardLeadDays,
        customTasks, completedTasks, skippedTasks, shiftHistory, originalLaunchDate,
        taskRoleOverrides, taskOverrides,
      ]);

      const timeline = useMemo(() => {
        if (!launchDate) return null;
        const launch = new Date(launchDate + 'T12:00:00');
        const preset = CAMPAIGN_TYPES[campaignType];
        const flags = { ...requirements };
        Object.keys(channels).forEach((k) => { if (channels[k]) flags[k] = true; });

        const taskPasses = (t) => {
          if (preset.excludedPhases.includes(t.phase)) return false;
          if (preset.excludedTasks && preset.excludedTasks.includes(t.id)) return false;
          if (t.requires && !t.requires.every((r) => flags[r])) return false;
          if (t.requiresAny && !t.requiresAny.some((r) => flags[r])) return false;
          return true;
        };

        const filteredTasks = TASKS.filter(taskPasses).map((t) => ({
          ...t, date: subtract(launch, t.daysPrior, businessDays), timing: 'pre',
        }));

        const custom = customTasks.map((t) => ({
          ...t, date: subtract(launch, Number(t.daysPrior) || 0, businessDays), timing: 'pre', isCustom: true,
        }));

        const internalTasks = [];
        if (includeInternalCreative) {
          let cumulative = 3;
          [...internalStages].reverse().forEach((stage) => {
            cumulative += Number(stage.days) || 0;
            internalTasks.unshift({
              id: `internal-${stage.id}`, phase: 'Internal Creative', name: stage.name,
              daysPrior: cumulative, role: 'Internal Creative',
              date: subtract(launch, cumulative, businessDays), timing: 'pre',
            });
          });
        }

        const landingPageTasks = [];
        if (includeLandingPage) {
          // LP must be live ahead of the master 'lp-mobile-qa' (~6 days prior).
          let cumulative = 6;
          [...landingPageStages].reverse().forEach((stage) => {
            cumulative += Number(stage.days) || 0;
            landingPageTasks.unshift({
              id: `landingpage-${stage.id}`, phase: 'Landing Page', name: stage.name,
              daysPrior: cumulative, role: 'Landing Page',
              date: subtract(launch, cumulative, businessDays), timing: 'pre',
            });
          });
        }

        const postLaunchTasks = [];
        if (includeDashboard && !preset.excludedPhases.includes('Post-Launch')) {
          const leadDays = Math.max(0, Math.min(4, Number(dashboardLeadDays) || 2));
          postLaunchTasks.push({
            id: 'dashboard-draft', phase: 'Post-Launch', name: 'Dashboard draft provided for review',
            daysAfter: leadDays, role: 'AM', daysPrior: -leadDays,
            notes: `Typical turnaround 48 hrs (${leadDays} ${businessDays ? 'biz' : 'cal'} days set). Max 4 business days.`,
            date: shift(launch, leadDays, businessDays), timing: 'post',
          });
          postLaunchTasks.push({
            id: 'day-1-check', phase: 'Post-Launch', name: 'Day-1 performance check', daysAfter: 1, role: 'TJA', daysPrior: -1,
            notes: 'Verify spend, impressions, and tracking firing',
            date: shift(launch, 1, businessDays), timing: 'post',
          });
          postLaunchTasks.push({
            id: 'week-1-optimize', phase: 'Post-Launch', name: 'Week-1 optimization review', daysAfter: 7, role: 'TJA', daysPrior: -7,
            notes: 'First optimization pass based on initial data',
            date: shift(launch, 7, businessDays), timing: 'post',
          });
        }

        const preLaunch = [...filteredTasks, ...custom, ...internalTasks, ...landingPageTasks].sort((a, b) => a.date - b.date);
        const all = [...preLaunch, ...postLaunchTasks];
        const earliest = preLaunch.length > 0 ? preLaunch[0].date : launch;
        const today = new Date(); today.setHours(0, 0, 0, 0);
        const isFeasible = earliest >= today;
        const totalRunway = preLaunch.length > 0 ? Math.abs(daysBetween(earliest, launch)) : 0;

        const orderedPreByPhase = {};
        PHASE_ORDER.forEach((p) => {
          const forPhase = preLaunch.filter((t) => t.phase === p);
          if (forPhase.length > 0) orderedPreByPhase[p] = forPhase;
        });
        const customPhaseTasks = preLaunch.filter((t) => t.phase === 'Custom');
        if (customPhaseTasks.length > 0) orderedPreByPhase['Custom'] = customPhaseTasks;

        const postByPhase = {};
        postLaunchTasks.forEach((t) => { if (!postByPhase[t.phase]) postByPhase[t.phase] = []; postByPhase[t.phase].push(t); });

        const activeTasks = all.filter((t) => !skippedTasks[t.id]);
        const completedCount = activeTasks.filter((t) => completedTasks[t.id]).length;
        const overdueCount = activeTasks.filter((t) => {
          if (completedTasks[t.id]) return false;
          const status = getTaskStatus(t, completedTasks, skippedTasks, today);
          return status === 'overdue' || status === 'pending-overdue';
        }).length;
        const skippedCount = Object.keys(skippedTasks).filter((id) => all.some((t) => t.id === id)).length;

        return { all, preLaunch, postLaunchTasks, preByPhase: orderedPreByPhase, postByPhase, earliest, isFeasible, totalRunway, launch, completedCount, totalCount: activeTasks.length, overdueCount, skippedCount };
      }, [launchDate, campaignType, channels, requirements, businessDays, includeInternalCreative, internalStages, includeLandingPage, landingPageStages, includeDashboard, dashboardLeadDays, customTasks, completedTasks, skippedTasks]);

      const toggleChannel = (id) => setChannels((p) => ({ ...p, [id]: !p[id] }));
      const toggleReq = (id) => setRequirements((p) => ({ ...p, [id]: !p[id] }));
      const updateStage = (idx, field, val) => setInternalStages((prev) => prev.map((s, i) => (i === idx ? { ...s, [field]: val } : s)));
      const addStage = () => setInternalStages((prev) => [...prev, { id: `stage-${Date.now()}`, name: 'New stage', days: 2 }]);
      const removeStage = (idx) => setInternalStages((prev) => prev.filter((_, i) => i !== idx));
      const updateLPStage = (idx, field, val) => setLandingPageStages((prev) => prev.map((s, i) => (i === idx ? { ...s, [field]: val } : s)));
      const addLPStage = () => setLandingPageStages((prev) => [...prev, { id: `lp-stage-${Date.now()}`, name: 'New stage', days: 2 }]);
      const removeLPStage = (idx) => setLandingPageStages((prev) => prev.filter((_, i) => i !== idx));

      const toggleTaskComplete = (taskId, scheduledDate) => {
        setCompletedTasks((prev) => {
          const next = { ...prev };
          if (next[taskId]) delete next[taskId];
          else next[taskId] = { completedAt: new Date().toISOString(), scheduledDate: scheduledDate.toISOString() };
          return next;
        });
      };

      const toggleTaskSkip = (taskId) => {
        setSkippedTasks((prev) => {
          const next = { ...prev };
          if (next[taskId]) delete next[taskId];
          else next[taskId] = { skippedAt: new Date().toISOString() };
          return next;
        });
      };

      const addCustomTask = () => {
        if (!customTaskDraft.name.trim()) return;
        const newTask = {
          id: `custom-${Date.now()}`,
          name: customTaskDraft.name,
          phase: customTaskDraft.phase || 'Custom',
          daysPrior: Number(customTaskDraft.daysPrior) || 0,
          role: customTaskDraft.role,
          notes: customTaskDraft.notes || undefined,
        };
        setCustomTasks((prev) => [...prev, newTask]);
        setCustomTaskDraft({ name: '', phase: 'Custom', daysPrior: 3, role: 'TJA', notes: '' });
        setShowCustomTaskDialog(false);
      };

      const removeCustomTask = (id) => {
        setCustomTasks((prev) => prev.filter((t) => t.id !== id));
      };

      // Open the custom-task dialog with the phase pre-filled, and a sensible
      // default daysPrior derived from the existing tasks already in that phase
      // (closer to the median of what's there) so it slots into place.
      const openAddTaskInPhase = (phase) => {
        let defaultDays = 3;
        if (phase !== 'Custom' && phase !== 'Internal Creative' && phase !== 'Post-Launch') {
          const inPhase = TASKS.filter((t) => t.phase === phase);
          if (inPhase.length > 0) {
            const avg = Math.round(inPhase.reduce((s, t) => s + (t.daysPrior || 0), 0) / inPhase.length);
            if (Number.isFinite(avg)) defaultDays = avg;
          }
        }
        setCustomTaskDraft({ name: '', phase, daysPrior: defaultDays, role: 'TJA', notes: '' });
        setShowCustomTaskDialog(true);
      };

      // Apply / clear name + notes overrides. For custom tasks we mutate the
      // customTask record directly; for base tasks we store an override keyed
      // by task id so the source TASKS table stays untouched.
      const saveTaskEdit = (taskId, patch) => {
        const isCustom = customTasks.some((t) => t.id === taskId);
        if (isCustom) {
          setCustomTasks((prev) => prev.map((t) => (t.id === taskId ? { ...t, ...patch } : t)));
        } else {
          setTaskOverrides((prev) => {
            const cur = prev[taskId] || {};
            const next = { ...cur, ...patch };
            // Drop the entry entirely if both fields are empty/undefined,
            // so we don't accumulate noise in the JSON payload.
            if (!next.name && !next.notes) {
              const copy = { ...prev };
              delete copy[taskId];
              return copy;
            }
            return { ...prev, [taskId]: next };
          });
        }
      };
      const resetTaskEdit = (taskId) => {
        setTaskOverrides((prev) => {
          if (!prev[taskId]) return prev;
          const copy = { ...prev };
          delete copy[taskId];
          return copy;
        });
      };
      const getEffectiveTask = (t) => {
        const o = taskOverrides[t.id];
        if (!o) return t;
        return {
          ...t,
          name: (o.name && o.name.trim()) ? o.name : t.name,
          notes: (o.notes !== undefined) ? (o.notes || undefined) : t.notes,
        };
      };

      const openShiftDialog = () => { setPendingLaunchDate(launchDate); setShiftReason(''); setShowShiftDialog(true); };
      const applyShift = () => {
        if (!pendingLaunchDate || pendingLaunchDate === launchDate) { setShowShiftDialog(false); return; }
        const oldDate = new Date(launchDate + 'T12:00:00');
        const newDate = new Date(pendingLaunchDate + 'T12:00:00');
        const deltaDays = daysBetween(oldDate, newDate);
        if (!originalLaunchDate) setOriginalLaunchDate(launchDate);
        setShiftHistory((prev) => [...prev, { from: launchDate, to: pendingLaunchDate, deltaDays, reason: shiftReason || 'No reason provided', shiftedAt: new Date().toISOString() }]);
        setLaunchDate(pendingLaunchDate);
        setShowShiftDialog(false);
        setShiftReason('');
      };
      const quickShift = (days) => {
        if (!launchDate) return;
        const current = new Date(launchDate + 'T12:00:00');
        const newDate = addCalendarDays(current, days);
        setPendingLaunchDate(fmtDateIso(newDate));
        setShiftReason(days > 0 ? `Pushed out ${days} day${days === 1 ? '' : 's'}` : `Pulled in ${Math.abs(days)} day${Math.abs(days) === 1 ? '' : 's'}`);
        setShowShiftDialog(true);
      };
      // When an internal task slips, propagate the delay to the launch date.
      // All other pre-launch tasks shift forward automatically because their
      // dates are computed relative to launch_date — i.e. the rest of the
      // schedule slides with the launch.
      const delayTaskBy = (taskName, days) => {
        if (!launchDate || !Number.isFinite(days) || days === 0) return;
        const current = new Date(launchDate + 'T12:00:00');
        const newDate = addCalendarDays(current, days);
        setPendingLaunchDate(fmtDateIso(newDate));
        setShiftReason(`${taskName} delayed by ${days} day${Math.abs(days) === 1 ? '' : 's'} — pushing launch & remaining tasks`);
        setShowShiftDialog(true);
      };
      const promptDelayTask = (taskName) => {
        const input = window.prompt(
          `"${taskName}" is running late.\n\nHow many days will this delay the launch? (All remaining tasks will shift by the same amount.)`,
          '1'
        );
        if (input === null) return;
        const days = parseInt(String(input).trim(), 10);
        if (!Number.isFinite(days) || days <= 0) return;
        delayTaskBy(taskName, days);
      };

      const resetCampaign = () => { setCompletedTasks({}); setSkippedTasks({}); setShiftHistory([]); setOriginalLaunchDate(''); setCustomTasks([]); setTaskRoleOverrides({}); };
      const downloadPDF = () => { window.print(); };

      const copyToClipboard = () => {
        if (!timeline) return;
        const preset = CAMPAIGN_TYPES[campaignType];
        const lines = [];
        lines.push(`TJA CAMPAIGN LAUNCH BLUEPRINT`);
        if (clientName) lines.push(`Client: ${clientName}`);
        if (campaignName) lines.push(`Campaign: ${campaignName}`);
        lines.push(`Type: ${preset.label}`);
        lines.push(`Launch Date: ${fmtDateShort(timeline.launch)}`);
        if (originalLaunchDate && originalLaunchDate !== launchDate) lines.push(`Originally scheduled: ${fmtDateShort(new Date(originalLaunchDate + 'T12:00:00'))}`);
        lines.push(`Earliest Start: ${fmtDateShort(timeline.earliest)} (${timeline.totalRunway} ${businessDays ? 'business' : 'calendar'} days runway)`);
        lines.push(`Progress: ${timeline.completedCount}/${timeline.totalCount} complete`);
        if (timeline.skippedCount > 0) lines.push(`Skipped (N/A): ${timeline.skippedCount}`);
        lines.push(`Channels: ${Object.keys(channels).filter((k) => channels[k]).map((k) => CHANNELS.find((c) => c.id === k)?.label).join(', ')}`);
        lines.push('');
        Object.entries(timeline.preByPhase).forEach(([phase, tasks]) => {
          lines.push(`── ${phase.toUpperCase()} ──`);
          tasks.forEach((t) => {
            const sym = skippedTasks[t.id] ? '↷' : completedTasks[t.id] ? '✓' : '○';
            lines.push(`  ${sym} ${fmtDate(t.date)}  │  ${t.name}  │  ${t.role}${t.notes ? `\n      ↳ ${t.notes}` : ''}`);
          });
          lines.push('');
        });
        if (timeline.postLaunchTasks.length > 0) {
          lines.push(`🚀 LAUNCH — ${fmtDate(timeline.launch)}`);
          lines.push('');
          Object.entries(timeline.postByPhase).forEach(([phase, tasks]) => {
            lines.push(`── ${phase.toUpperCase()} ──`);
            tasks.forEach((t) => {
              const sym = skippedTasks[t.id] ? '↷' : completedTasks[t.id] ? '✓' : '○';
              lines.push(`  ${sym} ${fmtDate(t.date)}  │  ${t.name}  │  ${t.role}${t.notes ? `\n      ↳ ${t.notes}` : ''}`);
            });
            lines.push('');
          });
        }
        navigator.clipboard.writeText(lines.join('\n'));
        setCopied(true);
        setTimeout(() => setCopied(false), 2000);
      };

      const today = useMemo(() => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; }, []);

      const setRoleOverride = (taskId, role) => {
        setTaskRoleOverrides((prev) => ({ ...prev, [taskId]: role }));
        setOpenRoleChip(null);
      };
      const clearRoleOverride = (taskId) => {
        setTaskRoleOverrides((prev) => {
          if (!prev[taskId]) return prev;
          const next = { ...prev };
          delete next[taskId];
          return next;
        });
      };

      const RoleChip = ({ taskId, legacyRole }) => {
        const override = taskRoleOverrides[taskId];
        const role = resolveTaskRole(taskId, legacyRole, taskRoleOverrides);
        const cfg = ROLES[role];
        const isOpen = openRoleChip === taskId;
        return (
          <div className="relative inline-flex items-center gap-1 print:hidden">
            <button
              type="button"
              onClick={(e) => { e.stopPropagation(); setOpenRoleChip(isOpen ? null : taskId); }}
              className="inline-flex items-center gap-1.5 h-6 px-2 rounded-sm bg-stone-800 hover:bg-stone-700 border border-stone-700 hover:border-stone-600 transition-colors"
              title={override ? `Overridden to ${cfg.label}` : `Default role: ${cfg.label}`}
            >
              <span className="w-2 h-2 rounded-full" style={{ backgroundColor: cfg.color }}></span>
              <span className="text-[10px] font-bold uppercase tracking-wider" style={{ color: cfg.color }}>{cfg.label}</span>
              <ChevronDown className="w-3 h-3 text-stone-400" />
            </button>
            {override && (
              <button
                type="button"
                onClick={(e) => { e.stopPropagation(); clearRoleOverride(taskId); }}
                title="Reset to default role"
                className="p-0.5 text-stone-500 hover:text-amber-300 hover:bg-stone-800 rounded-sm"
              >
                <Undo2 className="w-3 h-3" />
              </button>
            )}
            {isOpen && (
              <>
                <div className="fixed inset-0 z-40" onClick={() => setOpenRoleChip(null)} />
                <div className="absolute top-full right-0 mt-1 z-50 bg-stone-900 border border-stone-700 rounded-sm shadow-xl py-1 min-w-[140px]">
                  {ROLE_KEYS.map((rk) => {
                    const rcfg = ROLES[rk];
                    const isCurrent = rk === role;
                    return (
                      <button
                        key={rk}
                        type="button"
                        onClick={(e) => { e.stopPropagation(); setRoleOverride(taskId, rk); }}
                        className={`w-full flex items-center gap-2 px-3 py-1.5 text-left text-xs hover:bg-stone-800 transition-colors ${isCurrent ? 'bg-stone-800/50' : ''}`}
                      >
                        <span className="w-2 h-2 rounded-full flex-shrink-0" style={{ backgroundColor: rcfg.color }}></span>
                        <span className="font-bold uppercase tracking-wider" style={{ color: rcfg.color }}>{rcfg.label}</span>
                        {isCurrent && <CheckCircle2 className="w-3 h-3 ml-auto text-stone-400" />}
                      </button>
                    );
                  })}
                  {override && (
                    <>
                      <div className="border-t border-stone-800 my-1"></div>
                      <button
                        type="button"
                        onClick={(e) => { e.stopPropagation(); clearRoleOverride(taskId); setOpenRoleChip(null); }}
                        className="w-full flex items-center gap-2 px-3 py-1.5 text-left text-xs text-stone-400 hover:bg-stone-800 transition-colors"
                      >
                        <Undo2 className="w-3 h-3" />
                        <span className="uppercase tracking-wider font-bold">Reset to default</span>
                      </button>
                    </>
                  )}
                </div>
              </>
            )}
          </div>
        );
      };

      const TaskRow = ({ t: rawT }) => {
        const t = getEffectiveTask(rawT);
        const status = getTaskStatus(t, completedTasks, skippedTasks, today);
        if (status === 'skipped' && !showSkipped) return null;
        const styleCfg = STATUS_STYLES[status];
        const StatusIcon = styleCfg.icon;
        const isDone = status === 'done';
        const isSkipped = status === 'skipped';
        const completion = completedTasks[t.id];
        const isEditing = editingTaskId === t.id;
        const isOverridden = !rawT.isCustom && !!taskOverrides[t.id];
        return (
          <div className={`group px-4 md:px-5 py-3 border-b border-stone-800 last:border-b-0 transition-colors ${styleCfg.bg} hover:bg-stone-800/50 print:bg-white print:border-stone-300 print:hover:bg-white ${isSkipped ? 'opacity-50' : ''}`}>
            <div className="flex items-start gap-3 md:gap-4">
              <button
                onClick={() => toggleTaskComplete(t.id, t.date)}
                disabled={isSkipped}
                className={`flex-shrink-0 mt-0.5 w-5 h-5 rounded border-2 flex items-center justify-center transition-all print:hidden ${isSkipped ? 'border-stone-700 bg-stone-800 cursor-not-allowed' : isDone ? 'bg-emerald-500 border-emerald-500' : 'border-stone-600 hover:border-amber-400 bg-stone-900'}`}
                aria-label={isDone ? 'Mark incomplete' : 'Mark complete'}
              >
                {isDone && <CheckCircle2 className="w-4 h-4 text-stone-950" strokeWidth={3} />}
              </button>
              <div className="hidden print:block flex-shrink-0 w-4 h-4 mt-1 border border-stone-700 rounded-sm">
                {isDone && <div className="w-full h-full bg-stone-800 flex items-center justify-center text-white text-xs leading-none">✓</div>}
                {isSkipped && <div className="w-full h-full flex items-center justify-center text-stone-700 text-xs leading-none">↷</div>}
              </div>
              <div className="flex-shrink-0 w-16 md:w-20 print:w-20">
                <div className="text-[10px] text-stone-500 uppercase tracking-widest font-semibold print:text-stone-500">{t.date.toLocaleDateString('en-US', { weekday: 'short' })}</div>
                <div className={`text-sm font-bold ${isDone || isSkipped ? 'text-stone-500 line-through' : 'text-amber-50 print:text-stone-900'}`}>{t.date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}</div>
              </div>
              <div className="flex-1 min-w-0">
                <div className="flex items-start justify-between gap-2 flex-wrap">
                  <div className={`text-sm font-medium ${isDone || isSkipped ? 'text-stone-500 line-through' : 'text-stone-100 print:text-stone-900'}`}>
                    {isEditing ? (
                      <input
                        type="text"
                        defaultValue={t.name}
                        autoFocus
                        onBlur={(e) => { saveTaskEdit(t.id, { name: e.target.value }); }}
                        onKeyDown={(e) => {
                          if (e.key === 'Enter') { e.target.blur(); setEditingTaskId(null); }
                          if (e.key === 'Escape') { setEditingTaskId(null); }
                        }}
                        className="w-full px-2 py-1 bg-stone-800 border border-amber-400 rounded-sm text-sm text-stone-100 focus:outline-none"
                      />
                    ) : (
                      <span>{t.name}</span>
                    )}
                    {rawT.isCustom && <span className="ml-2 text-[9px] uppercase tracking-wider bg-fuchsia-400/20 text-fuchsia-300 px-1.5 py-0.5 rounded-sm print:bg-fuchsia-100 print:text-fuchsia-900">Custom</span>}
                    {isOverridden && !isEditing && <span className="ml-2 text-[9px] uppercase tracking-wider bg-amber-400/20 text-amber-300 px-1.5 py-0.5 rounded-sm print:hidden" title="Customized — click reset to revert">Edited</span>}
                  </div>
                  <div className="flex items-center gap-1.5 flex-wrap">
                    <span className={`text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded-sm print:border print:border-stone-400 ${ROLE_STYLES[t.role] || 'bg-stone-700 text-stone-100'}`}>{t.role}</span>
                    <RoleChip taskId={t.id} legacyRole={t.role} />
                  </div>
                </div>
                {isEditing ? (
                  <textarea
                    defaultValue={t.notes || ''}
                    placeholder="Description / notes (optional)"
                    rows={2}
                    onBlur={(e) => { saveTaskEdit(t.id, { notes: e.target.value }); }}
                    onKeyDown={(e) => { if (e.key === 'Escape') { setEditingTaskId(null); } }}
                    className="w-full mt-1 px-2 py-1 bg-stone-800 border border-stone-700 rounded-sm text-xs text-stone-200 placeholder:text-stone-500 focus:outline-none focus:border-amber-400"
                  />
                ) : (
                  t.notes && <div className="text-xs text-stone-400 mt-1 italic print:text-stone-600">{t.notes}</div>
                )}
                <div className="flex items-center gap-2 mt-1.5 flex-wrap">
                  <div className={`flex items-center gap-1 text-[11px] ${status === 'overdue' || status === 'pending-overdue' ? 'text-red-400 font-semibold print:text-red-700' : 'text-stone-400 print:text-stone-600'}`}>
                    <StatusIcon className={`w-3 h-3 ${styleCfg.iconClass}`} />
                    <span>{styleCfg.label}</span>
                  </div>
                  {!isDone && !isSkipped && (
                    <span className="text-[10px] text-stone-500 print:text-stone-500">
                      {t.timing === 'post'
                        ? `${Math.abs(t.daysPrior)} ${businessDays ? 'biz' : 'cal'} day${Math.abs(t.daysPrior) === 1 ? '' : 's'} after launch`
                        : `T-${t.daysPrior} ${businessDays ? 'biz' : 'cal'} days`}
                    </span>
                  )}
                  {isDone && completion && <span className="text-[10px] text-emerald-400 font-semibold print:text-emerald-700">Completed {new Date(completion.completedAt).toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}</span>}
                </div>
              </div>
              <div className={`flex-shrink-0 ${isEditing ? '' : 'opacity-0 group-hover:opacity-100'} transition-opacity flex items-center gap-1 print:hidden`}>
                {isEditing ? (
                  <button onClick={() => setEditingTaskId(null)} className="p-1 text-emerald-400 hover:bg-stone-800 rounded" title="Done editing">
                    <CheckCircle2 className="w-3.5 h-3.5" />
                  </button>
                ) : (
                  <button onClick={() => setEditingTaskId(t.id)} className="p-1 text-stone-400 hover:text-amber-400 hover:bg-stone-800 rounded" title="Edit name & description">
                    <Pencil className="w-3.5 h-3.5" />
                  </button>
                )}
                {isOverridden && !isEditing && (
                  <button onClick={() => resetTaskEdit(t.id)} className="p-1 text-stone-400 hover:text-amber-400 hover:bg-stone-800 rounded" title="Reset to default">
                    <Undo2 className="w-3.5 h-3.5" />
                  </button>
                )}
                {!isEditing && !isDone && !isSkipped && t.timing !== 'post' && launchDate && (
                  <button
                    onClick={() => promptDelayTask(t.name)}
                    className="p-1 text-stone-400 hover:text-red-400 hover:bg-stone-800 rounded"
                    title="Mark this task running late — pushes the launch date and shifts every remaining task by the same amount"
                  >
                    <CalendarClock className="w-3.5 h-3.5" />
                  </button>
                )}
                <button onClick={() => toggleTaskSkip(t.id)} className="p-1 text-stone-400 hover:text-amber-400 hover:bg-stone-800 rounded" title={isSkipped ? 'Un-skip' : 'Mark N/A'}>
                  {isSkipped ? <Undo2 className="w-3.5 h-3.5" /> : <SkipForward className="w-3.5 h-3.5" />}
                </button>
                {rawT.isCustom && (
                  <button onClick={() => removeCustomTask(t.id)} className="p-1 text-stone-400 hover:text-red-400 hover:bg-stone-800 rounded" title="Delete custom task">
                    <Trash2 className="w-3.5 h-3.5" />
                  </button>
                )}
              </div>
            </div>
          </div>
        );
      };

      const PhaseCard = ({ phase, tasks }) => {
        const cfg = PHASE_STYLES[phase] || PHASE_STYLES['Custom'];
        const active = tasks.filter((t) => !skippedTasks[t.id]);
        const doneInPhase = active.filter((t) => completedTasks[t.id]).length;
        const skipped = tasks.filter((t) => skippedTasks[t.id]).length;
        return (
          <div className="bg-stone-900 rounded-sm border border-stone-800 overflow-hidden shadow-lg shadow-black/20 print:shadow-none print:break-inside-avoid print:bg-white print:border-stone-300">
            <div className={`relative px-5 py-3 border-b border-stone-800 ${cfg.tint} ${cfg.printTint} print:border-b-2 print:border-stone-900`}>
              <div className={`absolute left-0 top-0 bottom-0 w-1 ${cfg.bar}`}></div>
              <div className="flex items-center justify-between pl-2 gap-3">
                <h3 className={`font-black text-sm uppercase tracking-[0.15em] ${cfg.text} ${cfg.printText}`}>{phase}</h3>
                <div className="flex items-center gap-3">
                  <span className="text-[10px] font-bold text-stone-400 uppercase tracking-widest print:text-stone-600">
                    {doneInPhase}/{active.length} done{skipped > 0 && <span className="text-stone-500"> · {skipped} N/A</span>}
                  </span>
                  <button
                    onClick={() => openAddTaskInPhase(phase)}
                    className="flex items-center gap-1 px-2 py-1 bg-stone-800 hover:bg-amber-400 hover:text-stone-950 text-stone-300 rounded-sm text-[10px] font-bold uppercase tracking-wider transition-colors print:hidden"
                    title={`Add custom task to ${phase}`}
                  >
                    <Plus className="w-3 h-3" /> Add
                  </button>
                </div>
              </div>
            </div>
            <div>{tasks.map((t) => <TaskRow key={t.id} t={t} />)}</div>
          </div>
        );
      };

      const RequirementToggle = ({ id, label, hint }) => (
        <label className="flex items-start gap-3 p-2.5 border border-stone-800 rounded-sm cursor-pointer hover:bg-stone-800/50 hover:border-stone-700 transition-colors">
          <input type="checkbox" checked={!!requirements[id]} onChange={() => toggleReq(id)} className="w-4 h-4 mt-0.5 accent-amber-400" />
          <div className="flex-1">
            <div className="text-sm font-semibold text-stone-200">{label}</div>
            <div className="text-[11px] text-stone-500 mt-0.5">{hint}</div>
          </div>
        </label>
      );

      const saveLabel = saveState === 'saving' ? 'Saving…'
        : saveState === 'saved' ? 'Saved'
        : saveState === 'error' ? "Couldn't save"
        : '';

      return (
        <div className="min-h-screen bg-stone-950 print:bg-white">
          {/* Print-only header */}
          <div className="hidden print:block px-8 py-6 border-b-4 border-stone-900 bg-white">
            <div className="flex items-start justify-between">
              <div>
                <div className="flex items-center gap-2 mb-2">
                  <Zap className="w-6 h-6 text-orange-700" fill="currentColor" strokeWidth={0} />
                  <div className="text-xs uppercase tracking-[0.3em] font-bold text-stone-600">The James Agency</div>
                </div>
                <h1 className="text-3xl font-black text-stone-900 tracking-tight uppercase">Campaign Launch Blueprint</h1>
                {(clientName || campaignName) && (
                  <div className="mt-2 text-stone-700">
                    {clientName && <span className="font-bold">{clientName}</span>}
                    {clientName && campaignName && <span className="mx-2 text-stone-400">│</span>}
                    {campaignName && <span>{campaignName}</span>}
                  </div>
                )}
              </div>
              {timeline && (
                <div className="text-right">
                  <div className="text-[10px] uppercase tracking-widest text-stone-500 font-bold">Launch</div>
                  <div className="text-2xl font-black text-stone-900">{fmtDateShort(timeline.launch)}</div>
                  <div className="text-xs text-stone-600 mt-1">{timeline.completedCount}/{timeline.totalCount} complete · {timeline.totalRunway} day runway</div>
                </div>
              )}
            </div>
          </div>

          {/* Save-error banner (suppressed when parent shows it) */}
          {!hideTopBar && saveState === 'error' && (
            <div className="print:hidden bg-red-900/50 border-b border-red-800 px-4 md:px-6 py-2">
              <div className="max-w-7xl mx-auto flex items-center gap-2 text-sm text-red-100">
                <AlertCircle className="w-4 h-4" />
                <span className="font-bold">Couldn't save</span>
                <span className="text-red-300 text-xs">{saveError || 'Connection issue.'}</span>
                <button onClick={onRetry} className="ml-auto px-2 py-1 bg-red-800 hover:bg-red-700 rounded-sm text-xs font-bold uppercase tracking-wider">Retry</button>
              </div>
            </div>
          )}

          <div className="max-w-7xl mx-auto p-4 md:p-6 print:p-0 print:max-w-full">
            {!hideTopBar && (
              <div className="mb-4 print:hidden flex items-center justify-between flex-wrap gap-2">
                <button onClick={onBack} className="flex items-center gap-1.5 text-xs uppercase tracking-wider font-bold text-stone-400 hover:text-amber-300 transition-colors">
                  <ArrowLeft className="w-4 h-4" /> Back to Dashboard
                </button>
                {saveLabel && (
                  <div className={`flex items-center gap-1.5 text-[11px] font-bold uppercase tracking-wider ${saveState === 'saving' ? 'text-stone-400' : saveState === 'saved' ? 'text-emerald-400' : 'text-red-400'}`}>
                    {saveState === 'saving' && <Loader2 className="w-3 h-3 animate-spin" />}
                    {saveState === 'saved' && <CheckCircle2 className="w-3 h-3" />}
                    {saveState === 'error' && <AlertCircle className="w-3 h-3" />}
                    {saveLabel}
                  </div>
                )}
              </div>
            )}

            <div className="mb-6 print:hidden">
              <div className="flex items-center justify-between flex-wrap gap-3">
                <div className="flex items-center gap-3">
                  <div className="relative w-11 h-11 bg-amber-400 rounded-sm flex items-center justify-center shadow-lg shadow-orange-500/20">
                    <Zap className="w-6 h-6 text-stone-950" fill="currentColor" strokeWidth={0} />
                  </div>
                  <div>
                    <div className="text-[10px] uppercase tracking-[0.3em] font-bold text-amber-400">The James Agency</div>
                    <h1 className="text-2xl font-black text-amber-50 tracking-tight uppercase">Campaign Launch Blueprint</h1>
                  </div>
                </div>
                {timeline && (
                  <div className="flex items-center gap-2">
                    <button onClick={copyToClipboard} className="flex items-center gap-1.5 px-3 py-2 bg-stone-900 border border-stone-700 text-stone-200 rounded-sm text-xs font-bold uppercase tracking-wider hover:bg-stone-800 hover:border-amber-400/50 transition-colors">
                      {copied ? <><CheckCircle2 className="w-4 h-4 text-emerald-400" /> Copied</> : <><Copy className="w-4 h-4" /> Copy</>}
                    </button>
                    <button onClick={downloadPDF} className="flex items-center gap-1.5 px-3 py-2 bg-stone-900 border border-stone-700 text-stone-200 rounded-sm text-xs font-bold uppercase tracking-wider hover:bg-stone-800 hover:border-amber-400/50 transition-colors">
                      <Download className="w-4 h-4" /> PDF
                    </button>
                  </div>
                )}
              </div>
              <p className="text-stone-400 text-sm ml-14 mt-1 italic">Marketing that moves the needle, not just the metrics.</p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-5 gap-6 print:block">
              {/* Sidebar */}
              <div className="lg:col-span-2 space-y-4 print:hidden">
                {/* Launch Date — hero input */}
                <div className="bg-gradient-to-br from-stone-900 via-stone-900 to-amber-950/40 rounded-sm border-2 border-amber-400/40 p-5 shadow-lg shadow-amber-400/10">
                  <div className="flex items-center gap-2.5 mb-3">
                    <div className="w-8 h-8 bg-amber-400 rounded-sm flex items-center justify-center flex-shrink-0 shadow-md shadow-amber-400/30">
                      <Calendar className="w-4 h-4 text-stone-950" strokeWidth={2.5} />
                    </div>
                    <div>
                      <h2 className="font-black text-amber-50 text-xs uppercase tracking-[0.2em]">Campaign Launch Date</h2>
                      <p className="text-[9px] text-amber-300/80 uppercase tracking-[0.15em] font-bold mt-0.5">Step 1 · Timeline reverse-engineers from here</p>
                    </div>
                  </div>
                  <input type="date" value={launchDate} onChange={(e) => { if (!launchDate) { setLaunchDate(e.target.value); } else { setPendingLaunchDate(e.target.value); setShowShiftDialog(true); } }} className="w-full px-3 py-2.5 bg-stone-950 border border-amber-400/30 rounded-sm text-base text-amber-50 font-bold focus:outline-none focus:ring-2 focus:ring-amber-400 focus:border-amber-400 [color-scheme:dark]" />
                  {!launchDate ? (
                    <p className="text-[11px] text-stone-400 mt-2 italic">Pick your launch target — every task will backward-plan from this date.</p>
                  ) : (
                    <div className="mt-3 pt-3 border-t border-amber-400/20">
                      {(() => {
                        const daysUntil = daysBetween(today, new Date(launchDate + 'T12:00:00'));
                        if (daysUntil < 0) return <p className="text-xs text-red-400 font-bold uppercase tracking-wider">⚠︎ {Math.abs(daysUntil)} day{Math.abs(daysUntil) === 1 ? '' : 's'} in the past</p>;
                        if (daysUntil === 0) return <p className="text-xs text-orange-400 font-black uppercase tracking-wider">🚀 Launching today</p>;
                        return (
                          <div className="flex items-baseline gap-1.5">
                            <span className="font-black text-2xl text-amber-50 leading-none">{daysUntil}</span>
                            <span className="uppercase tracking-[0.15em] text-[10px] font-bold text-amber-300/80">days until launch</span>
                          </div>
                        );
                      })()}
                    </div>
                  )}
                  {originalLaunchDate && originalLaunchDate !== launchDate && (
                    <div className="mt-2 text-[11px] text-stone-500">
                      Original: <span className="line-through">{fmtDateShort(new Date(originalLaunchDate + 'T12:00:00'))}</span>
                    </div>
                  )}
                </div>

                <div className="bg-stone-900 rounded-sm border border-stone-800 p-5 shadow-lg shadow-black/20">
                  <div className="flex items-center gap-2 mb-4 pb-3 border-b border-stone-800">
                    <Settings className="w-4 h-4 text-stone-400" />
                    <h2 className="font-black text-amber-50 text-xs uppercase tracking-[0.2em]">Campaign Details</h2>
                  </div>
                  <div className="space-y-3">
                    <div>
                      <label className="block text-[11px] font-bold uppercase tracking-wider text-stone-400 mb-1">Client</label>
                      <input type="text" value={clientName} onChange={(e) => setClientName(e.target.value)} placeholder="e.g. USA Pickleball" className="w-full px-3 py-2 bg-stone-800 border border-stone-700 rounded-sm text-sm text-stone-100 placeholder:text-stone-500 focus:outline-none focus:ring-2 focus:ring-amber-400 focus:border-amber-400" />
                    </div>
                    <div>
                      <label className="block text-[11px] font-bold uppercase tracking-wider text-stone-400 mb-1">Campaign</label>
                      <input type="text" value={campaignName} onChange={(e) => setCampaignName(e.target.value)} placeholder="e.g. Nationals 2026" className="w-full px-3 py-2 bg-stone-800 border border-stone-700 rounded-sm text-sm text-stone-100 placeholder:text-stone-500 focus:outline-none focus:ring-2 focus:ring-amber-400 focus:border-amber-400" />
                    </div>
                    <div>
                      <label className="block text-[11px] font-bold uppercase tracking-wider text-stone-400 mb-1">Campaign Type</label>
                      <select value={campaignType} onChange={(e) => setCampaignType(e.target.value)} className="w-full px-3 py-2 bg-stone-800 border border-stone-700 rounded-sm text-sm text-stone-100 focus:outline-none focus:ring-2 focus:ring-amber-400">
                        {Object.entries(CAMPAIGN_TYPES).map(([k, v]) => (<option key={k} value={k}>{v.label}</option>))}
                      </select>
                      <p className="text-[11px] text-stone-500 mt-1.5 italic">{CAMPAIGN_TYPES[campaignType].description}</p>
                    </div>
                    <div className="flex items-center gap-2 pt-2 border-t border-stone-800">
                      <label className="text-[11px] font-bold uppercase tracking-wider text-stone-400">Counting:</label>
                      <div className="flex gap-0.5 bg-stone-800 rounded-sm p-0.5">
                        <button onClick={() => setBusinessDays(true)} className={`px-2.5 py-1 text-xs uppercase tracking-wider font-bold rounded-sm transition-colors ${businessDays ? 'bg-amber-400 text-stone-950' : 'text-stone-400 hover:text-stone-200'}`}>Biz</button>
                        <button onClick={() => setBusinessDays(false)} className={`px-2.5 py-1 text-xs uppercase tracking-wider font-bold rounded-sm transition-colors ${!businessDays ? 'bg-amber-400 text-stone-950' : 'text-stone-400 hover:text-stone-200'}`}>Cal</button>
                      </div>
                    </div>
                  </div>
                </div>

                <div className="bg-stone-900 rounded-sm border border-stone-800 p-5 shadow-lg shadow-black/20">
                  <h2 className="font-black text-amber-50 text-xs uppercase tracking-[0.2em] mb-3 pb-3 border-b border-stone-800">Channels</h2>
                  <div className="grid grid-cols-2 gap-1.5">
                    {CHANNELS.map((c) => (
                      <label key={c.id} className={`flex items-center gap-2 px-3 py-2 border rounded-sm cursor-pointer transition-all text-sm ${channels[c.id] ? 'border-amber-400 bg-amber-400/10 text-amber-50 font-semibold' : 'border-stone-700 hover:border-stone-600 text-stone-300'}`}>
                        <input type="checkbox" checked={!!channels[c.id]} onChange={() => toggleChannel(c.id)} className="sr-only" />
                        <span className={`w-3 h-3 rounded-full border ${channels[c.id] ? 'bg-orange-500 border-orange-400' : 'border-stone-600'}`}></span>
                        <span>{c.label}</span>
                      </label>
                    ))}
                  </div>
                </div>

                <div className="bg-stone-900 rounded-sm border border-stone-800 p-5 shadow-lg shadow-black/20">
                  <h2 className="font-black text-amber-50 text-xs uppercase tracking-[0.2em] mb-3 pb-3 border-b border-stone-800">Scope & Requirements</h2>
                  <div className="space-y-3">
                    <div>
                      <div className="text-[10px] uppercase tracking-widest font-bold text-stone-500 mb-1.5">Scope Additions</div>
                      <div className="space-y-1.5">
                        <RequirementToggle id="firstPartyData" label="First-Party Data (LiveRamp)" hint="Adds 10-day upload window + 3-day port cycle" />
                        <RequirementToggle id="callTracking" label="Call Tracking (CallRail)" hint="Adds CallRail setup & QA tasks" />
                        <RequirementToggle id="videoCreative" label="Video Creative Production" hint="Adds video asset delivery task" />
                        <RequirementToggle id="newLandingPages" label="New Landing Pages" hint="Toggle off if using existing LPs" />
                      </div>

                    </div>
                  </div>

                    <p className="text-[11px] text-stone-500 mt-1">Counted as {businessDays ? 'business' : 'calendar'} days based on current setting.</p>
                  </div>
                  <div>
                    <label className="block text-[11px] font-bold uppercase tracking-wider text-stone-400 mb-1">Notes (optional)</label>

                  </div>
                </div>
                <div className="flex gap-2 mt-5">
                  <button onClick={addCustomTask} disabled={!customTaskDraft.name.trim()} className="flex-1 px-3 py-2 bg-amber-400 text-stone-950 rounded-sm text-xs font-bold uppercase tracking-wider hover:bg-amber-300 disabled:opacity-50 disabled:cursor-not-allowed">Add Task</button>
                  <button onClick={() => setShowCustomTaskDialog(false)} className="px-3 py-2 bg-stone-800 text-stone-200 rounded-sm text-xs font-bold uppercase tracking-wider hover:bg-stone-700">Cancel</button>
                </div>
              </div>
            </div>
          )}
        </div>

        mediaBuyer: "Sydnie/Pathlabs"
      },
      {
        id: "blank-custom",
        label: "+ Blank · Custom Placement",
        vendor: "",
        mediaType: "",
        spec: "",
        mediaBuyer: "Sydnie/Pathlabs"
      }
    ];

    function newPlacementId() {
      if (window.crypto && window.crypto.randomUUID) return window.crypto.randomUUID();
      return 'p-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 9);
    }

    function blankPlacement(defaults = {}) {
      return {
        id: newPlacementId(),
        adNumber: '',
        mediaBuyer: '',
        vendor: '',
        mediaType: '',
        spec: '',
        quantity: '',
        targetAudience: '',
        goal: '',
        startDate: '',
        endDate: '',
        landingPage: '',
        trafficked: false,
        notes: '',
        ...defaults,
      };
    }

    function sanitizeFilename(s) {
      return (s || 'Untitled')
        .replace(/[\\/:*?"<>|]/g, '')
        .replace(/\s+/g, '-')
        .replace(/-+/g, '-')
        .replace(/^-|-$/g, '') || 'Untitled';
    }

    function groupByVendor(placements) {
      const map = new Map();
      placements.forEach((p) => {
        const key = (p.vendor || '').trim() || 'Unassigned';
        if (!map.has(key)) map.set(key, []);
        map.get(key).push(p);
      });
      return map;
    }

    function autoAdNumberFor(placement, vendorPlacements) {
      if (placement.adNumber && placement.adNumber.trim()) return placement.adNumber.trim();
      const idx = vendorPlacements.findIndex((p) => p.id === placement.id);
      return (idx + 1).toString().padStart(2, '0');
    }

    function fmtToolkitDate(iso) {
      if (!iso) return '';
      const d = parseDateSafe(iso);
      if (!d) return iso;
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }

    // ---- PDF generator ----
    function generateToolkitPDF({ campaign, placements }) {
      if (!window.jspdf || !window.jspdf.jsPDF) {
        alert('PDF library failed to load. Please refresh the page and try again.');
        return;
      }
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ orientation: 'landscape', unit: 'in', format: 'letter' });
      const pageW = doc.internal.pageSize.getWidth();   // 11
      const pageH = doc.internal.pageSize.getHeight();  // 8.5
      const marginX = 0.5;

      // ---- Page 1 header (repeat on every page via didDrawPage in autoTable,
      //      but we draw the big top block only on page 1 here)
      const drawHeader = () => {
        // Black bar ~0.6" tall across top
        doc.setFillColor(0, 0, 0);
        doc.rect(0, 0, pageW, 0.6, 'F');
        // TOOLKIT left
        doc.setFont('helvetica', 'bold');
        doc.setTextColor(255, 255, 255);
        doc.setFontSize(26);
        doc.text('TOOLKIT', marginX, 0.42);
        // THE JAMES AGENCY right
        doc.setFontSize(9);
        doc.text('THE JAMES AGENCY', pageW - marginX, 0.38, { align: 'right' });
        // Orange accent bar
        doc.setFillColor(246, 142, 33);
        doc.rect(0, 0.6, pageW, 0.05, 'F');
      };

      const drawFooter = (pageNum, pageCount) => {
        const y = pageH - 0.3;
        doc.setDrawColor(246, 142, 33);
        doc.setLineWidth(0.02);
        // small orange pipe separator
        const rightAgency = 'THE JAMES AGENCY';
        doc.setFont('helvetica', 'bold');
        doc.setFontSize(7);
        doc.setTextColor(0, 0, 0);
        const pageLabel = `Page ${pageNum} of ${pageCount}`;
        // agency on right, page label to right of agency
        const agencyW = doc.getTextWidth(rightAgency);
        const pageW2 = doc.getTextWidth(pageLabel);
        // layout: [AGENCY] | [PAGE X OF Y] flush right
        const pageLabelX = pageW - marginX;
        doc.text(pageLabel, pageLabelX, y, { align: 'right' });
        // orange pipe
        const pipeX = pageLabelX - pageW2 - 0.08;
        doc.setDrawColor(246, 142, 33);
        doc.setLineWidth(0.04);
        doc.line(pipeX, y - 0.1, pipeX, y + 0.02);
        // agency
        doc.setTextColor(0, 0, 0);
        doc.text(rightAgency, pipeX - 0.08, y, { align: 'right' });
      };

      // Draw header on first page
      drawHeader();
      doc._headerDrawn = { 1: true };

      // Document title block below header
      let cursorY = 0.95;
      doc.setTextColor(0, 0, 0);
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(14);
      const title = campaign.name || 'Untitled Campaign';
      doc.text(title, marginX, cursorY);
      cursorY += 0.25;
      if (campaign.client) {
        doc.setFont('helvetica', 'normal');
        doc.setFontSize(11);
        doc.setTextColor(110, 110, 110);
        doc.text(campaign.client, marginX, cursorY);
        cursorY += 0.22;
      }
      if (campaign.launch_date) {
        doc.setFont('helvetica', 'normal');
        doc.setFontSize(10);
        doc.setTextColor(80, 80, 80);
        const launchStr = 'Launch: ' + fmtToolkitDate(campaign.launch_date);
        doc.text(launchStr, marginX, cursorY);
        cursorY += 0.22;
      }

      cursorY += 0.1;

      // Group placements by vendor for tables
      const groups = groupByVendor(placements);
      if (groups.size === 0) {
        doc.setFont('helvetica', 'italic');
        doc.setFontSize(11);
        doc.setTextColor(120, 120, 120);
        doc.text('No placements yet.', marginX, cursorY + 0.2);
      }

      const head = [[
        'Ad #', 'Media Type', 'Spec', 'Qty', 'Target Audience',
        'Goal', 'Start', 'End', 'Landing Page', 'Traffic', 'Notes',
      ]];

      let isFirstGroup = true;
      groups.forEach((vendorPlacements, vendorName) => {
        // vendor section heading
        const startY = isFirstGroup ? cursorY : (doc.lastAutoTable ? doc.lastAutoTable.finalY + 0.3 : cursorY);
        // If we're too close to the bottom, autoTable will handle page breaks;
        // but for the vendor heading we need manual logic
        let headingY = startY;
        if (headingY > pageH - 1.2) {
          doc.addPage();
          drawHeader();
          doc._headerDrawn = doc._headerDrawn || {};
          doc._headerDrawn[doc.internal.getCurrentPageInfo().pageNumber] = true;
          headingY = 0.95;
        }
        doc.setFont('helvetica', 'bold');
        doc.setFontSize(10);
        doc.setTextColor(0, 0, 0);
        doc.text((vendorName || 'Unassigned').toUpperCase(), marginX, headingY);
        // subtle underline
        doc.setDrawColor(0, 0, 0);
        doc.setLineWidth(0.01);
        doc.line(marginX, headingY + 0.04, pageW - marginX, headingY + 0.04);

        const body = vendorPlacements.map((p) => [
          autoAdNumberFor(p, vendorPlacements),
          p.mediaType || '',
          p.spec || '',
          p.quantity || '',
          p.targetAudience || '',
          p.goal || '',
          p.startDate ? fmtToolkitDate(p.startDate) : '',
          p.endDate ? fmtToolkitDate(p.endDate) : '',
          p.landingPage || '',
          p.trafficked ? 'Yes' : '',
          p.notes || '',
        ]);

        doc.autoTable({
          head,
          body,
          startY: headingY + 0.12,
          margin: { left: marginX, right: marginX, top: 0.9, bottom: 0.5 },
          theme: 'plain',
          styles: {
            font: 'helvetica',
            fontSize: 7.5,
            cellPadding: 0.06,
            textColor: [0, 0, 0],
            lineColor: [220, 220, 220],
            lineWidth: 0.005,
            overflow: 'linebreak',
            valign: 'top',
          },
          headStyles: {
            fillColor: [0, 0, 0],
            textColor: [255, 255, 255],
            fontStyle: 'bold',
            fontSize: 8,
            halign: 'left',
            lineWidth: 0,
          },
          bodyStyles: {
            fillColor: [255, 255, 255],
          },
          alternateRowStyles: {
            fillColor: [247, 247, 247],
          },
          columnStyles: {
            0: { cellWidth: 0.45 },  // Ad #
            1: { cellWidth: 0.9 },   // Media Type
            2: { cellWidth: 2.3 },   // Spec (widest)
            3: { cellWidth: 0.5 },   // Qty
            4: { cellWidth: 1.0 },   // Target Audience
            5: { cellWidth: 0.9 },   // Goal
            6: { cellWidth: 0.7 },   // Start
            7: { cellWidth: 0.7 },   // End
            8: { cellWidth: 1.1 },   // Landing Page
            9: { cellWidth: 0.45 },  // Traffic
            10: { cellWidth: 1.0 },  // Notes
          },
          didDrawPage: (data) => {
            // On any page created by autoTable (page 2+), draw the header
            if (data.pageNumber > 1 || (data.pageNumber === 1 && data.cursor && data.cursor.y < 0.9)) {
              // Only draw top header if this is a new page (not initial)
            }
            // autoTable fires didDrawPage for every page including the first.
            // We already drew header on page 1; only redraw for new pages.
            const currentPage = doc.internal.getCurrentPageInfo().pageNumber;
            if (currentPage > 1) {
              // Check if header has been drawn on this page by tracking via doc internal
              // Simplest: always draw on pages > 1. autoTable respects margin.top so
              // drawing a 0.65" header won't overlap.
              // But don't double-draw — guard with a flag on the page.
              if (!doc._headerDrawn || !doc._headerDrawn[currentPage]) {
                doc._headerDrawn = doc._headerDrawn || {};
                doc._headerDrawn[currentPage] = true;
                drawHeader();
              }
            }
          },
        });

        isFirstGroup = false;
      });

      // Finalize: footer on every page with page numbers
      const totalPages = doc.internal.getNumberOfPages();
      for (let i = 1; i <= totalPages; i++) {
        doc.setPage(i);
        drawFooter(i, totalPages);
      }

      const filename = `Toolkit - ${sanitizeFilename(campaign.client || 'Client')} - ${sanitizeFilename(campaign.name || 'Campaign')}.pdf`;
      doc.save(filename);
    }
