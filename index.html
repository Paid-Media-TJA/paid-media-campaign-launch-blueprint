    // ============================================================
    // PROGRESS CALCULATION (for dashboard cards)
    // Given a campaign row (with top-level launch_date, and data.*),
    // returns { completed, total, pct }
    // ============================================================
    function calculateProgress(campaign) {
      try {
        const data = campaign.data || {};
        const launchDate = campaign.launch_date;
        if (!launchDate) return { completed: 0, total: 0, pct: 0 };

        const launch = parseDateSafe(launchDate);
        if (!launch) return { completed: 0, total: 0, pct: 0 };

        const campaignType = data.campaignType || 'net-new';
        const preset = CAMPAIGN_TYPES[campaignType] || CAMPAIGN_TYPES['net-new'];
        const channels = data.channels || {};
        const requirements = data.requirements || {};
        const businessDays = data.businessDays !== false;
        const completedTasks = data.completedTasks || {};
        const skippedTasks = data.skippedTasks || {};
        const customTasks = Array.isArray(data.customTasks) ? data.customTasks : [];
        const includeInternalCreative = !!data.includeInternalCreative;
        const internalStages = Array.isArray(data.internalStages) ? data.internalStages : [];
        const includeLandingPage = !!data.includeLandingPage;
        const landingPageStages = Array.isArray(data.landingPageStages) ? data.landingPageStages : [];
        const includeDashboard = data.includeDashboard !== false;
        const dashboardLeadDays = Number(data.dashboardLeadDays) || 2;

        const flags = { ...requirements };
        Object.keys(channels).forEach((k) => { if (channels[k]) flags[k] = true; });

        const taskPasses = (t) => {
          if (preset.excludedPhases.includes(t.phase)) return false;
          if (preset.excludedTasks && preset.excludedTasks.includes(t.id)) return false;
          if (t.requires && !t.requires.every((r) => flags[r])) return false;
          if (t.requiresAny && !t.requiresAny.some((r) => flags[r])) return false;
          return true;
        };

        const filtered = TASKS.filter(taskPasses).map((t) => ({ ...t, timing: 'pre' }));
        const custom = customTasks.map((t) => ({ ...t, timing: 'pre', isCustom: true }));

        const internalTasks = [];
        if (includeInternalCreative) {
          let cumulative = 3;
          [...internalStages].reverse().forEach((stage) => {
            cumulative += Number(stage.days) || 0;
            internalTasks.unshift({
              id: `internal-${stage.id}`, phase: 'Internal Creative', name: stage.name,
              daysPrior: cumulative, role: 'Internal Creative', timing: 'pre',
            });
          });
        }

        const landingPageTasks = [];
        if (includeLandingPage) {
          let cumulative = 6;
          [...landingPageStages].reverse().forEach((stage) => {
            cumulative += Number(stage.days) || 0;
            landingPageTasks.unshift({
              id: `landingpage-${stage.id}`, phase: 'Landing Page', name: stage.name,
              daysPrior: cumulative, role: 'Landing Page', timing: 'pre',
            });
          });
        }

        const postLaunch = [];
        if (includeDashboard && !preset.excludedPhases.includes('Post-Launch')) {
          const leadDays = Math.max(0, Math.min(4, dashboardLeadDays));
          postLaunch.push({ id: 'dashboard-draft', timing: 'post' });
          postLaunch.push({ id: 'day-1-check', timing: 'post' });
          postLaunch.push({ id: 'week-1-optimize', timing: 'post' });
        }

        const all = [...filtered, ...custom, ...internalTasks, ...landingPageTasks, ...postLaunch];
        const active = all.filter((t) => !skippedTasks[t.id]);
        const completed = active.filter((t) => completedTasks[t.id]).length;
        const total = active.length;
        const pct = total === 0 ? 0 : Math.round((completed / total) * 100);
        return { completed, total, pct };
      } catch (e) {
        console.warn('Progress calc failed:', e);
        return { completed: 0, total: 0, pct: 0 };
      }
    }

    // ============================================================
    // AUTH GATE
    // ============================================================
    function AuthGate({ children }) {
      const [session, setSession] = useState(null);
      const [loading, setLoading] = useState(true);
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [signingIn, setSigningIn] = useState(false);
      const [error, setError] = useState('');

      useEffect(() => {
        let mounted = true;
        sb.auth.getSession().then(({ data }) => {
          if (!mounted) return;
          setSession(data.session || null);
          setLoading(false);
        }).catch(() => {
          if (!mounted) return;
          setLoading(false);
        });
        const { data: sub } = sb.auth.onAuthStateChange((_event, newSession) => {
          setSession(newSession || null);
        });
        return () => {
          mounted = false;
          if (sub && sub.subscription) sub.subscription.unsubscribe();
        };
      }, []);

      const handleSignIn = async (e) => {
        e.preventDefault();
        setError('');
        setSigningIn(true);
        try {
          const { error } = await sb.auth.signInWithPassword({ email, password });
          if (error) setError(error.message || 'Sign-in failed');
        } catch (err) {
          setError(err.message || 'Sign-in failed');
        } finally {
          setSigningIn(false);
        }
      };

      const handleSignOut = async () => {
        await sb.auth.signOut();
        setSession(null);
      };

      if (loading) {
        return (
          <div className="min-h-screen flex items-center justify-center bg-stone-950 text-stone-400">
            <Loader2 className="w-6 h-6 animate-spin mr-2" /> Loading…
          </div>
        );
      }

      if (!session) {
        return (
          <div className="min-h-screen flex items-center justify-center bg-stone-950 p-4">
            <div className="w-full max-w-sm bg-stone-900 border border-stone-800 rounded-sm p-8 shadow-2xl">
              <div className="flex items-center gap-2 mb-6">
                <div className="w-10 h-10 bg-amber-400 rounded-sm flex items-center justify-center">
                  <Zap className="w-5 h-5 text-stone-950" fill="currentColor" strokeWidth={0} />
                </div>
                <div>
                  <div className="text-[10px] uppercase tracking-[0.3em] font-bold text-amber-400">The James Agency</div>
                  <h1 className="text-lg font-black text-amber-50 uppercase tracking-tight">Campaign Launch</h1>
                </div>
              </div>
              <form onSubmit={handleSignIn} className="space-y-3">
                <div>
                  <label className="block text-[11px] font-bold uppercase tracking-wider text-stone-400 mb-1">Email</label>
                  <input type="email" required value={email} onChange={(e) => setEmail(e.target.value)} className="w-full px-3 py-2 bg-stone-800 border border-stone-700 rounded-sm text-sm text-stone-100 focus:outline-none focus:ring-2 focus:ring-amber-400" autoFocus />
                </div>
                <div>
                  <label className="block text-[11px] font-bold uppercase tracking-wider text-stone-400 mb-1">Password</label>
                  <input type="password" required value={password} onChange={(e) => setPassword(e.target.value)} className="w-full px-3 py-2 bg-stone-800 border border-stone-700 rounded-sm text-sm text-stone-100 focus:outline-none focus:ring-2 focus:ring-amber-400" />
                </div>
                {error && (
                  <div className="flex items-start gap-2 p-2.5 bg-red-950/40 border border-red-800/50 rounded-sm text-xs text-red-300">
                    <AlertCircle className="w-4 h-4 flex-shrink-0 mt-0.5" />
                    <span>{error}</span>
                  </div>
                )}
                <button type="submit" disabled={signingIn} className="w-full flex items-center justify-center gap-2 px-3 py-2.5 bg-amber-400 text-stone-950 rounded-sm text-xs font-bold uppercase tracking-wider hover:bg-amber-300 disabled:opacity-50">
                  {signingIn ? <><Loader2 className="w-4 h-4 animate-spin" /> Signing in…</> : <><LogIn className="w-4 h-4" /> Sign in</>}
                </button>
              </form>
            </div>
          </div>
        );
      }

      return children({ session, onSignOut: handleSignOut });
    }

    // ============================================================
    // DASHBOARD
    // ============================================================
    // The Dashboard supports two "kinds" of items, both stored in the
    // same `campaigns` table with a `data.kind` discriminator:
    //   - 'campaign' (default — full blueprint + toolkit)
    //   - 'toolkit'  (standalone — just the creative-team Toolkit)
    // The toggle lives in React state on Dashboard. Selection is also
    // forwarded up via onKindChange so the parent can remember which
    // tab a user came from when they open a detail view.
    function Dashboard({ campaigns, reportingItems, setReportingItems, loading, error, kind, onKindChange, onOpen, onNew, onArchive, onUnarchive, onDuplicate, onDelete, onRefresh }) {
      const [statusFilter, setStatusFilter] = useState('active');
      const [clientFilter, setClientFilter] = useState('all');
      const [sortBy, setSortBy] = useState('launch');
      const [view, setView] = useState('list');
      const [confirmDelete, setConfirmDelete] = useState(null);

      const isToolkitItem = (c) => !!(c && c.data && c.data.kind === 'toolkit');
      const isCampaignItem = (c) => !isToolkitItem(c);

      const allClients = useMemo(() => {
        const set = new Set();
        campaigns.forEach((c) => { if (c.client && c.client.trim()) set.add(c.client.trim()); });
        return Array.from(set).sort();
      }, [campaigns]);

      // Counts for the kind toggle pills (respect status filter so the
      // numbers reflect what would actually be visible if that pill were
      // clicked — minus the kind filter itself).
      const campaignCount = useMemo(() => campaigns.filter(isCampaignItem).length, [campaigns]);
      const toolkitCount  = useMemo(() => campaigns.filter(isToolkitItem).length,  [campaigns]);

      const filtered = useMemo(() => {
        let list = campaigns.filter((c) => {
          // Kind filter (campaign vs toolkit)
          if (kind === 'toolkit' && !isToolkitItem(c)) return false;
          if (kind === 'campaign' && isToolkitItem(c)) return false;
          if (statusFilter === 'active' && c.status === 'archived') return false;
          if (statusFilter === 'archived' && c.status !== 'archived') return false;
          if (clientFilter !== 'all' && (c.client || '').trim() !== clientFilter) return false;
          return true;
        });
        if (sortBy === 'launch') {
          list = list.slice().sort((a, b) => {
            const da = a.launch_date || '9999-12-31';
            const db = b.launch_date || '9999-12-31';
            return da.localeCompare(db);
          });
        } else if (sortBy === 'updated') {
          list = list.slice().sort((a, b) => (b.updated_at || '').localeCompare(a.updated_at || ''));
        } else if (sortBy === 'name') {
          list = list.slice().sort((a, b) => (a.name || '').localeCompare(b.name || ''));
        }
        return list;
      }, [campaigns, kind, statusFilter, clientFilter, sortBy]);

      const newButtonLabel = kind === 'toolkit' ? 'New Toolkit' : 'New Campaign';
      const emptyTitle     = kind === 'toolkit' ? 'No toolkits yet' : 'No campaigns yet';

      return (
        <div className="max-w-7xl mx-auto p-4 md:p-6">
          {/* Header */}
          <div className="flex items-center justify-between flex-wrap gap-3 mb-6">
            <div className="flex items-center gap-3">
              <div className="w-11 h-11 bg-amber-400 rounded-sm flex items-center justify-center shadow-lg shadow-orange-500/20">
                <Zap className="w-6 h-6 text-stone-950" fill="currentColor" strokeWidth={0} />
              </div>
              <div>
                <div className="text-[10px] uppercase tracking-[0.3em] font-bold text-amber-400">The James Agency</div>
                <h1 className="text-2xl font-black text-amber-50 tracking-tight uppercase">Campaign Launch Dashboard</h1>
              </div>
            </div>
            <div className="flex items-center gap-2">
              <div className="flex gap-0.5 bg-stone-900 border border-stone-800 rounded-sm p-0.5">
                <button onClick={() => setView('list')} className={`flex items-center gap-1.5 px-2.5 py-1.5 text-xs uppercase tracking-wider font-bold rounded-sm transition-colors ${view === 'list' ? 'bg-amber-400 text-stone-950' : 'text-stone-400 hover:text-stone-200'}`}>
                  <LayoutGrid className="w-3.5 h-3.5" /> List
                </button>
                <button onClick={() => setView('calendar')} className={`flex items-center gap-1.5 px-2.5 py-1.5 text-xs uppercase tracking-wider font-bold rounded-sm transition-colors ${view === 'calendar' ? 'bg-amber-400 text-stone-950' : 'text-stone-400 hover:text-stone-200'}`}>
                  <CalendarDays className="w-3.5 h-3.5" /> Calendar
                </button>
              </div>
              {kind !== 'reporting' && (
                <button onClick={() => onNew(kind)} className={`flex items-center gap-1.5 px-3 py-2 rounded-sm text-xs font-bold uppercase tracking-wider transition-colors ${kind === 'toolkit' ? 'bg-orange-500 text-stone-950 hover:bg-orange-400' : 'bg-amber-400 text-stone-950 hover:bg-amber-300'}`}>
                  <Plus className="w-4 h-4" /> {newButtonLabel}
                </button>
              )}
            </div>
          </div>

          {/* Kind toggle (Campaigns / Toolkits / Reporting) */}
          {view === 'list' && (
            <div className="mb-3 flex items-center gap-1 bg-stone-900 border border-stone-800 rounded-sm p-1 w-fit">
              <button
                onClick={() => onKindChange('campaign')}
                className={`flex items-center gap-2 px-3 py-1.5 rounded-sm text-xs font-bold uppercase tracking-wider transition-colors ${kind === 'campaign' ? 'bg-amber-400 text-stone-950' : 'text-stone-400 hover:text-stone-200'}`}
              >
                Campaigns
                <span className={`text-[10px] font-black px-1.5 py-0.5 rounded-sm ${kind === 'campaign' ? 'bg-stone-950/20 text-stone-950' : 'bg-stone-800 text-stone-400'}`}>{campaignCount}</span>
              </button>
              <button
                onClick={() => onKindChange('toolkit')}
                className={`flex items-center gap-2 px-3 py-1.5 rounded-sm text-xs font-bold uppercase tracking-wider transition-colors ${kind === 'toolkit' ? 'bg-orange-500 text-stone-950' : 'text-stone-400 hover:text-stone-200'}`}
              >
                Toolkits
                <span className={`text-[10px] font-black px-1.5 py-0.5 rounded-sm ${kind === 'toolkit' ? 'bg-stone-950/20 text-stone-950' : 'bg-stone-800 text-stone-400'}`}>{toolkitCount}</span>
              </button>
              <button
                onClick={() => onKindChange('reporting')}
                className={`flex items-center gap-2 px-3 py-1.5 rounded-sm text-xs font-bold uppercase tracking-wider transition-colors ${kind === 'reporting' ? 'bg-pink-500 text-stone-950' : 'text-stone-400 hover:text-stone-200'}`}
              >
                Reporting
                <span className={`text-[10px] font-black px-1.5 py-0.5 rounded-sm ${kind === 'reporting' ? 'bg-stone-950/20 text-stone-950' : 'bg-stone-800 text-stone-400'}`}>{(reportingItems || []).length}</span>
              </button>
            </div>
          )}

          {/* Filter strip — campaigns/toolkits only; reporting has its own controls */}
          {view === 'list' && kind !== 'reporting' && (
            <div className="flex items-center gap-2 flex-wrap mb-4 bg-stone-900 border border-stone-800 rounded-sm p-3">
              <div className="flex items-center gap-1.5">
                <span className="text-[10px] font-bold uppercase tracking-wider text-stone-500">Status:</span>
                <div className="flex gap-0.5 bg-stone-800 rounded-sm p-0.5">
                  {['active', 'archived', 'all'].map((s) => (
                    <button key={s} onClick={() => setStatusFilter(s)} className={`px-2.5 py-1 text-xs uppercase tracking-wider font-bold rounded-sm transition-colors ${statusFilter === s ? 'bg-amber-400 text-stone-950' : 'text-stone-400 hover:text-stone-200'}`}>
                      {s === 'all' ? 'All' : s === 'active' ? 'Active' : 'Archived'}
                    </button>
                  ))}
                </div>
              </div>
              <div className="flex items-center gap-1.5">
                <span className="text-[10px] font-bold uppercase tracking-wider text-stone-500">Client:</span>
                <select value={clientFilter} onChange={(e) => setClientFilter(e.target.value)} className="px-2 py-1 bg-stone-800 border border-stone-700 rounded-sm text-xs text-stone-100 focus:outline-none focus:ring-1 focus:ring-amber-400">
                  <option value="all">All clients</option>
                  {allClients.map((c) => <option key={c} value={c}>{c}</option>)}
                </select>
              </div>
              <div className="flex items-center gap-1.5 ml-auto">
                <span className="text-[10px] font-bold uppercase tracking-wider text-stone-500">Sort:</span>
                <select value={sortBy} onChange={(e) => setSortBy(e.target.value)} className="px-2 py-1 bg-stone-800 border border-stone-700 rounded-sm text-xs text-stone-100 focus:outline-none focus:ring-1 focus:ring-amber-400">
                  <option value="launch">Launch date (soonest)</option>
                  <option value="updated">Recently updated</option>
                  <option value="name">Name A–Z</option>
                </select>
              </div>
            </div>
          )}

          {/* Error */}
          {error && (
            <div className="flex items-start gap-2 p-3 mb-4 bg-red-950/40 border border-red-800/50 rounded-sm text-sm text-red-300">
              <AlertCircle className="w-4 h-4 flex-shrink-0 mt-0.5" />
              <div className="flex-1">
                <div className="font-bold">Couldn't load campaigns</div>
                <div className="text-xs mt-0.5">{error}</div>
              </div>
              <button onClick={onRefresh} className="px-2 py-1 bg-red-900/50 text-red-200 rounded-sm text-xs font-bold uppercase tracking-wider hover:bg-red-900">Retry</button>
            </div>
          )}

          {/* Content */}
          {loading ? (
            <div className="flex items-center justify-center py-16 text-stone-400">
              <Loader2 className="w-5 h-5 animate-spin mr-2" /> Loading campaigns…
            </div>
          ) : view === 'calendar' ? (
            <CalendarView campaigns={campaigns.filter((c) => c.status !== 'archived')} reportingItems={reportingItems} onOpen={onOpen} />
          ) : kind === 'reporting' ? (
            <ReportingView items={reportingItems} setItems={setReportingItems} />
          ) : campaigns.length === 0 ? (
            <div className="bg-stone-900 rounded-sm border-2 border-dashed border-stone-700 p-16 text-center">
              <Zap className="w-12 h-12 text-orange-500 mx-auto mb-3" fill="currentColor" strokeWidth={0} />
              <h3 className="text-amber-50 font-black uppercase tracking-wider mb-1">{emptyTitle}</h3>
              <p className="text-sm text-stone-400 mb-4">Create your first one to get started.</p>
              <button onClick={() => onNew(kind)} className={`inline-flex items-center gap-1.5 px-3 py-2 rounded-sm text-xs font-bold uppercase tracking-wider transition-colors ${kind === 'toolkit' ? 'bg-orange-500 text-stone-950 hover:bg-orange-400' : 'bg-amber-400 text-stone-950 hover:bg-amber-300'}`}>
                <Plus className="w-4 h-4" /> {newButtonLabel}
              </button>
            </div>
          ) : (
            filtered.length === 0 ? (
              <div className="bg-stone-900 rounded-sm border border-stone-800 p-8 text-center text-sm text-stone-400">
                {kind === 'toolkit' ? 'No toolkits match these filters.' : 'No campaigns match these filters.'}
              </div>
            ) : (
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                {filtered.map((c) => (
                  <CampaignCard
                    key={c.id}
                    campaign={c}
                    onOpen={() => onOpen(c)}
                    onDuplicate={() => onDuplicate(c)}
                    onArchive={() => c.status === 'archived' ? onUnarchive(c) : onArchive(c)}
                    onDelete={() => setConfirmDelete(c)}
                  />
                ))}
              </div>
            )
          )}

          {/* Delete confirm */}
          {confirmDelete && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-stone-900 border border-stone-700 rounded-sm max-w-sm w-full p-6 shadow-2xl">
                <div className="flex items-center gap-2 mb-3">
                  <AlertTriangle className="w-5 h-5 text-red-400" />
                  <h3 className="font-black text-amber-50 text-sm uppercase tracking-[0.2em]">Delete {isToolkitItem(confirmDelete) ? 'toolkit' : 'campaign'}?</h3>
                </div>
                <p className="text-xs text-stone-400 mb-4">
                  <span className="font-bold text-stone-200">{confirmDelete.name}</span> will be permanently deleted. This cannot be undone.
                </p>
                <div className="flex gap-2">
                  <button
                    onClick={() => { onDelete(confirmDelete); setConfirmDelete(null); }}
                    className="flex-1 px-3 py-2 bg-red-500 text-stone-50 rounded-sm text-xs font-bold uppercase tracking-wider hover:bg-red-400"
                  >Delete</button>
                  <button onClick={() => setConfirmDelete(null)} className="px-3 py-2 bg-stone-800 text-stone-200 rounded-sm text-xs font-bold uppercase tracking-wider hover:bg-stone-700">Cancel</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ============================================================
    // CAMPAIGN CARD
    // Renders both standard campaigns and standalone toolkits.
    // For toolkits we hide the blueprint progress bar (toolkits don't
    // have tasks) and show a "Toolkit" badge + a placement count instead.
    // ============================================================
    function CampaignCard({ campaign, onOpen, onDuplicate, onArchive, onDelete }) {
      const isToolkit = !!(campaign.data && campaign.data.kind === 'toolkit');
      const progress = useMemo(() => isToolkit ? { completed: 0, total: 0, pct: 0 } : calculateProgress(campaign), [campaign, isToolkit]);
      const isArchived = campaign.status === 'archived';
      const launch = campaign.launch_date ? parseDateSafe(campaign.launch_date) : null;
      const today = startOfDay(new Date());
      const daysUntil = launch ? daysBetween(today, startOfDay(launch)) : null;
      const placementCount = isToolkit
        ? ((campaign.data && campaign.data.toolkit && Array.isArray(campaign.data.toolkit.placements))
            ? campaign.data.toolkit.placements.length
            : 0)
        : 0;

      let dateColor = 'text-stone-300';
      let dateLabel = '';
      if (daysUntil !== null) {
        if (daysUntil < 0) { dateColor = 'text-stone-500'; dateLabel = `${Math.abs(daysUntil)}d ago`; }
        else if (daysUntil === 0) { dateColor = 'text-red-400'; dateLabel = 'Today'; }
        else if (daysUntil <= 7) { dateColor = 'text-red-400'; dateLabel = `${daysUntil}d`; }
        else if (daysUntil <= 21) { dateColor = 'text-orange-400'; dateLabel = `${daysUntil}d`; }
        else { dateColor = 'text-stone-300'; dateLabel = `${daysUntil}d`; }
      }

      const handleCardClick = (e) => {
        if (e.target.closest('button')) return;
        onOpen();
      };

      return (
        <div onClick={handleCardClick} className={`bg-stone-900 border rounded-sm p-4 cursor-pointer transition-all hover:shadow-lg ${isToolkit ? 'hover:border-orange-400/40 hover:shadow-orange-400/5' : 'hover:border-amber-400/40 hover:shadow-amber-400/5'} ${isArchived ? 'border-stone-800 opacity-60' : 'border-stone-800'}`}>
          <div className="flex items-start justify-between gap-2 mb-2">
            <div className="min-w-0 flex-1">
              <div className="flex items-center gap-1.5 flex-wrap">
                <div className="font-black text-amber-50 text-base truncate">{campaign.name || (isToolkit ? 'Untitled toolkit' : 'Untitled campaign')}</div>
                {isToolkit && (
                  <span className="text-[9px] font-black uppercase tracking-widest px-1.5 py-0.5 rounded-sm bg-orange-500/15 text-orange-300 border border-orange-500/40">
                    Toolkit
                  </span>
                )}
              </div>
              {campaign.client && <div className="text-xs text-stone-400 truncate">{campaign.client}</div>}
            </div>
            <span className={`text-[9px] font-black uppercase tracking-widest px-1.5 py-0.5 rounded-sm flex-shrink-0 ${isArchived ? 'bg-stone-800 text-stone-400' : 'bg-emerald-950/50 text-emerald-300 border border-emerald-800/40'}`}>
              {isArchived ? 'Archived' : 'Active'}
            </span>
          </div>

          <div className="flex items-center gap-2 mb-3">
            <Calendar className="w-3.5 h-3.5 text-stone-500" />
            {launch ? (
              <>
                <span className="text-xs text-stone-300">{fmtDateShort(launch)}</span>
                {dateLabel && <span className={`text-[10px] font-bold uppercase tracking-wider ${dateColor}`}>{dateLabel}</span>}
              </>
            ) : (
              <span className="text-xs text-stone-500 italic">No launch date</span>
            )}
          </div>

          {isToolkit ? (
            <div className="mb-3 space-y-1.5">
              <div className="flex items-center justify-between">
                <span className="text-[10px] font-bold uppercase tracking-widest text-stone-500">Placements</span>
                <span className="text-xs font-bold text-orange-300">{placementCount} {placementCount === 1 ? 'placement' : 'placements'}</span>
              </div>
              {(() => {
                const h = computeToolkitHandoff(campaign);
                const tone = HANDOFF_TONES[h.tone];
                return (
                  <div className={`flex items-center justify-between gap-2 px-2 py-1 rounded-sm border ${tone.bg} ${tone.border}`}>
                    <span className="flex items-center gap-1.5 text-[10px] font-bold uppercase tracking-widest text-stone-500">
                      <Clock className={`w-3 h-3 ${tone.text}`} /> To Paid Media
                    </span>
                    <span className={`text-[10px] font-bold ${tone.text}`}>
                      {h.label}{h.handoff ? ` · ${fmtDateShort(h.handoff)}` : ''}
                    </span>
                  </div>
                );
              })()}
            </div>
          ) : (
            <div className="mb-3">
              <div className="flex items-center justify-between mb-1">
                <span className="text-[10px] font-bold uppercase tracking-widest text-stone-500">Progress</span>
                <span className="text-[10px] font-bold text-stone-300">{progress.pct}%{progress.total > 0 && ` (${progress.completed}/${progress.total})`}</span>
              </div>
              <div className="h-1.5 bg-stone-800 rounded-sm overflow-hidden">
                <div className="h-full bg-gradient-to-r from-orange-500 to-amber-400 transition-all" style={{ width: `${progress.pct}%` }}></div>
              </div>
            </div>
          )}

          <div className="flex items-center gap-1 pt-2 border-t border-stone-800">
            <button onClick={onOpen} className="flex-1 px-2 py-1.5 bg-stone-800 hover:bg-stone-700 text-stone-200 rounded-sm text-[10px] font-bold uppercase tracking-wider transition-colors">Open</button>
            <button onClick={onDuplicate} title="Duplicate" className="p-1.5 bg-stone-800 hover:bg-stone-700 text-stone-300 rounded-sm transition-colors">
              <Copy className="w-3.5 h-3.5" />
            </button>
            <button onClick={onArchive} title={isArchived ? 'Unarchive' : 'Archive'} className="p-1.5 bg-stone-800 hover:bg-stone-700 text-stone-300 rounded-sm transition-colors">
              {isArchived ? <ArchiveRestore className="w-3.5 h-3.5" /> : <Archive className="w-3.5 h-3.5" />}
            </button>
            <button onClick={onDelete} title="Delete" className="p-1.5 bg-stone-800 hover:bg-red-900/50 text-stone-300 hover:text-red-400 rounded-sm transition-colors">
              <Trash2 className="w-3.5 h-3.5" />
            </button>
          </div>
        </div>
      );
    }

    // ============================================================
    // CALENDAR VIEW (rebuilt — multi-task, role-colored, filterable)
    // Shows every task across every active campaign on the day it's due.
    // Dots are colored by task role; launch days render as a flag icon.
    // Filters live in React state (no localStorage) so they persist for
    // the session but reset between page loads.
    // ============================================================
    function CalendarView({ campaigns, reportingItems, onOpen }) {
      const [cursor, setCursor] = useState(() => {
        const d = new Date(); d.setDate(1); d.setHours(0, 0, 0, 0); return d;
      });
      const [activeRoles, setActiveRoles] = useState(() => {
        const s = {}; ROLE_KEYS.forEach((k) => { s[k] = true; }); return s;
      });
      const [activeCampaignIds, setActiveCampaignIds] = useState(() => {
        const s = {}; campaigns.forEach((c) => { s[c.id] = true; }); return s;
      });
      const [hideCompleted, setHideCompleted] = useState(false);
      const [campaignPickerOpen, setCampaignPickerOpen] = useState(false);
      const [selectedDay, setSelectedDay] = useState(null); // { dateKey, anchor }

      // Keep activeCampaignIds in sync when campaigns list changes
      useEffect(() => {
        setActiveCampaignIds((prev) => {
          const next = { ...prev };
          let changed = false;
          campaigns.forEach((c) => {
            if (!(c.id in next)) { next[c.id] = true; changed = true; }
          });
          // remove ids that no longer exist
          Object.keys(next).forEach((id) => {
            if (!campaigns.find((c) => c.id === id)) { delete next[id]; changed = true; }
          });
          return changed ? next : prev;
        });
      }, [campaigns]);

      const year = cursor.getFullYear();
      const month = cursor.getMonth();
      const monthLabel = cursor.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

      const firstDay = new Date(year, month, 1);
      const lastDay = new Date(year, month + 1, 0);
      const daysInMonth = lastDay.getDate();
      const startWeekday = firstDay.getDay();

      const cells = [];
      for (let i = 0; i < startWeekday; i++) cells.push(null);
      for (let d = 1; d <= daysInMonth; d++) cells.push(d);
      while (cells.length % 7 !== 0) cells.push(null);

      // Compute all events from all (active, launch_date set) campaigns once.
      const allEvents = useMemo(() => {
        return [
          ...buildCalendarEvents(campaigns),
          ...buildReportingEvents(reportingItems),
        ];
      }, [campaigns, reportingItems]);

      // Filter events by the user's filter state.
      const filteredEvents = useMemo(() => {
        return allEvents.filter((ev) => {
          // Reporting events aren't tied to a campaign id, so they bypass
          // the per-campaign toggle. They still respect the role filter
          // (toggle "Reporting" off in the role chip row to hide them).
          if (!ev.isReporting && !activeCampaignIds[ev.campaignId]) return false;
          if (!ev.isLaunchDate) {
            if (!activeRoles[ev.role]) return false;
            if (hideCompleted && ev.completed) return false;
          }
          return true;
        });
      }, [allEvents, activeCampaignIds, activeRoles, hideCompleted]);

      // Bucket events by ISO date key.
      const eventsByDate = useMemo(() => {
        const map = {};
        filteredEvents.forEach((ev) => {
          const key = fmtDateIso(ev.date);
          if (!map[key]) map[key] = [];
          map[key].push(ev);
        });
        // Stable sort: launches first, then completed last, then by name
        Object.keys(map).forEach((k) => {
          map[k].sort((a, b) => {
            if (a.isLaunchDate !== b.isLaunchDate) return a.isLaunchDate ? -1 : 1;
            if (!!a.completed !== !!b.completed) return a.completed ? 1 : -1;
            return a.taskName.localeCompare(b.taskName);
          });
        });
        return map;
      }, [filteredEvents]);

      const prevMonth = () => setCursor(new Date(year, month - 1, 1));
      const nextMonth = () => setCursor(new Date(year, month + 1, 1));
      const goToday = () => { const d = new Date(); d.setDate(1); d.setHours(0, 0, 0, 0); setCursor(d); };

      const todayKey = fmtDateIso(new Date());

      const toggleRole = (k) => setActiveRoles((p) => ({ ...p, [k]: !p[k] }));
      const toggleCampaign = (id) => setActiveCampaignIds((p) => ({ ...p, [id]: !p[id] }));
      const allCampaignsOn = campaigns.length > 0 && campaigns.every((c) => activeCampaignIds[c.id]);
      const activeCampaignCount = campaigns.filter((c) => activeCampaignIds[c.id]).length;

      const setAllCampaigns = (val) => {
        const s = {}; campaigns.forEach((c) => { s[c.id] = val; });
        setActiveCampaignIds(s);
      };

      const openDay = (dateKey, anchorEl) => {
        const rect = anchorEl ? anchorEl.getBoundingClientRect() : null;
        setSelectedDay({ dateKey, rect });
      };

      const closePopover = () => setSelectedDay(null);

      const dayEvents = selectedDay ? (eventsByDate[selectedDay.dateKey] || []) : [];
      const selectedDate = selectedDay ? parseDateSafe(selectedDay.dateKey) : null;

      return (
        <div className="bg-stone-900 border border-stone-800 rounded-sm p-4">
          {/* Filter strip */}
          <div className="flex flex-wrap items-center gap-2 mb-4 pb-4 border-b border-stone-800">
            {/* Role filters */}
            <div className="flex items-center gap-1.5 flex-wrap">
              <span className="text-[10px] font-bold uppercase tracking-wider text-stone-500 mr-1">Roles:</span>
              {ROLE_KEYS.map((k) => {
                const cfg = ROLES[k];
                const on = !!activeRoles[k];
                return (
                  <button
                    key={k}
                    onClick={() => toggleRole(k)}
                    className={`inline-flex items-center gap-1.5 px-2 py-1 rounded-sm text-[10px] font-bold uppercase tracking-wider border transition-all ${on ? 'border-stone-600 bg-stone-800' : 'border-stone-800 bg-stone-900 opacity-50'}`}
                    title={on ? `Hide ${cfg.label}` : `Show ${cfg.label}`}
                  >
                    <span className="w-2.5 h-2.5 rounded-full" style={{ backgroundColor: cfg.color }}></span>
                    <span style={{ color: on ? cfg.color : '#78716c' }}>{cfg.label}</span>
                  </button>
                );
              })}
            </div>

            {/* Campaign picker */}
            <div className="relative">
              <button
                onClick={() => setCampaignPickerOpen((v) => !v)}
                className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-sm text-[10px] font-bold uppercase tracking-wider bg-stone-800 hover:bg-stone-700 border border-stone-700 text-stone-200"
              >
                <Filter className="w-3 h-3" />
                {allCampaignsOn ? `All campaigns (${campaigns.length})` : `${activeCampaignCount} of ${campaigns.length} campaigns`}
                <ChevronDown className="w-3 h-3" />
              </button>
              {campaignPickerOpen && (
                <>
                  <div className="fixed inset-0 z-30" onClick={() => setCampaignPickerOpen(false)} />
                  <div className="absolute top-full left-0 mt-1 z-40 bg-stone-900 border border-stone-700 rounded-sm shadow-xl py-1 min-w-[260px] max-h-72 overflow-y-auto">
                    <div className="px-3 py-1.5 flex items-center gap-2 border-b border-stone-800">
                      <button onClick={() => setAllCampaigns(true)} className="text-[10px] font-bold uppercase tracking-wider text-amber-300 hover:text-amber-200">Select all</button>
                      <span className="text-stone-700">·</span>
                      <button onClick={() => setAllCampaigns(false)} className="text-[10px] font-bold uppercase tracking-wider text-stone-400 hover:text-stone-200">Clear</button>
                    </div>
                    {campaigns.length === 0 ? (
                      <div className="px-3 py-3 text-xs text-stone-500 italic">No campaigns yet.</div>
                    ) : (() => {
                      const camps = campaigns.filter((c) => !(c.data && c.data.kind === 'toolkit'));
                      const tks = campaigns.filter((c) => c.data && c.data.kind === 'toolkit');
                      const sections = [];
                      if (camps.length > 0) {
                        sections.push(
                          <div key="hdr-c" className="px-3 pt-1.5 pb-1 text-[9px] font-black uppercase tracking-[0.2em] text-amber-400 border-b border-stone-800/60">Campaigns</div>
                        );
                        camps.forEach((c) => sections.push(
                          <label key={c.id} className="flex items-center gap-2 px-3 py-1.5 cursor-pointer hover:bg-stone-800">
                            <input type="checkbox" checked={!!activeCampaignIds[c.id]} onChange={() => toggleCampaign(c.id)} className="w-3.5 h-3.5 accent-amber-400" />
                            <div className="min-w-0 flex-1">
                              <div className="text-xs text-stone-100 truncate">{c.name || 'Untitled campaign'}</div>
                              {c.client && <div className="text-[10px] text-stone-500 truncate">{c.client}</div>}
                            </div>
                          </label>
                        ));
                      }
                      if (tks.length > 0) {
                        sections.push(
                          <div key="hdr-t" className="px-3 pt-1.5 pb-1 text-[9px] font-black uppercase tracking-[0.2em] text-orange-400 border-b border-stone-800/60 mt-1">Toolkits</div>
                        );
                        tks.forEach((c) => sections.push(
                          <label key={c.id} className="flex items-center gap-2 px-3 py-1.5 cursor-pointer hover:bg-stone-800">
                            <input type="checkbox" checked={!!activeCampaignIds[c.id]} onChange={() => toggleCampaign(c.id)} className="w-3.5 h-3.5 accent-amber-400" />
                            <div className="min-w-0 flex-1">
                              <div className="text-xs text-stone-100 truncate flex items-center gap-1.5">
                                {c.name || 'Untitled toolkit'}
                                <span className="text-[8px] font-black uppercase tracking-widest text-orange-400 bg-orange-500/15 border border-orange-500/40 px-1 py-px rounded-sm">TK</span>
                              </div>
                              {c.client && <div className="text-[10px] text-stone-500 truncate">{c.client}</div>}
                            </div>
                          </label>
                        ));
                      }
                      return sections;
                    })()}
                  </div>
                </>
              )}
            </div>

            {/* Hide completed */}
            <label className="inline-flex items-center gap-1.5 px-2 py-1 rounded-sm text-[10px] font-bold uppercase tracking-wider bg-stone-800 hover:bg-stone-700 border border-stone-700 text-stone-200 cursor-pointer">
              <input type="checkbox" checked={hideCompleted} onChange={(e) => setHideCompleted(e.target.checked)} className="w-3 h-3 accent-amber-400" />
              Hide completed
            </label>

            {/* Today + nav */}
            <div className="flex items-center gap-1 ml-auto">
              <button onClick={goToday} className="px-2.5 py-1 text-[10px] uppercase tracking-wider font-bold text-stone-300 hover:text-amber-50 bg-stone-800 hover:bg-stone-700 rounded-sm">Today</button>
              <button onClick={prevMonth} className="p-1.5 bg-stone-800 hover:bg-stone-700 text-stone-300 rounded-sm"><ChevronLeft className="w-4 h-4" /></button>
              <div className="px-2 text-xs font-bold uppercase tracking-wider text-amber-50 min-w-[140px] text-center">{monthLabel}</div>
              <button onClick={nextMonth} className="p-1.5 bg-stone-800 hover:bg-stone-700 text-stone-300 rounded-sm"><ChevronRight className="w-4 h-4" /></button>
            </div>
          </div>

          {/* Calendar grid */}
          <div className="grid grid-cols-7 gap-1 mb-1">
            {['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map((w) => (
              <div key={w} className="text-[10px] font-bold uppercase tracking-widest text-stone-500 text-center py-1">{w}</div>
            ))}
          </div>
          <div className="grid grid-cols-7 gap-1">
            {cells.map((d, idx) => {
              if (d === null) return <div key={idx} className="min-h-[96px] bg-stone-950/40 rounded-sm border border-stone-900" />;
              const dateKey = fmtDateIso(new Date(year, month, d));
              const items = eventsByDate[dateKey] || [];
              const launchItems = items.filter((e) => e.isLaunchDate);
              const taskItems = items.filter((e) => !e.isLaunchDate);
              const isToday = dateKey === todayKey;
              const hasEvents = items.length > 0;
              const dotsToShow = taskItems.slice(0, 6);
              const remaining = taskItems.length - dotsToShow.length;
              return (
                <button
                  key={idx}
                  onClick={(e) => hasEvents && openDay(dateKey, e.currentTarget)}
                  className={`relative text-left min-h-[96px] rounded-sm border p-1.5 flex flex-col gap-1 transition-all ${
                    isToday
                      ? 'bg-stone-900 border-white/40'
                      : hasEvents
                        ? 'bg-stone-950 border-stone-800 hover:border-stone-600 cursor-pointer'
                        : 'bg-stone-950 border-stone-900'
                  } ${hasEvents ? '' : 'cursor-default'}`}
                  disabled={!hasEvents}
                >
                  <div className="flex items-start justify-between gap-1">
                    <span className={`text-[11px] font-bold ${isToday ? 'text-white' : hasEvents ? 'text-stone-300' : 'text-stone-600'}`}>{d}</span>
                    {launchItems.length > 0 && (
                      <Flag
                        className="w-3.5 h-3.5"
                        style={{ color: ROLES['Paid Media'].color, fill: ROLES['Paid Media'].color }}
                        strokeWidth={1.5}
                      />
                    )}
                  </div>
                  {dotsToShow.length > 0 && (
                    <div className="flex flex-wrap gap-1 mt-0.5">
                      {dotsToShow.map((ev, i) => {
                        const cfg = ROLES[ev.role] || ROLES[DEFAULT_ROLE];
                        return (
                          <span
                            key={ev.taskId + ':' + ev.campaignId + ':' + i}
                            className={`block w-2 h-2 rounded-full ${ev.completed ? 'opacity-40 ring-1 ring-stone-700' : ''}`}
                            style={{ backgroundColor: cfg.color }}
                            title={`${ev.taskName} — ${ev.campaignName}`}
                          ></span>
                        );
                      })}
                      {remaining > 0 && (
                        <span className="text-[9px] font-bold text-stone-400 leading-none px-1 py-0.5 bg-stone-800 rounded-sm">+{remaining}</span>
                      )}
                    </div>
                  )}
                </button>
              );
            })}
          </div>

          {campaigns.length === 0 && (
            <div className="mt-4 text-center text-xs text-stone-500 italic py-6">No active campaigns to display.</div>
          )}

          {/* Day popover */}
          {selectedDay && selectedDate && (
            <CalendarDayPopover
              date={selectedDate}
              events={dayEvents}
              anchorRect={selectedDay.rect}
              onClose={closePopover}
              onOpenCampaign={(id) => {
                const c = campaigns.find((x) => x.id === id);
                if (c) { closePopover(); onOpen(c); }
              }}
            />
          )}
        </div>
      );
    }

    // ============================================================
    // REPORTING VIEW
    // Monthly client reporting tracker — captures the workflow from
    // "Pathlabs delivers data to TJA" through "Report due to client".
    // Stored in localStorage (`tja_reporting_items`) so it works without
    // extra DB schema. Each row is a Client × Department × Month combo.
    // ============================================================
    const REPORTING_DEPARTMENTS = [
      'Paid Media - Dashboard',
      'Paid Media - no dash',
      'Paid Media One Sheeter',
      'Paid Media - Wrap-Up',
    ];
    const REPORTING_STORAGE_KEY = 'tja_reporting_items_v1';

    function loadReportingItems() {
      try {
        const raw = localStorage.getItem(REPORTING_STORAGE_KEY);
        if (!raw) return [];
        const parsed = JSON.parse(raw);
        return Array.isArray(parsed) ? parsed : [];
      } catch { return []; }
    }
    function saveReportingItems(items) {
      try { localStorage.setItem(REPORTING_STORAGE_KEY, JSON.stringify(items)); } catch {}
    }
    function blankReportingItem(month) {
      return {
        id: 'rpt-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 6),
        month: month || fmtMonthIso(new Date()),
        client: '',
        pod: '',
        department: 'Paid Media - Dashboard',
        startReporting: '',
        pathlabsDueToTJA: '',
        pathlabsReceived: false,
        internalProofing: '',
        datesConfirmedByCS: false,
        routedInWMJ: false,
        dueToClient: '',
        complete: false,
        notes: '',
      };
    }
    function fmtMonthIso(d) {
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
    }
    function fmtMonthLabel(monthIso) {
      if (!monthIso) return '';
      const [y, m] = monthIso.split('-').map(Number);
      const d = new Date(y, m - 1, 1);
      return d.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
    }
    function shiftMonth(monthIso, delta) {
      const [y, m] = monthIso.split('-').map(Number);
      const d = new Date(y, m - 1 + delta, 1);
      return fmtMonthIso(d);
    }
    function nearestUpcomingDeadline(item, today) {
      const fields = [
        ['pathlabsDueToTJA', 'Pathlabs → TJA'],
        ['internalProofing', 'Internal Proof'],
        ['dueToClient', 'Due to Client'],
      ];
      let best = null;
      for (const [k, label] of fields) {
        if (!item[k]) continue;
        // Skip the Pathlabs milestone once the team has marked the report
        // received — no point counting down to a deadline already met.
        if (k === 'pathlabsDueToTJA' && item.pathlabsReceived) continue;
        const d = parseDateSafe(item[k]);
        if (!d) continue;
        if (item.complete) continue;
        if (!best || d < best.date) best = { date: d, key: k, label };
      }
      if (!best) return null;
      const days = businessDaysBetween(today, startOfDay(best.date));
      return { ...best, businessDaysLeft: days };
    }

    // Seed data extracted from the 2026 Monthly Reporting Docs PDF
    // (specifically page 13's "Insights" cadence calendar, which gives the
    // unambiguous Pathlabs delivery date per client per month). Internal
    // proofing = Pathlabs + 3 business days. Due to client targets the
    // 15th of the delivery month or Pathlabs + 5 biz days, whichever is later
    // (per the "all reporting complete by the 15th" note on page 13).
    const SEED_REPORTING_DATA = (() => {
      // Reporting cycle month (the month being reported on) per column index
      const reportingMonths = ['2025-12','2026-01','2026-02','2026-03','2026-04','2026-05',
                               '2026-06','2026-07','2026-08','2026-09','2026-10','2026-11'];
      // [client, pod, dept, [Dec25, Jan26, Feb26, ..., Nov26]]
      // Each value is the 'M/D' that Pathlabs delivers insights for that report
      const rows = [
        ['276 - Mountain Shadows', 'Kyle / Trinity', 'Paid Media - Dashboard',
          ['1/7','2/5','3/5','4/6','5/6','6/5','7/7','8/6','9/4','10/6','11/5','12/4']],
        ['131 - Hotel Valley Ho', 'Kyle / Trinity', 'Paid Media - Dashboard',
          ['1/7','2/5','3/5','4/6','5/6','6/5','7/7','8/6','9/4','10/6','11/5','12/4']],
        ['500 - The Dream Wheel', 'Frankie / Claire', 'Paid Media - Dashboard',
          ['1/9','2/9','3/9','4/8','5/8','6/9','7/9','8/10','9/9','10/8','11/9','12/8']],
        ['511 - Skyviews Miami', 'Frankie / Claire', 'Paid Media - Dashboard',
          ['1/9','2/9','3/9','4/8','5/8','6/9','7/9','8/10','9/9','10/8','11/9','12/8']],
        ['484 - USAP Golden Ticket', 'Kyle / Alex', 'Paid Media - Dashboard',
          ['1/9','2/11','3/9','4/8','5/8','6/9','7/9','','','','','']],
        ['526 - JDM', 'Alysha / Trinity', 'Paid Media - Dashboard',
          ['1/13','2/11','3/11','4/10','5/12','6/11','7/13','8/12','9/11','10/12','11/12','12/10']],
        ['001 - TJA', 'Alysha / Trinity', 'Paid Media - Dashboard',
          ['1/15','2/13','3/13','4/10','5/12','6/11','7/13','8/12','9/11','10/12','11/12','12/10']],
        ['499 - RCS', 'Frankie / Claire', 'Paid Media - no dash',
          ['','2/2','3/2','4/13','5/11','6/8','7/6','8/3','','','','']],
        ['245 - STB', 'Frankie / Alex', 'Paid Media - no dash',
          ['','2/10','3/9','4/20','','','','','','','','']],
        ['541 - A New Leaf', 'Frankie / Kyle / Claire', 'Paid Media - Dashboard',
          ['1/13','','','4/6','5/6','','','','','','','']],
        ['540 - JoJo Coffeehouse', 'Kyle / Alex', 'Paid Media - Dashboard',
          ['','2/9','3/11','','','','','','','','','']],
      ];
      const today = startOfDay(new Date());
      const items = [];
      rows.forEach(([client, pod, dept, dates]) => {
        dates.forEach((md, idx) => {
          if (!md || md === 'TBD' || md === 'N/A') return;
          const reportingMonth = reportingMonths[idx];
          const [m, d] = md.split('/').map(Number);
          if (!m || !d) return;
          const [ry, rm] = reportingMonth.split('-').map(Number);
          // Pathlabs delivery is in the calendar month AFTER reportingMonth
          let yy = ry;
          if (m <= rm) yy = ry + 1;
          const pathlabsIso = `${yy}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
          const pathlabsDate = parseDateSafe(pathlabsIso);
          const proofIso = pathlabsDate ? fmtDateIso(addBusinessDays(pathlabsDate, 3)) : '';
          // Due to client: max(15th of delivery month, pathlabs + 5 biz days)
          const target15 = parseDateSafe(`${yy}-${String(m).padStart(2,'0')}-15`);
          const plus5 = pathlabsDate ? addBusinessDays(pathlabsDate, 5) : null;
          const dueClientDate = (plus5 && target15 && plus5 > target15) ? plus5 : target15;
          const dueClientIso = dueClientDate ? fmtDateIso(dueClientDate) : '';
          const isPast = dueClientDate && dueClientDate < today;
          items.push({
            month: reportingMonth, client, pod, department: dept,
            startReporting: '',
            pathlabsDueToTJA: pathlabsIso,
            pathlabsReceived: !!isPast,
            internalProofing: proofIso,
            datesConfirmedByCS: !!isPast,
            routedInWMJ: !!isPast,
            dueToClient: dueClientIso,
            complete: !!isPast,
            notes: 'Imported from 2026 Monthly Reporting Docs',
          });
        });
      });

      // USAP Golden Ticket runs event-specific wrap-up reports alongside the
      // monthly dashboard. Each row below uses the concrete dates pulled from
      // the per-month pages of the reporting plan (not the page-13 cadence).
      // Format: [reportingMonth, pod, label, pathlabsMD, proofMD, dueClientMD]
      const USAP_WRAPUPS = [
        ['2026-01', 'Sabrina / Alex', 'Wrap-Up Exec',           '2/11', '2/16', '2/18'],
        ['2026-01', 'Sabrina / Alex', 'Board Exec Summary',     '2/11', '2/19', '2/20'],
        ['2026-02', 'Sabrina / Alex', 'Wrap-Up Opelika',        '3/10', '3/13', '3/17'],
        ['2026-02', 'Sabrina / Alex', 'Mid-Campaign Analysis',  '3/11', '3/16', '3/20'],
        ['2026-02', 'Sabrina / Alex', 'Wrap-Up Boise',          '3/20', '3/26', '3/31'],
        ['2026-03', 'Sab / Alex',     'SD Wrap-Up (2 Bd + MarComm)', '4/20', '4/23', '4/28'],
        ['2026-05', 'Kyle / Alex',    'All-Campaign Wrap Up',   '6/17', '6/23', '6/25'],
        ['2026-11', 'Kyle / Alex',    'Glendale Recap',         '1/14', '1/16', '1/20'],
      ];
      USAP_WRAPUPS.forEach(([reportingMonth, pod, label, plMD, proofMD, dueMD]) => {
        const [ry, rm] = reportingMonth.split('-').map(Number);
        const expand = (md) => {
          if (!md) return '';
          const [m, d] = md.split('/').map(Number);
          if (!m || !d) return '';
          let yy = ry;
          if (m <= rm) yy = ry + 1;
          return `${yy}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        };
        const pathlabsIso = expand(plMD);
        const proofIso = expand(proofMD);
        const dueClientIso = expand(dueMD);
        const dueClientDate = parseDateSafe(dueClientIso);
        const isPast = dueClientDate && dueClientDate < today;
        items.push({
          month: reportingMonth,
          client: '484 - USAP Golden Ticket',
          pod,
          department: 'Paid Media - Wrap-Up',
          startReporting: '',
          pathlabsDueToTJA: pathlabsIso,
          pathlabsReceived: !!isPast,
          internalProofing: proofIso,
          datesConfirmedByCS: !!isPast,
          routedInWMJ: !!isPast,
          dueToClient: dueClientIso,
          complete: !!isPast,
          notes: `${label} — wrap-up report (imported from 2026 reporting plan)`,
        });
      });

      return items;
    })();

    function ReportingView({ items, setItems }) {
      // Default to the most recent reporting cycle (last completed month) on
      // open, since that's typically the cycle being delivered right now.
      const [activeMonth, setActiveMonth] = useState(() => shiftMonth(fmtMonthIso(new Date()), -1));
      const [search, setSearch] = useState('');
      const [showCompleted, setShowCompleted] = useState(true);

      const today = startOfDay(new Date());

      const filtered = useMemo(() => {
        const q = search.trim().toLowerCase();
        return items.filter((i) => {
          if (i.month !== activeMonth) return false;
          if (!showCompleted && i.complete) return false;
          if (q) {
            const hay = [i.client, i.pod, i.department, i.notes].join(' ').toLowerCase();
            if (!hay.includes(q)) return false;
          }
          return true;
        });
      }, [items, activeMonth, search, showCompleted]);

      const stats = useMemo(() => {
        const total = filtered.length;
        const complete = filtered.filter((i) => i.complete).length;
        let overdue = 0, upcoming = 0;
        filtered.forEach((i) => {
          const n = nearestUpcomingDeadline(i, today);
          if (!n) return;
          if (n.businessDaysLeft < 0) overdue++;
          else if (n.businessDaysLeft <= 5) upcoming++;
        });
        return { total, complete, overdue, upcoming };
      }, [filtered, today]);

      const updateItem = (id, patch) => {
        setItems((prev) => prev.map((i) => (i.id === id ? { ...i, ...patch } : i)));
      };
      const removeItem = (id) => {
        setItems((prev) => prev.filter((i) => i.id !== id));
      };
      const addItem = () => {
        setItems((prev) => [...prev, blankReportingItem(activeMonth)]);
      };
      const duplicateForNextMonth = () => {
        const nextMonth = shiftMonth(activeMonth, 1);
        const cloned = filtered.map((i) => ({
          ...i,
          id: 'rpt-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 6),
          month: nextMonth,
          startReporting: '',
          pathlabsDueToTJA: '',
          internalProofing: '',
          dueToClient: '',
          datesConfirmedByCS: false,
          routedInWMJ: false,
          complete: false,
        }));
        setItems((prev) => [...prev, ...cloned]);
        setActiveMonth(nextMonth);
      };

      // The reporting cycle is named after the data being reported on
      // (e.g. "April Reporting"), but the Pathlabs handoffs, internal
      // proofing and client delivery dates all land in the FOLLOWING
      // calendar month. Surface that explicitly so it's not confusing.
      const deliveryMonth = shiftMonth(activeMonth, 1);
      const earliestDate = useMemo(() => {
        let earliest = null;
        filtered.forEach((i) => {
          [i.pathlabsDueToTJA, i.internalProofing, i.dueToClient].forEach((iso) => {
            if (!iso) return;
            const d = parseDateSafe(iso);
            if (!d) return;
            if (!earliest || d < earliest) earliest = d;
          });
        });
        return earliest;
      }, [filtered]);
      const latestDate = useMemo(() => {
        let latest = null;
        filtered.forEach((i) => {
          [i.pathlabsDueToTJA, i.internalProofing, i.dueToClient].forEach((iso) => {
            if (!iso) return;
            const d = parseDateSafe(iso);
            if (!d) return;
            if (!latest || d > latest) latest = d;
          });
        });
        return latest;
      }, [filtered]);

      return (
        <div className="space-y-4">
          {/* Header */}
          <div className="bg-stone-900 border border-stone-800 rounded-sm p-4">
            <div className="flex items-center justify-between gap-3 flex-wrap">
              <div>
                <div className="text-[10px] uppercase tracking-[0.3em] font-bold text-amber-400 mb-1">Paid Media Reporting</div>
                <h2 className="text-xl font-black text-amber-50">{fmtMonthLabel(activeMonth)} Paid Media Reporting</h2>
              </div>
              <div className="flex items-center gap-2 flex-wrap">
                <div className="flex items-center gap-1 bg-stone-950 border border-stone-800 rounded-sm">
                  <button onClick={() => setActiveMonth(shiftMonth(activeMonth, -1))} className="p-1.5 text-stone-300 hover:text-amber-400">
                    <ChevronLeft className="w-4 h-4" />
                  </button>
                  <input
                    type="month"
                    value={activeMonth}
                    onChange={(e) => setActiveMonth(e.target.value)}
                    className="bg-transparent text-amber-50 text-xs font-bold px-1 py-1 focus:outline-none"
                  />
                  <button onClick={() => setActiveMonth(shiftMonth(activeMonth, 1))} className="p-1.5 text-stone-300 hover:text-amber-400">
                    <ChevronRight className="w-4 h-4" />
                  </button>
                </div>
                <button onClick={() => setActiveMonth(fmtMonthIso(new Date()))} className="px-2 py-1.5 text-[10px] font-bold uppercase tracking-wider bg-stone-800 hover:bg-stone-700 text-stone-300 rounded-sm">
                  Today
                </button>
                <button onClick={duplicateForNextMonth} disabled={filtered.length === 0} className="flex items-center gap-1 px-2 py-1.5 text-[10px] font-bold uppercase tracking-wider bg-stone-800 hover:bg-orange-500 hover:text-stone-950 text-stone-300 rounded-sm disabled:opacity-40 disabled:cursor-not-allowed" title="Copy this month's items into next month with dates cleared">
                  <Copy className="w-3 h-3" /> Roll to next month
                </button>
                <button
                  onClick={() => {
                    const msg = items.length > 0
                      ? `Import ${SEED_REPORTING_DATA.length} pre-filled rows from the 2026 Monthly Reporting Docs PDF? They'll be added alongside your existing rows.`
                      : `Import ${SEED_REPORTING_DATA.length} pre-filled rows from the 2026 Monthly Reporting Docs PDF?`;
                    if (!confirm(msg)) return;
                    const seeded = SEED_REPORTING_DATA.map((s) => ({
                      ...s,
                      id: 'rpt-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 6),
                    }));
                    setItems((prev) => [...prev, ...seeded]);
                  }}
                  className="flex items-center gap-1 px-2 py-1.5 text-[10px] font-bold uppercase tracking-wider bg-stone-800 hover:bg-amber-400 hover:text-stone-950 text-stone-300 rounded-sm"
                  title="Pre-fill with the cadence from your 2026 Monthly Reporting Docs PDF"
                >
                  <Download className="w-3 h-3" /> Import PDF Plan
                </button>
                <button onClick={() => addItem()} className="flex items-center gap-1.5 px-3 py-1.5 bg-amber-400 text-stone-950 rounded-sm text-xs font-bold uppercase tracking-wider hover:bg-amber-300">
                  <Plus className="w-3.5 h-3.5" /> Add Item
                </button>
              </div>
            </div>
          </div>

          {/* Cycle vs delivery banner — clarifies that April reporting deadlines land in May, etc. */}
          <div className="bg-pink-950/30 border border-pink-800/40 rounded-sm p-3 flex items-start gap-3 flex-wrap">
            <CalendarDays className="w-4 h-4 text-pink-300 flex-shrink-0 mt-0.5" />
            <div className="flex-1 min-w-[200px]">
              <div className="text-[10px] font-black uppercase tracking-[0.25em] text-pink-300 mb-0.5">
                {fmtMonthLabel(activeMonth)} reporting cycle
              </div>
              <div className="text-xs text-stone-300">
                Deliverables land in <span className="font-bold text-pink-200">{fmtMonthLabel(deliveryMonth)}</span>
                {earliestDate && latestDate && (
                  <> &mdash; deadlines run <span className="text-stone-100 font-bold">{fmtDateShort(earliestDate)} → {fmtDateShort(latestDate)}</span></>
                )}.
              </div>
              <div className="text-[11px] text-stone-400 mt-1">
                All reporting deadlines now appear on the main <span className="text-pink-300 font-bold">Calendar</span> tab alongside campaign tasks. Toggle the <span className="text-pink-300 font-bold">Reporting</span> role chip there to show or hide them.
              </div>
            </div>
          </div>

          {/* Stats — now spanning full width since the mini calendar is gone */}
          <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
            <div className="bg-stone-900 border border-stone-800 rounded-sm p-3">
              <div className="text-[10px] uppercase tracking-widest text-stone-500 font-bold">Total</div>
              <div className="text-2xl font-black text-amber-50">{stats.total}</div>
            </div>
            <div className="bg-stone-900 border border-emerald-800/40 rounded-sm p-3">
              <div className="text-[10px] uppercase tracking-widest text-emerald-400 font-bold">Complete</div>
              <div className="text-2xl font-black text-emerald-300">{stats.complete}</div>

    function CalendarDayPopover({ date, events, anchorRect, onClose, onOpenCampaign }) {
      // Position: try to place near the anchor, but keep within viewport.
      const popRef = useRef(null);
      const [pos, setPos] = useState(() => {
        if (!anchorRect) return { top: 80, left: 80, width: 320 };
        const vw = window.innerWidth; const vh = window.innerHeight;
        const W = Math.min(360, vw - 24);
        const H = 320;
        // Use viewport coords because the popover uses position: fixed
        let top = anchorRect.bottom + 6;
        let left = anchorRect.left;
        if (left + W > vw - 12) left = vw - W - 12;
        if (left < 12) left = 12;
        if (anchorRect.bottom + H > vh - 12) {
          top = Math.max(12, anchorRect.top - H - 6);
        }
        return { top, left, width: W };
      });

      useEffect(() => {
        const onKey = (e) => { if (e.key === 'Escape') onClose(); };
        document.addEventListener('keydown', onKey);
        return () => document.removeEventListener('keydown', onKey);
      }, [onClose]);

      const isMobile = window.innerWidth < 640;

      const headerLabel = date.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });

      const content = (
        <div ref={popRef} className="bg-stone-900 border border-stone-700 rounded-sm shadow-2xl overflow-hidden">
          <div className="flex items-center justify-between px-4 py-2.5 border-b border-stone-800 bg-stone-900">
            <div className="font-black text-amber-50 text-xs uppercase tracking-[0.15em]">{headerLabel}</div>
            <button onClick={onClose} className="p-1 text-stone-400 hover:text-amber-300 hover:bg-stone-800 rounded-sm" aria-label="Close">
              <X className="w-4 h-4" />
            </button>
          </div>
          <div className="max-h-80 overflow-y-auto">
            {events.length === 0 ? (
              <div className="px-4 py-6 text-xs text-stone-500 italic text-center">Nothing scheduled.</div>
            ) : events.map((ev, i) => {
              const cfg = ROLES[ev.role] || ROLES[DEFAULT_ROLE];
              const launch = ev.isLaunchDate;
              return (
                <button
                  key={ev.taskId + ':' + ev.campaignId + ':' + i}
                  onClick={() => onOpenCampaign(ev.campaignId)}
                  className="w-full text-left px-4 py-2.5 border-b border-stone-800 last:border-b-0 hover:bg-stone-800/60 transition-colors flex items-start gap-2.5"
                >
                  {launch ? (
                    <Flag className="w-4 h-4 mt-0.5 flex-shrink-0" style={{ color: ROLES['Paid Media'].color, fill: ROLES['Paid Media'].color }} strokeWidth={1.5} />
                  ) : (
                    <span className="w-2.5 h-2.5 rounded-full mt-1.5 flex-shrink-0" style={{ backgroundColor: cfg.color }}></span>
                  )}
                  <div className="min-w-0 flex-1">
                    <div className="flex items-center gap-1.5 flex-wrap">
                      <span className={`text-sm font-semibold ${ev.completed ? 'line-through text-stone-500' : 'text-stone-100'}`}>
                        {launch ? (ev.isToolkit ? 'LAUNCH (Toolkit)' : 'LAUNCH') : ev.taskName}
                      </span>
                      {ev.completed && <CheckCircle2 className="w-3.5 h-3.5 text-emerald-400 flex-shrink-0" />}
                    </div>
                    <div className="text-[11px] text-stone-400 truncate mt-0.5">
                      {ev.campaignName}
                      {ev.client && <span className="text-stone-600"> · {ev.client}</span>}
                    </div>
                    {!launch && (
                      <div className="text-[10px] uppercase tracking-wider font-bold mt-1" style={{ color: cfg.color }}>{cfg.label}</div>
                    )}
                  </div>
                </button>
              );
            })}
          </div>
        </div>
      );

      if (isMobile) {
        return (
          <div className="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-end justify-center" onClick={onClose}>
            <div className="w-full max-h-[80vh]" onClick={(e) => e.stopPropagation()}>{content}</div>
          </div>
        );
      }

      return (
        <>
          <div className="fixed inset-0 z-40" onClick={onClose} />
          <div
            className="fixed z-50"
            style={{ top: pos.top, left: pos.left, width: pos.width || 320 }}
            onClick={(e) => e.stopPropagation()}
          >
            {content}
          </div>
        </>
      );
    }

    function NewCampaignModal({ onClose, onCreate, existingClients, campaigns }) {
      const [name, setName] = useState('');
      const [client, setClient] = useState('');
      const [launchDate, setLaunchDate] = useState('');
      const [duplicateFromId, setDuplicateFromId] = useState('');
      const [creating, setCreating] = useState(false);
      const [error, setError] = useState('');
      const [showClientSuggest, setShowClientSuggest] = useState(false);

      const filteredSuggestions = useMemo(() => {
        if (!client) return existingClients.slice(0, 5);
        const q = client.toLowerCase();
        return existingClients.filter((c) => c.toLowerCase().includes(q) && c.toLowerCase() !== q).slice(0, 5);
      }, [client, existingClients]);

      const handleSubmit = async (e) => {
        e.preventDefault();
        setError('');
        if (!name.trim() || !launchDate) {
          setError('Name and launch date are required.');
          return;
        }
        setCreating(true);
        try {
          let data = defaultCampaignData();
          if (duplicateFromId) {
            const src = campaigns.find((c) => c.id === duplicateFromId);
            if (src && src.data) {
              data = JSON.parse(JSON.stringify(src.data));
              data.completedTasks = {};
              data.skippedTasks = {};
              data.shiftHistory = [];
              data.originalLaunchDate = '';
            }
          }
          await onCreate({ name: name.trim(), client: client.trim() || null, launch_date: launchDate, data });
        } catch (err) {
          setError(err.message || 'Failed to create campaign.');
        } finally {
          setCreating(false);
        }
      };

      return (
        <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
          <div className="bg-stone-900 border border-stone-700 rounded-sm max-w-md w-full p-6 shadow-2xl">
            <div className="flex items-center gap-2 mb-4">
              <Plus className="w-4 h-4 text-amber-400" />
              <h3 className="font-black text-amber-50 text-sm uppercase tracking-[0.2em]">New Campaign</h3>
            </div>
            <form onSubmit={handleSubmit} className="space-y-3">
              <div>
                <label className="block text-[11px] font-bold uppercase tracking-wider text-stone-400 mb-1">Name *</label>
                <input type="text" required value={name} onChange={(e) => setName(e.target.value)} placeholder="e.g. Nationals 2026" className="w-full px-3 py-2 bg-stone-800 border border-stone-700 rounded-sm text-sm text-stone-100 placeholder:text-stone-500 focus:outline-none focus:ring-2 focus:ring-amber-400" autoFocus />
              </div>
              <div className="relative">
                <label className="block text-[11px] font-bold uppercase tracking-wider text-stone-400 mb-1">Client</label>
                <input
                  type="text"
                  value={client}
                  onChange={(e) => { setClient(e.target.value); setShowClientSuggest(true); }}
                  onFocus={() => setShowClientSuggest(true)}
                  onBlur={() => setTimeout(() => setShowClientSuggest(false), 150)}
                  placeholder="e.g. USA Pickleball"
                  className="w-full px-3 py-2 bg-stone-800 border border-stone-700 rounded-sm text-sm text-stone-100 placeholder:text-stone-500 focus:outline-none focus:ring-2 focus:ring-amber-400"
                />
                {showClientSuggest && filteredSuggestions.length > 0 && (
                  <div className="absolute top-full left-0 right-0 mt-1 bg-stone-800 border border-stone-700 rounded-sm shadow-lg z-10 max-h-40 overflow-y-auto">
                    {filteredSuggestions.map((s) => (
                      <button key={s} type="button" onMouseDown={() => { setClient(s); setShowClientSuggest(false); }} className="w-full text-left px-3 py-1.5 text-sm text-stone-200 hover:bg-stone-700">
                        {s}
                      </button>
                    ))}
                  </div>
                )}
              </div>
              <div>
                <label className="block text-[11px] font-bold uppercase tracking-wider text-stone-400 mb-1">Launch date *</label>
                <input type="date" required value={launchDate} onChange={(e) => setLaunchDate(e.target.value)} className="w-full px-3 py-2 bg-stone-800 border border-stone-700 rounded-sm text-sm text-stone-100 focus:outline-none focus:ring-2 focus:ring-amber-400 [color-scheme:dark]" />
              </div>
              {campaigns.length > 0 && (
                <div>
                  <label className="block text-[11px] font-bold uppercase tracking-wider text-stone-400 mb-1">Duplicate from (optional)</label>
                  <select value={duplicateFromId} onChange={(e) => setDuplicateFromId(e.target.value)} className="w-full px-3 py-2 bg-stone-800 border border-stone-700 rounded-sm text-sm text-stone-100 focus:outline-none focus:ring-2 focus:ring-amber-400">
                    <option value="">Start fresh</option>

                      <option key={c.id} value={c.id}>{c.name}{c.client ? ` — ${c.client}` : ''}</option>

                  <p className="text-[11px] text-stone-500 mt-1 italic">Copies config + custom tasks. Progress & shift history reset.</p>

                <div className="flex items-start gap-2 p-2.5 bg-red-950/40 border border-red-800/50 rounded-sm text-xs text-red-300">
                  <AlertCircle className="w-4 h-4 flex-shrink-0 mt-0.5" />
                  <span>{error}</span>
                </div>
              )}
              <div className="flex gap-2 pt-2">
                <button type="submit" disabled={creating} className="flex-1 flex items-center justify-center gap-2 px-3 py-2 bg-amber-400 text-stone-950 rounded-sm text-xs font-bold uppercase tracking-wider hover:bg-amber-300 disabled:opacity-50">

              </div>
            </form>
          </div>

    function NewToolkitModal({ onClose, onCreate, existingClients, campaigns }) {
      const [name, setName] = useState('');

      const [launchDate, setLaunchDate] = useState('');
      const [duplicateFromId, setDuplicateFromId] = useState('');
      const [creating, setCreating] = useState(false);
      const [error, setError] = useState('');
      const [showClientSuggest, setShowClientSuggest] = useState(false);

      const existingToolkits = useMemo(
        () => campaigns.filter((c) => c.data && c.data.kind === 'toolkit'),
        [campaigns]
      );

      const filteredSuggestions = useMemo(() => {
        if (!client) return existingClients.slice(0, 5);
        const q = client.toLowerCase();
        return existingClients.filter((c) => c.toLowerCase().includes(q) && c.toLowerCase() !== q).slice(0, 5);
      }, [client, existingClients]);

      const handleSubmit = async (e) => {
        e.preventDefault();
        setError('');
        if (!name.trim()) {
          setError('Name is required.');
          return;
        }
        setCreating(true);
        try {
          let placements = [];
          if (duplicateFromId) {
            const src = campaigns.find((c) => c.id === duplicateFromId);
            if (src && src.data && src.data.toolkit && Array.isArray(src.data.toolkit.placements)) {
              // Deep clone, then re-id every placement so we don't collide with the source.
              placements = JSON.parse(JSON.stringify(src.data.toolkit.placements)).map((p) => ({
                ...p,
                id: newPlacementId(),
              }));
            }
          }
          await onCreate({
            name: name.trim(),
            client: client.trim() || null,
            launch_date: launchDate || null,
            data: { kind: 'toolkit', toolkit: { placements } },
          });
        } catch (err) {
          setError(err.message || 'Failed to create toolkit.');
        } finally {
          setCreating(false);
        }
      };

      return (
        <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
          <div className="bg-stone-900 border border-stone-700 rounded-sm max-w-md w-full p-6 shadow-2xl">
            <div className="flex items-center gap-2 mb-1">
              <Plus className="w-4 h-4 text-orange-400" />
              <h3 className="font-black text-amber-50 text-sm uppercase tracking-[0.2em]">New Toolkit</h3>

            <p className="text-[11px] text-stone-500 mb-4 italic">Standalone Creative Toolkit — no blueprint, no channels. Just placements.</p>

              </div>
              <div className="relative">
                <label className="block text-[11px] font-bold uppercase tracking-wider text-stone-400 mb-1">Client</label>
                <input
                  type="text"
                  value={client}
                  onChange={(e) => { setClient(e.target.value); setShowClientSuggest(true); }}
                  onFocus={() => setShowClientSuggest(true)}
                  onBlur={() => setTimeout(() => setShowClientSuggest(false), 150)}
                  placeholder="e.g. USA Pickleball"
                  className="w-full px-3 py-2 bg-stone-800 border border-stone-700 rounded-sm text-sm text-stone-100 placeholder:text-stone-500 focus:outline-none focus:ring-2 focus:ring-orange-400"

                {showClientSuggest && filteredSuggestions.length > 0 && (
                  <div className="absolute top-full left-0 right-0 mt-1 bg-stone-800 border border-stone-700 rounded-sm shadow-lg z-10 max-h-40 overflow-y-auto">

                        {s}

                  </div>
                )}

                <label className="block text-[11px] font-bold uppercase tracking-wider text-stone-400 mb-1">Launch date <span className="text-stone-600 normal-case font-normal">(optional)</span></label>

              {existingToolkits.length > 0 && (
                <div>

                    <option value="">Start fresh</option>
